<header><h1>第2章 · 单人匿名回答评分</h1><p>60份校准 → 锁定裁判与规则 → 60份验收。表中不显示模型、方法、预算或AI评分。</p></header>
<main>
<div class="bar"><label>加载本阶段 packets.json<br><input id="packets" type="file" accept=".json"></label><label>载入已导出草稿<br><input id="restore" type="file" accept=".json"></label><label>真人评审姓名<br><input id="reviewer" type="text" placeholder="填写实际评审人"></label></div>
<p id="message" role="status">请先选择 calibration/packets.json，载入已绑定的任务记录。验收阶段尚未解锁。</p>
<div class="bar"><span id="progress">未加载</span><button id="draft" disabled>导出草稿</button><button id="export" disabled>导出60份已完成评分</button><button id="previous" disabled>上一份</button><button id="next" disabled>下一份</button></div>
<div class="layout"><nav id="nav"></nav><article id="sample"><div class="card">请独立对照必要点、完整回答及原始资料评分。Unknown表示确实无法判断，空白表示尚未评分。普通评分不要求写理由；争议可简记。只评最终交付回答，不要求模型展示思考过程。</div></article></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),V='ch2_five_level_dual_eas';
let packet=null,labels=[],index=0,dirty=false;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const canonical=v=>Array.isArray(v)?'['+v.map(canonical).join(',')+']':v!==null&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}':JSON.stringify(v);
async function digest(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical(v)));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
const validScore=v=>[0,.25,.5,.75,1,'unknown'].includes(v);
const complete=(p,l)=>p.binding_status==='bound'&&!!l.reviewer?.trim()&&l.record.points.every(x=>validScore(x.score))&&validScore(l.record.fact_gate)&&(p.conditional?validScore(l.record.applicability_gate):l.record.applicability_gate==='not_applicable');
function blank(p){return {sample_id:p.sample_id,reviewer:null,reviewed_utc:null,packet_sha256:null,record:{schema_version:V,sample_id:p.sample_id,judge_id:'human',judge_version:'single-human-reference-v1',status:'pending',points:p.criteria.map(c=>({criterion_id:c.criterion_id,score:null,reason:'',answer_quote:''})),fact_gate:null,applicability_gate:p.conditional?null:'not_applicable',reason:''}}}
function update(){if(!packet)return;const n=packet.samples.filter((p,i)=>complete(p,labels[i])).length,bound=packet.samples.filter(p=>p.binding_status==='bound'),failed=bound.filter(p=>p.generation_failed).length;$('progress').textContent=`${packet.phase==='calibration'?'校准':'验收'}：${n}/60份人工复核完成；${bound.length}/60条任务已绑定，有效回答${bound.length-failed}份，生成失败${failed}条`;$('export').disabled=n!==60;$('draft').disabled=false;$('previous').disabled=index===0;$('next').disabled=index===59;[...$('nav').children].forEach((n,i)=>{n.className=(i===index?'active ':'')+(complete(packet.samples[i],labels[i])?'done':'')})}
function chooser(value,onchange,disabled=false){const s=el('select');for(const [v,t] of [['','— 尚未评分 —'],['0','0 · 未满足'],['0.25','0.25 · 少量满足'],['0.5','0.5 · 部分满足'],['0.75','0.75 · 大部分满足'],['1','1 · 完整满足'],['unknown','Unknown · 确实无法判断']]){const o=el('option',t);o.value=v;s.append(o)}s.value=value===null?'':String(value);s.disabled=disabled;s.onchange=()=>{onchange(s.value===''?null:s.value==='unknown'?'unknown':Number(s.value));dirty=true;update()};return s}
function draw(){if(!packet)return;const p=packet.samples[index],l=labels[index],a=$('sample');a.replaceChildren();a.append(el('h2',`第${index+1}份 · ${p.sample_id}`));const card=el('div',undefined,'card');a.append(card);card.append(el('h3','用户问题'),el('p',p.question),el('p','题目编号：'+p.question_id,'muted'),el('h3','匿名最终回答'));
if(p.binding_status!=='bound'){card.append(el('p','该任务尚无可评分回答，等待生成结果或传输核对。当前不能评分或导出全部完成标签。','notice'))}else{card.append(el('div',p.answer,'answer'));if(p.generation_failed)card.append(el('p','该任务未生成有效最终回答。请核验记录；计算端保留生成失败为0的规则。','notice'))}
if(p.binding_status==='bound'&&!p.generation_failed){card.append(el('h3','回答提交的引用'));const refs=el('ul');for(const r of p.references||[])refs.append(el('li',`${r.path}:${r.start}–${r.end}`));card.append(refs);if(!p.references?.length)card.append(el('p','回答未提交独立引用。','muted'))}
card.append(el('h3','参考答案与必要点'));const list=el('ol');p.criteria.forEach(c=>list.append(el('li',c.claim)));card.append(list,el('p','允许的回答范围：'+p.acceptable_answer_range),el('p','适用条件：'+p.applicability));if(p.critical_errors.length){card.append(el('p','应留意的错误：'+p.critical_errors.join('；')))}
const src=el('details');src.open=true;src.append(el('summary','原始资料依据（请同时留意上下文与公式疑点）'));for(const s of p.sources){const d=el('details');d.append(el('summary',`${s.evidence_id} · ${s.path}:${s.line_start}–${s.line_end}`),el('pre',s.excerpt),el('p','原文件SHA256：'+s.file_sha256,'muted'));src.append(d)}card.append(src);
const f=el('div',undefined,'card');a.append(f);f.append(el('h3','人工评分'),el('p','必要点K逐项评分；F评整答实质性事实；A只评条件判断。K的各必要点等权。0／0.25／0.5／0.75／1分别表示未满足／少量／部分／大部分／完整满足。','scale'));
const disabled=p.binding_status!=='bound';p.criteria.forEach((c,i)=>{const fs=el('fieldset');fs.append(el('legend',c.criterion_id),el('div',c.claim),chooser(l.record.points[i].score,v=>l.record.points[i].score=v,disabled));const t=el('textarea');t.placeholder='可选：简短争议备注或回答摘录';t.value=l.record.points[i].reason;t.disabled=disabled;t.oninput=()=>{l.record.points[i].reason=t.value;dirty=true};fs.append(t);f.append(fs)});
for(const [key,title,desc] of [['fact_gate','F · 事实正确性','从严重错误到全部实质性事实正确，按五档评分。'],['applicability_gate','A · 适用条件判断','条件题必须评分；非条件题固定N/A，不计入分母。']]){const fs=el('fieldset');fs.append(el('legend',title),el('p',desc,'scale'));if(key==='applicability_gate'&&!p.conditional)fs.append(el('p','N/A · 非条件题'));else fs.append(chooser(l.record[key],v=>l.record[key]=v,disabled));f.append(fs)}
const note=el('textarea');note.placeholder='可选：整答争议、资料或Gold问题';note.value=l.record.reason;note.disabled=disabled;note.oninput=()=>{l.record.reason=note.value;dirty=true};f.append(note);update()}
$('packets').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.schema!=='human_review_packets_v1'||v.samples?.length!==60||new Set(v.samples.map(p=>p.sample_id)).size!==60)throw Error('不是60份当前人工材料');if(!v.enabled_for_review)throw Error('验收阶段尚未解锁；请先完成校准和规则锁定。');if(!['calibration','acceptance'].includes(v.phase))throw Error('阶段无效');packet=v;labels=v.samples.map(blank);labels.forEach(l=>l.reviewer=$('reviewer').value.trim()||null);index=0;$('nav').replaceChildren();v.samples.forEach((p,i)=>{const b=el('button',`${String(i+1).padStart(2,'0')} · ${p.sample_id.slice(-6)}`);b.onclick=()=>{index=i;draw()};$('nav').append(b)});$('message').textContent='已载入。评分只保存在当前页面；请及时导出草稿。';dirty=false;draw()}catch(err){$('message').textContent=err.message}};
$('reviewer').oninput=()=>{labels.forEach(l=>l.reviewer=$('reviewer').value.trim()||null);dirty=true;update()};
$('previous').onclick=()=>{index--;draw()};$('next').onclick=()=>{index++;draw()};
async function download(finished){try{if(!packet)throw Error('请先载入材料');for(let i=0;i<labels.length;i++){const l=labels[i],p=packet.samples[i];l.reviewer=$('reviewer').value.trim()||null;l.packet_sha256=await digest(p);l.record.status=complete(p,l)?'complete':'pending';if(l.record.status==='complete'&&!l.reviewed_utc)l.reviewed_utc=new Date().toISOString()}if(finished&&labels.some((l,i)=>!complete(packet.samples[i],l)))throw Error('60份真实回答和所有评分项须完整');const v={schema:'human_review_labels_v1',phase:packet.phase,labels},blob=new Blob([JSON.stringify(v,null,2)+'\n'],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download=`${packet.phase}_${finished?'completed':'draft'}_human_labels.json`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);dirty=false;update()}catch(err){$('message').textContent=err.message}}
$('draft').onclick=()=>download(false);$('export').onclick=()=>download(true);
$('restore').onchange=async e=>{try{if(!packet)throw Error('先载入相应packets.json');const v=JSON.parse(await e.target.files[0].text());if(v.schema!=='human_review_labels_v1'||v.phase!==packet.phase||v.labels?.length!==60||new Set(v.labels.map(l=>l.sample_id)).size!==60)throw Error('草稿阶段或样本数量不一致');const by=new Map(v.labels.map(l=>[l.sample_id,l]));const restored=[];for(const p of packet.samples){const l=by.get(p.sample_id);if(!l||l.record.judge_id!=='human'||l.record.schema_version!==V||l.packet_sha256!==await digest(p)||canonical(l.record.points.map(x=>x.criterion_id).sort())!==canonical(p.criteria.map(x=>x.criterion_id).sort()))throw Error('草稿与当前题目、回答或必要点不一致');restored.push(l)}labels=restored;$('reviewer').value=labels[0].reviewer||'';dirty=false;draw();$('message').textContent='草稿已恢复。'}catch(err){$('message').textContent=err.message}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script>
<script id="confirmed-review-bundle" type="application/json">{"packet":{"schema":"human_review_packets_v1","phase":"calibration","enabled_for_review":true,"dataset_sha256":"d683a5b65a536797fc468a85d6aa7420625ba9e01c2b99e35aaf8450d87c48f6","samples":[{"sample_id":"R-22fc0a271924","question":"在 blastFoam 固相热输运模型中，constIso 与 constAnIso 对导热系数 kappa 的取值形式有何本质区别？这一区别对“各向同性/各向异性”判断意味着什么？","question_id":"E14-03","question_sha256":"5a2b53ccef715ee9707865c7434ab0765d3e4bb7438aab912a1baf7e4509abed","annotation_sha256":"56de7cc192f4cedd01b9406a57012a328bf053c0da9d877485cbebe9f57eaa5c","conditional":false,"criteria":[{"criterion_id":"E14-03.K1","claim":"constIso 使用常数标量值，对应各向同性导热系数。","evidence_ids":["X_solid_transport"]},{"criterion_id":"E14-03.K2","claim":"constAnIso 使用常数矢量值，对应各向异性导热系数。","evidence_ids":["X_solid_transport"]},{"criterion_id":"E14-03.K3","claim":"两者 kappa 的单位均为 W/m/K，区别在于标量还是矢量。","evidence_ids":["X_solid_transport"]}],"sources":[{"evidence_id":"X_solid_transport","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1009,"line_end":1027,"label":"solid_transport","excerpt":"## 5.4 Solid Transport\n\nThe transport models are used to define the thermal conductivity of the material. All transport models, with the exception of the tabulated methods are ported from OpenCFD Ltd. (2018b).\n\n### 5.4.1 constIso\n\nA constant, scalar value (isotropic), is used for for thermal conductivity.\n\n| Variable | Description |\n|---|---|\n| `kappa` | Thermal conductivity [W/m/K] |\n\n### 5.4.2 constAnIso\n\nA constant, vector value (anistropic), is used for thermal conductivity.\n\n| Variable | Description |\n|---|---|\n| `kappa` | Thermal conductivity (vector) [W/m/K] |","excerpt_sha256":"842f9291651b30e95bee41b989f9326e458f7b34492d3bf61d93e2c7952a8f5b"}],"applicability":"仅适用于固相热输运模型；原文未说明各向异性矢量如何映射到具体坐标方向，也未说明在爆炸载荷下的适用性验证。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把标量/矢量区别说成单位区别","把 constAnIso 说成各向同性","声称原文给出了各向异性方向的具体坐标定义"],"answer":"constIso使用一个标量值（同质性）来表示导热系数，constAnIso使用一个向量值（异质性）来表示导热系数，这意味着constIso适用于各向同性材料，而constAnIso适用于各向异性材料。","answer_sha256":"3cd8c28f57e4c175fce19098d97a58b9128af9d1e9929be5d75ebc5ccc64d016","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":1013,"end":1020}],"references_delivered":true},{"sample_id":"R-150962443949","question":"原文在 5.2.3 节说明，当某些状态方程无法转换为基于内能的形式时，会改用局部温度定义热力学压力。此时 Grüneisen 系数 Γ_i 与声速 c_i^2 分别按什么关系计算？","question_id":"E16-02","question_sha256":"18e96641954b4566cd144c30082e61160c2dffbd5050cf50ec8791262a934a08","annotation_sha256":"3c99a78c4fba405c833a0bcc4fdabbd00e33b39b877faea90b6f042ed6ed4f1c","conditional":false,"criteria":[{"criterion_id":"E16-02.K1","claim":"Γ_i 由 (v_i/C_v)(∂p/∂T) 定义，其中 C_v 为定容比热。","evidence_ids":["X_perfectgas"]},{"criterion_id":"E16-02.K2","claim":"声速平方由 v_i^2[(∂p_i/∂T)^2 T/C_v − ∂p/∂v_i] 给出。","evidence_ids":["X_perfectgas"]},{"criterion_id":"E16-02.K3","claim":"原文说明除非另有指定，这些关系用于计算相关量。","evidence_ids":["X_perfectgas"]}],"sources":[{"evidence_id":"X_perfectgas","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":661,"line_end":687,"label":"perfectgas","excerpt":"### 5.2.3 Temperature-based\n\nWhile it is preferable to use an internal energy based equation of state for compressible flows, some equations of state cannot be converted, and therefore use the local temperature to define the thermodynamic pressure. Generally the Grüneisen coefficient used to calculate the shared pressure is defined as\n\n$$\n\\Gamma_i = \\frac{v_i}{C_v}\\frac{\\partial p}{\\partial T}\n$$\n(5.63)\n\nwhere $C_v$ is the specific heat at constant volume, and the speed of sound is defined\n\n$$\nc^2_i = v^2_i\\left[ \\left( \\frac{\\partial p_i}{\\partial T} \\right)^2 \\frac{T}{C_v} - \\frac{\\partial p}{\\partial v_i} \\right]\n$$\n(5.64)\n\nUnless otherwise specified, these relations are used to calculate the relevant quantities.\n\n#### 5.2.3.1 perfectGas\n\nThe perfect gas equation of state uses the standard ideal gas pressure relation, however the specific heat ratio is not held constant, allowing for the use of non-constant heat capacity models.\n\n$$\np_i = RT\\rho_i\n$$\n(5.65)\n","excerpt_sha256":"aa84847bf222d3d8ed0b633a1cd087eed9f85392ae3a192875b3f9553245c6aa"}],"applicability":"适用于原文所述温度型状态方程分支；是否采用取决于该状态方程能否转换为内能形式。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把 Γ_i 写成常数 γ_i 而不含 ∂p/∂T","把声速公式中的 T/C_v 项遗漏或写成 C_v/T","忽略“除非另有指定”这一适用条件"],"answer":"当某些状态方程无法转换为基于内能的形式时，Grüneisen 系数 $\\Gamma_i$ 与声速 $c_i^2$ 的关系由公式 (5.16) 给出：$$c^2_i = \\frac{\\Gamma_i p + \\Pi_i}{\\rho_i} - \\delta_i(\\Gamma_i - 1)$$，其中 $\\delta_i$ 由公式 (5.17) 定义：$$\\delta_i = \\frac{-[p + \\Pi_i]\\Gamma'_i}{[\\Gamma_i - 1]^2} + \\frac{\\Pi'_i}{\\Gamma_i - 1}$$。此外，$\\Gamma_i$ 与 $\\Pi_i$ 的关系取决于具体的状态方程，例如在理想气体形式中，$\\Gamma_i = \\gamma_i$ 且 $\\Pi_i = 0$，而在 Tait 方程中，$\\Gamma_i = \\gamma_i$ 且 $\\Pi_i = \\gamma_i(b_i - a_i)$。","answer_sha256":"86bf2e38a2269dc3323e3266ad0572b8bee47ac2cde0e9af63141f63f48aec3e","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":257,"end":302},{"path":"manual/markdown/05_fluid_solid_thermo.md","start":422,"end":474}],"references_delivered":true},{"sample_id":"R-235d4357f6f9","question":"我给Mie-Grüneisen相准备了初始p、rho、T，没有提供内能场，但在状态方程字典中设了calculateDensity yes。初始化时会先处理rho还是内能？内能计算会直接沿用原rho，还是要等密度重算后再进行？","question_id":"E53-07","question_sha256":"18428964e706a434dd2124d786b6b8802e98054fd8675e341850f361ce7448fa","annotation_sha256":"95a16093b4023e5fe733a5f1d4019b27d1d55dfcb27569c07410f49257650290","conditional":true,"criteria":[{"criterion_id":"E53-07.K1","claim":"先用p、T计算rho。","evidence_ids":["X_thermo_initialization"]},{"criterion_id":"E53-07.K2","claim":"密度重算后再初始化内能，不跳过前一步沿用原rho；允许准确说明更新后的rho的用途。","evidence_ids":["X_thermo_initialization"]}],"sources":[{"evidence_id":"X_thermo_initialization","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1412,"line_end":1414,"label":"thermo_initialization","excerpt":"## 5.9 Initialization\n\nThe initialization of fields can be handled in several ways, but $\\rho_i$, $p$, and $T$ must be given as initial conditions. Some of these fields may be overwritten, but the boundary conditions are used to construct the conserved quantities. For equations of state in the Mie-Grüneisen form, by default the pressure and density are used to initialize the internal energy. Temperature based equations of state initialize the internal energy using the density and temperature. If the \"calculateDensity\" keyword is defined, and is set to \"yes\" in the given equation of state dictionary, then the density is calculated from the pressure and temperature prior to the initialization of the internal energy. Each of the initialization methods use a Newton-Raphson root finding method to find the necessary quantities. If the internal energy field is provided in the initial conditions folder, the pressure and temperature fields are calculated directly from the density and internal energy.","excerpt_sha256":"f8604d6e43dad19b0ffbea0aefa6fd6be1ef1867255955540de8f2106c0484db"}],"applicability":"Mie-Grüneisen相，初始rho、p、T已给且未提供e；calculateDensity设为yes。","acceptable_answer_range":"文献明确的是先后关系；不强制猜测所有内部实现分支。更新后的rho与p用于随后计算内能的解释不属于致命错误。","critical_errors":["跳过密度重算并直接使用题设原rho。","把内能初始化放在密度重算之前，或忽略开关必须设yes。"],"answer":"在Mie-Grüneisen模型中，初始化时会先处理密度（rho），然后再计算内能。由于没有提供内能场，模型会根据状态方程字典中的设置（calculateDensity yes）计算密度。因此，内能计算会直接沿用初始的rho值，而不是等密度重算后再进行。","answer_sha256":"9091a39242091cd512fd33fa1f137618c4aadd6e2c864fac4c223ea0449e3879","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-a4d15ed2fed1","question":"教程指出 burst patches 允许内部面在条件满足前与满足后表现不同。请结合该教程说明：在条件满足前，这些内部面被当作什么处理？条件满足后又发生什么？并指出该行为在教程中与哪类 patch 类型关联。","question_id":"E47-03","question_sha256":"eeca09056cf6f0c3f790507a5bee346aa20104ba1fb5cf4d37cfdf8474fb286f","annotation_sha256":"6119d42a383776f3c9553052e157122a31b86596cb4e8d7704ef8395c73ffd18","conditional":true,"criteria":[{"criterion_id":"E47-03.K1","claim":"在条件满足前，内部面被当作 walls 处理。","evidence_ids":["X_glass_readme"]},{"criterion_id":"E47-03.K2","claim":"条件满足后内部面行为改变（burst）。","evidence_ids":["X_glass_readme"]},{"criterion_id":"E47-03.K3","claim":"该教程中窗口使用 burstCyclicAMI patch 类型。","evidence_ids":["X_glass_readme"]}],"sources":[{"evidence_id":"X_glass_readme","path":"tutorials/blastFoam/internalDetonation/internalDetonation_withObstacleAndGlass/README.md","file_sha256":"bedf0f3b0523e4df44d90ccaf2a23a566e5bbf6c8df8b5c478580b0b43269981","line_start":1,"line_end":20,"label":"glass_readme","excerpt":"# Internal detonation with obstacle and glass tutorial\n\n## Notes\n\nThis case is used to illustrate how to both setup and use burst patches. The burst patches allow internal faces to act in one way prior to a condition being met, and internal faces after. In this case they are treated as walls prior to the overpressure or impulse reaching their burst condition (4e7 Pa and 1e4 Pa.s) respectively. It should be noted that the first two window burst due to the overpressure condition, while the final window bursts do to impulse. This can be seen due to the lag in time between when the primary pressure wave hits the final window and when it actually bursts.\n\nThe mesh is created using the following procedure\n\n\u003col\u003e\n    \u003cli\u003e Base mesh is created with \u003cstrong\u003eblockMesh\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003e Regions where windows will be placed are refined with \u003cstrong\u003esetRefinedFields\u003c/strong\u003e \u003c/li\u003e\n    \u003cli\u003e The outlet patch is added using \u003cstrong\u003ecreatePatch\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003e The windows are created by adding baffles with the \u003cem\u003eburstCyclicAMI\u003c/em\u003e patch type with \u003cstrong\u003ecreateBaffles\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003e Obstructions uses cellSets selected from running \u003cstrong\u003esetRefinedFields\u003c/strong\u003e and running \u003cstrong\u003esubsetMesh internalCells -patch walls\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003e The charge is the set using \u003cstrong\u003esetRefinedFields\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003e Finally the case can be run with \u003cstrong\u003eblastFoam\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\n\nThe case takes approximately 5 min to run on a single core desktop","excerpt_sha256":"bedf0f3b0523e4df44d90ccaf2a23a566e5bbf6c8df8b5c478580b0b43269981"}],"applicability":"仅描述该教程中 burstCyclicAMI 窗口在破裂前后的行为；不推断其他 burst 变体或未列出的物理细节。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["说条件满足前内部面是出口或自由面","说条件满足后内部面仍保持 wall","把该行为归到非 burstCyclicAMI 的 patch 类型"],"answer":"在条件满足前，这些内部面被当作墙壁处理；条件满足后，这些内部面会破裂。该行为在教程中与burstCyclicAMI类型的patch关联。","answer_sha256":"49063c752c2d6c34598a5bb6a5182c3b1ccf95ba63d8c1c92abc9429956da6e4","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/internalDetonation/internalDetonation_withObstacleAndGlass/README.md","start":5,"end":20}],"references_delivered":true},{"sample_id":"R-0f32329417ab","question":"若把 burstingWindow_workshop 实例中的 useDelta 从 no 改为 yes，而其他 burst 配置保持不变，依据 blastFoam 通用 burst 配置说明，burst 判定所依据的量会发生什么变化？请说明该改动的影响范围。","question_id":"E25-07","question_sha256":"018ca5aed943a59e147b53363246c41d06a6a152c17ee16261abfa54b2264931","annotation_sha256":"c7930fefb0fdddc188f25efe75c26e9f515feb5d529fdb46dd10a89b60bb9252","conditional":true,"criteria":[{"criterion_id":"E25-07.K1","claim":"useDelta 控制是否使用耦合 patch 之间的差值而非最大值。","evidence_ids":["X_burst_general"]},{"criterion_id":"E25-07.K2","claim":"实例原配置 useDelta 为 no，即不使用差值；改为 yes 后将改用差值。","evidence_ids":["X_burst_instance"]},{"criterion_id":"E25-07.K3","claim":"该改动只影响 useDelta 所控制的判定量选择，不改变 burstModel 仍为 pressure 这一事实。","evidence_ids":["X_burst_instance"]}],"sources":[{"evidence_id":"X_burst_general","path":"manual/markdown/07_burst_patches.md","file_sha256":"1c4fd9c6a681b0f0ad846967ff49ddc2737e234aa01e39536f41f493418c8097","line_start":1,"line_end":12,"label":"burst_general","excerpt":"# Burst patches\n\nThe ability to have a \"bursting\" patch can be used with the burst (external patch), burstCyclic (internal with no AMR), or burstCyclicAMI (general internal). All fields require an additional entry in their dictionaries name \"intactField\" which is used to specify the boundary condition of the field before bursting. The basic burst patch can be created using any mesh generation technique, however the cyclic variations require using the createBaffles utility, standard to OpenFOAM. See Sec. 20.5 for an example of how to create and use the patches.\n\n## 7.1 Burst models\n\nThe method to calculate where burst occurs is runtime-selectable and the inputs are placed in the constant/polyMesh/boundary file under the corresponding boundary. This can also be added in either the patch entry within blockMeshDict of snappyHexMeshDict.\n\n| Variable | Description |\n|---|---|\n| partialBurst | Can individual face burst (no by default) |\n| useDelta | Us the difference across coupled patches rather than the maximum value (yes by default) |","excerpt_sha256":"73e1a00497251f8dd4c749d29961fc2f10f84bb87f11e686f958ddbbf70b3f97"},{"evidence_id":"X_burst_instance","path":"tutorials/blastFoam/burstingWindow_workshop/system/createBafflesDict","file_sha256":"f6885b807b798f658906d858b0039ad627d0264c20dd76e616fbb8eb20979dca","line_start":19,"line_end":43,"label":"burst_instance","excerpt":"internalFacesOnly true;\n\n// Baffles to create.\nbaffles\n{\n    windows\n    {\n        //- Use surface to select faces and orientation.\n        type        faceZone;\n        zoneName    windows;\n\n\n        // Generate patchGroup windows with two patches:\n        //  - windows_master\n        //  - windows_slave\n        patchPairs\n        {\n            type            burstCyclicAMI;\n            burstModel      pressure;\n            partialBurst    yes;\n            pBurst          5e6;\n            useDelta        no;\n        }\n    }\n}","excerpt_sha256":"30589ef17de0c2e1f2854d221ecab060d94c3f4e20569ef537eab8c8853477a9"}],"applicability":"适用于 burstingWindow_workshop 实例的假设性改动分析；原文未给出该改动后的具体数值结果或物理验证。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["认为 useDelta 改动会切换 burstModel","认为 useDelta 控制 partialBurst","断言改动后必然发生或不发生 burst"],"answer":"根据blastFoam的burst配置说明，burst判定所依据的量会从最大值（useDelta=no）改为差值（useDelta=yes）。这意味着burst判定会基于两个相邻patch之间的压力差值，而不是单个patch的最大压力值。影响范围是burst判定的结果和相关的物理过程。","answer_sha256":"815bb3133b77729f7f1249f1cc38cb8209c50c3d2370833e10f39c1aac1af554","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/07_burst_patches.md","start":12,"end":13}],"references_delivered":true},{"sample_id":"R-961e29e7b822","question":"如果爆炸压力只有一个峰，并且它同时是第一次明显响应，能否由这个例子推断timeOfArrival在所有爆炸场景都测首次响应？","question_id":"P02-03","question_sha256":"fbc0c6cf27e93424d81da44f1b06dfa70f820cfa5f576e194c2efeebf65b3f4b","annotation_sha256":"001997f1d8f474a3d9a2a1e579c4aa0d8bf10ce440fa413e492a25b35cb92f93","conditional":true,"criteria":[{"criterion_id":"P02-03.K1","claim":"该场景中两个事件可以重合。","evidence_ids":["toa"]},{"criterion_id":"P02-03.K2","claim":"定义仍是最大压力时刻，单个重合例子不能推广为首次响应规则。","evidence_ids":["toa"]}],"sources":[{"evidence_id":"toa","path":"manual/markdown/15_function_objects.md","file_sha256":"f22133da89f48be2d66a63873d227b9fb6be40321075cb6634a5cf2f35168bbe","line_start":140,"line_end":146,"label":"timeOfArrival对象","excerpt":"## 15.12 timeOfArrival\n\nThis function object tracks the maximum pressure and records the time when the maximum pressure is reached.\n\n| Entry | Description |\n|---|---|\n| pName | Name of the pressure field (default is p) |","excerpt_sha256":"4d8d3c85d5de55f0a494d6a58555c9e374e9fc47c8cc4a302b0acc36e5cee2b6"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["用单峰重合证明首次响应的一般定义"],"answer":"根据提供的资料，timeOfArrival函数对象用于跟踪最大压力并记录最大压力达到的时间。然而，资料中并未明确说明timeOfArrival是否仅用于首次响应或是否适用于所有爆炸场景。因此，不能从这个例子推断出timeOfArrival在所有爆炸场景中都用于测量首次响应。","answer_sha256":"be0cbb2d46efbc7a7d798b55abadeadf263fadfa04cbf6620cf831f8ba1d4a19","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/15_function_objects.md","start":142,"end":146}],"references_delivered":true},{"sample_id":"R-68d99d07ca65","question":"我在整理物性表，icoTabulated和tabulated各需要哪些数据？二维查表还能提供哪些导数？","question_id":"N66-03","question_sha256":"35d238612e3208c465f6b370d643816c39e49152e946eabcb2ff6b4e2dc6a325","annotation_sha256":"66691f84063a6374eb36c4cf9322a699edd53dfafa6901f9413213bf8f94e7c1","conditional":false,"criteria":[{"criterion_id":"N66-03.K1","claim":"icoTabulated使用两个一维表，以T查mu和kappa。","evidence_ids":["v2_ico"]},{"criterion_id":"N66-03.K2","claim":"tabulated使用两个二维表，以rho、T查mu和kappa。","evidence_ids":["v2_tabtransport"]},{"criterion_id":"N66-03.K3","claim":"二维查表提供一、二阶导数，包括纯导数和混合导数，不只纯导数。","evidence_ids":["v2_table2"]}],"sources":[{"evidence_id":"v2_ico","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1001,"line_end":1003,"label":"5.3.6 icoTabulated","excerpt":"### 5.3.6 icoTabulated\n\nThe tabulated, incompressible transport model can be used to calculate the viscosity and conductivity using only the temperature. The data is read from two one dimensional tables. See Sec. 12.1 for more information on the available options for modifiers and interpolation schemes. The \"x\" and \"f\" names are \"T\" and \"mu\"/\"kappa\" respectively.","excerpt_sha256":"d90893741b4c60629f186094e96f098ab3de4e61e1e0846268bdfb8732b83d00"},{"evidence_id":"v2_tabtransport","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1005,"line_end":1007,"label":"5.3.7 tabulated","excerpt":"### 5.3.7 tabulated\n\nThe tabulated transport model can be used to calculate the viscosity and conductivity using the density and temperature. The data is read from two, two dimensional tables. See Sec. 12.1 for more information on the available options for modifiers and interpolation schemes. The \"x\", \"y\", and \"f\" names are \"rho\", \"T\", and \"mu\"/\"kappa\" respectively.","excerpt_sha256":"777dc10358b87687557b51cb4900e0adec62d8242728afe36f8d81def168a9a4"},{"evidence_id":"v2_table2","path":"manual/markdown/12_numerics.md","file_sha256":"fa477973138256a9a8d258a89ccea1697a1772f525c97191b99f04131a7c091f","line_start":60,"line_end":62,"label":"12.1.4 2D lookup table","excerpt":"### 12.1.4 2D lookup table\n\nData is looked up given $x$ and $y$ values. The data can be read from a table or from a list. The default delimiter is \",\". The table can also be flipped when reading if the input is reversed (y by x) and a check is done on the size when reading. First and second derivatives (pure and mixed) have been implemented and a reverse lookup can be used for scalar data (find $x$ or $y$ given $f$ and $y$ or $x$).","excerpt_sha256":"4160eef9d443e92fc0180aafc14681fca6b5e101f24c5dfd81d493908826d5f3"}],"applicability":"固定版本语料范围；用户未给的本地配置和运行状态不能按参考案例补造，文档说明不等于运行或物理有效性验证。","acceptable_answer_range":"允许等义解释、正确代数形式和必要的条件澄清；不按引用数、固定句式或题干未给的具体值评分。配置问题接受任一种完整有效写法，不强制穷举未问的接口。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"icoTabulated需要温度、粘度和导热系数数据，通过温度查表计算粘度和导热系数。tabulated需要压力、密度和内能的二维表数据，支持压力-密度或温度-密度的二维查表。二维查表可提供密度、内能、压力、速度、温度等导数。参考资料：manual/markdown/05_fluid_solid_thermo.md第1001-1004行，第834-903行。","answer_sha256":"3a9ade72e58ad758ff4eedfc71abef97281a21bb1fe825726205db9060a41d27","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":1001,"end":1004},{"path":"manual/markdown/05_fluid_solid_thermo.md","start":834,"end":903}],"references_delivered":true},{"sample_id":"R-ea296aac041f","question":"在 blastFoam 中，如果只想合并部分探针字段而不是全部字段，mergeProbes 提供了哪个选项？该选项与 -force 的作用有何不同？默认情况下该选项的行为是什么？","question_id":"E37-03","question_sha256":"0f238cfd2ef44c64284bf157e12fdceaac43a22a5418b071f4177dfada9e0b4e","annotation_sha256":"1a72977e0ca2aacc4b6c2578631807c2e3cca491d32de9485ff2658aa10cb7cf","conditional":true,"criteria":[{"criterion_id":"E37-03.K1","claim":"-probeNames 选项用于指定要合并的探针字段，默认是全部字段。","evidence_ids":["X_merge_probes"]},{"criterion_id":"E37-03.K2","claim":"-force 用于覆盖已存在的合并探针结果，不用于选择字段。","evidence_ids":["X_merge_probes"]},{"criterion_id":"E37-03.K3","claim":"默认情况下 mergeProbes 合并起始时间文件夹中找到的所有文件，因此不指定 -probeNames 时会合并全部探针字段。","evidence_ids":["X_merge_probes"]}],"sources":[{"evidence_id":"X_merge_probes","path":"manual/markdown/16_utilities.md","file_sha256":"12221c9affd01b16a88a57473f84e080a592e960649e26856aaeefbe2ed3eeac","line_start":193,"line_end":206,"label":"merge_probes","excerpt":"## mergeProbes\n\nThis is a simple utility that can be used to calculate combine probes started at different times. By default, all files found in the start time folder will be merged.\n\n```sh\nUsage: mergeProbes \u003cpath/to/probes\u003e [OPTIONS]\n```\n\nCommand line options:\n\n| Variable | Description |\n|---|---|\n| -force | Overwrite existing merged probes |\n| -probeNames | Probed fields to merge (default is all) |","excerpt_sha256":"4ff8a1c5acfc153f7a1a1bf26032dffa74c6130428f9721a0ade3955f42d6b94"}],"applicability":"适用于 mergeProbes 的字段筛选与覆盖控制；原文未说明 -probeNames 接受多个字段时的分隔格式或大小写敏感性。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把 -force 当作字段选择选项","认为 -probeNames 默认只合并部分字段","认为默认合并会跳过某些文件"],"answer":"在 blastFoam 中，如果只想合并部分探针字段而不是全部字段，mergeProbes 提供了 -select 选项。-select 选项允许用户指定要合并的探针字段，而 -force 选项则用于强制合并所有探针字段，即使某些字段可能不匹配或存在冲突。默认情况下，-select 选项的行为是不启用的，即如果不使用 -select，mergeProbes 会合并所有探针字段。","answer_sha256":"de4f7d012ab8dd9402dde86878fca2dfc5de9103a04a679ca2173d36e1decc76","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-dcab767cce7f","question":"在shockTube_tabulated里，rhoCoeffs/eCoeffs和pCoeffs/TCoeffs的mod不同。解释各自作用域，并说明为何不能只读一个mod就概括整张爆炸EOS表的变换。","question_id":"P07-04","question_sha256":"1b33b4f13db3c21b19d1b75c49f2f8cf499baf898064d4c794729689c5d1313f","annotation_sha256":"d6ae2fd85eb88a129e9e7af10f6006efbfe6475e03056cadd5fe29feb7c41757","conditional":false,"criteria":[{"criterion_id":"P07-04.K1","claim":"rhoCoeffs用log10，eCoeffs用ln，pCoeffs和TCoeffs也各设ln。","evidence_ids":["table_case"]},{"criterion_id":"P07-04.K2","claim":"通用规则允许xCoeffs子字典省去x前缀，该字典内mod作用于所描述的输入；输出变换位于相应输出字典。","evidence_ids":["table_input","table_case"]},{"criterion_id":"P07-04.K3","claim":"不同轴/输出独立配置，不能把一个mod套到全部量。","evidence_ids":["table_case"]}],"sources":[{"evidence_id":"table_case","path":"tutorials/blastFoam/shockTube_tabulated/constant/phaseProperties","file_sha256":"5b2d674a30f929afe4609ffbce9c4a30946ab9566c0b9c213b9e7732dc16ffd7","line_start":18,"line_end":92,"label":"查表配置实例","excerpt":"type        basic;\nthermoType\n{\n    transport const;\n    thermo      eTabulated;\n    equationOfState tabulatedMG;\n}\n\nspecie\n{\n    molWeight       28.97;\n}\ntransport\n{\n    mu              0;              // Viscosity\n    Pr              1;              // Prandtl number\n}\nequationOfState\n{\n    pCoeffs\n    {\n        file       \"constant/p.csv\";\n        mod         ln;\n        delim       \";\";\n        isReal      false;\n        flipTable   false;\n    }\n\n    rhoCoeffs\n    {\n        mod         log10;\n\n        n           7;\n        delta       1.0;\n        min         -3.0;\n        isReal      false;\n    }\n    eCoeffs\n    {\n        mod         ln;\n\n        n           40;\n        min         11.8748;\n        delta       1.0;\n        isReal      false;\n    }\n}\nthermodynamics\n{\n    TCoeffs\n    {\n        file        \"constant/T.csv\";\n        mod          ln;\n        delim       \";\";\n        isReal      false;\n        flipTable   false;\n    }\n\n    rhoCoeffs\n    {\n        mod         log10;\n        n           7;\n        delta       1.0;\n        min         -3.0;\n        isReal      false;\n    }\n    eCoeffs\n    {\n        mod         ln;\n        n           40;\n        min         11.8748;\n        delta       1.0;\n        isReal      false;\n    }\n}","excerpt_sha256":"f4aebc6d8e654ca31c91d7d5c9291e83754f78edad00e9ea5abc92100497a67d"},{"evidence_id":"table_input","path":"manual/markdown/12_numerics.md","file_sha256":"fa477973138256a9a8d258a89ccea1697a1772f525c97191b99f04131a7c091f","line_start":5,"line_end":21,"label":"Coeffs字典与默认分隔符","excerpt":"## 12.1 Lookup tables\n\n1D, 2D, and 3D lookup tables are provided, all including support for modified data types, runtime selectable interpolation schemes, and the ability to read or construct the necessary data. The name of the given dictionaries and inputs are dictated by the specific models using the tables, \"x\" and \"f\" will be used as place holders for these names. If the dictionary named \"xCoeffs\" is provided \"x\" is not used to read the given input (i.e. \"xMod\" is \"mod\").\n\nWhen 1D data is read the field can be constructed with 3 methods: directly read, read from a file given a column, or constructed with a spacing.\n\n| Variable | Description |\n|---|---|\n| file | Name of a file to read from |\n| delim | Delimiter used to seperate data (',' by default) |\n| xCol | Column of the data (first column by default) |\n| x | Data |\n| xMod | Modifier (none by default) |\n| nX | Number of values |\n| minX | Minimum value |\n| maxX | Maximum value |\n| deltaX | Spacing |","excerpt_sha256":"3e1d80d543ee358598011133d59150fa6c5ae9b0200fc230f9b2c89f2b8748b6"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["rho轴也用ln","把rhoCoeffs.mod当压力输出变换"],"answer":"在shockTube_tabulated案例中，rhoCoeffs、eCoeffs、pCoeffs和TCoeffs分别用于定义密度、内能、压力和温度的变换方式。其中，rhoCoeffs和eCoeffs的mod分别为log10和ln，而pCoeffs和TCoeffs的mod也为ln。这表明不同变量的变换方式可能不同，因此不能仅通过读取一个mod值来概括整张爆炸EOS表的变换方式。每个变量的mod参数定义了其在表格数据中的变换方法，这些方法可能因变量而异，以适应不同的物理特性或数据范围。","answer_sha256":"635b548dcec48c8975f0ab8bfe62f756b0721543b379c923da6b67c81d4cb71a","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/shockTube_tabulated/constant/phaseProperties","start":37,"end":44},{"path":"tutorials/blastFoam/shockTube_tabulated/constant/phaseProperties","start":45,"end":83},{"path":"tutorials/blastFoam/shockTube_tabulated/README.md","start":1,"end":7}],"references_delivered":true},{"sample_id":"R-1f44efb07946","question":"在 blastFSIFoam 的挡板算例中，该算例被用来演示什么能力？该算例的几何与载荷设置是什么？","question_id":"E49-01","question_sha256":"26093f952fedddb88b6e2e95ee9979bfdd85661a1f7feb35fb2816c26dbfb94c","annotation_sha256":"b929cf9408363deb3f57c0ec5093952c7f4f518895420d532c2110396ae89371","conditional":false,"criteria":[{"criterion_id":"E49-01.K1","claim":"该算例用于演示 blastFoam 处理流固耦合（FSI）的能力。","evidence_ids":["X_fsi_readme"]},{"criterion_id":"E49-01.K2","claim":"算例包含一个小型 C4 装药在二维中靠近墙壁起爆。","evidence_ids":["X_fsi_readme"]},{"criterion_id":"E49-01.K3","claim":"挡板在爆炸波到达时变形，并会影响波越过挡板后的传播方式。","evidence_ids":["X_fsi_readme"]}],"sources":[{"evidence_id":"X_fsi_readme","path":"tutorials/blastFSIFoam/flap/README.md","file_sha256":"e2c1b70a604582d9d11d82ef2bcb3402aee30c6e92367b702ac49d5075402b71","line_start":1,"line_end":11,"label":"fsi_readme","excerpt":"# FSI flap simulation\n\n## Notes\n\nThis case is used to demonstrate the capability of blastFoam to handle fluid-structure interaction.\n\nThe blastFSIFoam solver is still under development and changing the case setup may result in crashes.\n\nThe case consists of a small c4 charge being detonated near a wall in 2 dimensions. The flap will deform when the blast wave reached it, and will effect how the wave moves past the flap. This is a modified version of the preCICE tutorial presented.\n\nThe calculation took \\~6 minutes to run on a four-core desktop.","excerpt_sha256":"4731746c9cd2418f14c1278bf02c5a0aee81b236466385166612fdba9af39ba3"}],"applicability":"仅适用于该挡板算例的原文描述；不推广为已验证的爆炸工程案例。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["声称该算例是已验证的爆炸工程案例","忽略二维设置或 C4 装药位置","声称挡板不变形或对波传播无影响"],"answer":"blastFSIFoam 的挡板算例（flap 案例）用于演示 blastFoam 处理流体-结构相互作用（FSI）的能力。该算例的几何设置为二维空间中靠近墙壁的小量 C4 炸药引爆，挡板在爆震波到达时发生变形，影响波的传播。载荷设置涉及爆震波的压力作用，挡板的变形由流体动力学与结构力学耦合计算。","answer_sha256":"0877fce857c15781cdad28d2579d94c480ed94db91d3033db71ec939d2863d6f","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFSIFoam/flap/README.md","start":5,"end":12}],"references_delivered":true},{"sample_id":"R-175dcf3ef079","question":"在 blastFoam 的 JWL 模型说明中，solidJWL 类型用于未反应状态时，e_{0,i} 与 pRef 的作用是什么？热能在该固体情形下是否被考虑？","question_id":"E15-03","question_sha256":"610d6032a1a127bada559b6a201287e26f3fcf7594020ee5c707e7a8c8e04eb6","annotation_sha256":"8a316b54139c1bc6ca00d02cce4fc528457f0f2134f6d4959c4ec7e77c424c26","conditional":false,"criteria":[{"criterion_id":"E15-03.K1","claim":"solidJWL 情形下 e_{0,i} 被计算为使参考密度处压力为零，并使用偏移压力 pRef","evidence_ids":["X_jwl"]},{"criterion_id":"E15-03.K2","claim":"固体情形下热能不被考虑","evidence_ids":["X_jwl"]}],"sources":[{"evidence_id":"X_jwl","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":520,"line_end":555,"label":"jwl","excerpt":"#### 5.2.2.8 JWL\n\nThe more complicated Jones Wilkins Lee EOS is often used to define energetic materials (Zheng et al., 2011), and has a pressure deviation given by\n\n$$\n\\Pi_i = A_ie^{-R_{1,i}V}\\left( \\frac{\\omega_i}{R_{1,i}V} - 1 \\right) + B_ie^{-R_{2,i}V}\\left( \\frac{\\omega_i}{R_{2,i}V} - 1 \\right) - \\rho_i\\omega_ie_{0,i}\n$$\n(5.45)\n\nwhere $V = \\rho_{0,i}/\\rho_i$.\n\n$$\n\\Gamma_{r,i} = \\omega_i + 1\n$$\n(5.46)\n\nand\n\n$$\n\\delta_{r,i} = A_ie^{-\\frac{R_{1,i}\\rho_{0,i}}{\\rho_i}}\\left[ \\omega_i\\left( \\frac{1}{R_{1,i}\\rho_{0,i}} + \\frac{1}{\\rho_i} \\right) - \\frac{R_{1,i}\\rho_{0,i}}{\\rho_i^2} \\right]\\frac{1}{\\omega_i} + B_ie^{-\\frac{R_{2,i}\\rho_{0,i}}{\\rho_i}}\\left[ \\omega_i\\left( \\frac{1}{R_{2,i}\\rho_{0,i}} + \\frac{1}{\\rho_i} \\right) - \\frac{R_{2,i}\\rho_{0,i}}{\\rho_i^2} \\right]\\frac{1}{\\omega_i} - e_{0,i}\n$$\n(5.47)\n\n\u003e **NOTE:** The JWL model can also be used to describe the unreacted state if a detonating model is used with the `solidJWL` type. For the solid case, $e_{0,i}$ is calculated so that there is zero pressure at the reference density, and uses an offset pressure, \"pRef\". Thermal energy is also not considered for the solid case\n\n| Variable | Description |\n|---|---|\n| $A$ | Model coefficient [Pa] |\n| $B$ | Model coefficient [Pa] |\n| $R_1$ | Model coefficient [ ] |\n| $R_2$ | Model coefficient [ ] |\n| `rho0` | Unreacted or reference density [kg m⁻³] |\n| `omega` | Grüneisen coefficient [ ] |\n| $e_0$ | Offset energy (0 by default for gas) [J/Kg] |\n| `pRef` | Offset pressure (only for solid, 0 by default) [Pa] |\n","excerpt_sha256":"73510877ab7a748da20f35fd580631797b6c81ee68b8608659065b91457203a3"}],"applicability":"仅适用于原文 NOTE 所述 solidJWL 未反应状态分支；气体 JWL 默认 e_0 为 0，pRef 仅用于固体且默认 0。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把 solidJWL 的 e_0 说成与气体 JWL 一样默认 0 且不随参考密度调整","声称固体情形仍考虑热能"],"answer":"在 blastFoam 的 JWL 模型中，当使用 solidJWL 类型描述未反应状态时，$e_{0,i}$ 用于计算使参考密度下压力为零的偏移能量，而 $pRef$ 是用于固体情形的偏移压力。热能在此固体情形下未被考虑。","answer_sha256":"5d54aea357413e2228e35205f369d7a4ab7008891b895b9220d15b72d37916a5","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":543,"end":545}],"references_delivered":true},{"sample_id":"R-cfc0ed22da7f","question":"原文把 stiffenedGas 写成 Mie-Grüneisen 形式时，Γ_i、Π_i、δ_i 分别取什么？请据此说明 stiffenedGas 与 idealGas 在 Mie-Grüneisen 参数上的差别。","question_id":"E17-02","question_sha256":"960a7813b3629e0f9bd69e0ef372df01756e3d8be1a8e2b00c46956940658457","annotation_sha256":"d3a6e0d9d6b0f5f45b0dbd84c7626b9b53f46da062413fac28ddd8228e4c2fd4","conditional":false,"criteria":[{"criterion_id":"E17-02.K1","claim":"stiffenedGas 的 Mie-Grüneisen 参数为 Γ_i = γ_i、Π_i = γ_i a_i、δ_i = 0。","evidence_ids":["X_stiffened"]},{"criterion_id":"E17-02.K2","claim":"idealGas 的 Mie-Grüneisen 参数为 Γ_i = γ_i、Π_i = 0、δ_i = 0，即其 Π_i 为零。","evidence_ids":["X_idealgas"]},{"criterion_id":"E17-02.K3","claim":"两者 Γ_i 与 δ_i 取值相同，差别集中在 Π_i：stiffenedGas 为 γ_i a_i，idealGas 为 0。","evidence_ids":["X_stiffened","X_idealgas"]}],"sources":[{"evidence_id":"X_stiffened","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":304,"line_end":336,"label":"stiffened","excerpt":"#### 5.2.2.2 stiffenedGas\n\nFor a material obeying the stiffened EOS, the pressure is defined as\n\n$$\np_i = (\\gamma_i - 1)\\rho_i e_i - \\gamma_i a_i\n$$\n(5.22)\n\nwhere $a_i$ and $\\gamma_i$ are material properties (Zheng et al., 2011). In the Mie-Grüneisen form\n\n$$\n\\Gamma_i = \\gamma_i\n$$\n(5.23)\n\n$$\n\\Pi_i = \\gamma_i a_i\n$$\n(5.24)\n\nand\n\n$$\n\\delta_i = 0\n$$\n(5.25)\n\n| Variable | Description |\n|---|---|\n| `a` | Reference pressure [Pa] |\n| `gamma` | Specific heat ratio [ ] |\n","excerpt_sha256":"656f15c5e28eabb720f15489ae032f4272a509b44d9075d11873c155fd4c38b8"},{"evidence_id":"X_idealgas","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":274,"line_end":303,"label":"idealgas","excerpt":"#### 5.2.2.1 idealGas\n\nFor an ideal gas, the pressure is defined as\n\n$$\np_i = (\\gamma_i - 1)\\rho_i e_i\n$$\n(5.18)\n\nThe functions as defined to represent an ideal gas in Mie-Grüneisen form are:\n\n$$\n\\Gamma_i = \\gamma_i\n$$\n(5.19)\n\n$$\n\\Pi_i = 0\n$$\n(5.20)\n\n$$\n\\delta_i = 0\n$$\n(5.21)\n\n| Variable | Description |\n|---|---|\n| `gamma` | Specific heat ratio [ ] |\n","excerpt_sha256":"7a27aeb4a775460eac87b252da38f0f6bf06d89be503f9a60febcb37e5a6cadf"}],"applicability":"仅适用于原文给出的 Mie-Grüneisen 形式定义；原文未说明该形式在数值求解中的具体实现细节。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把 stiffenedGas 的 Π_i 写成 0","把 idealGas 的 Π_i 写成 γ_i a_i","声称两者 Γ_i 不同"],"answer":"在Mie-Grüneisen形式下，stiffenedGas的Γ_i取γ_i，Π_i取γ_i(b_i - a_i)，δ_i取0。而idealGas的Γ_i取γ_i，Π_i和δ_i均取0。两者的差别在于stiffenedGas通过Π_i引入了材料参数a_i和b_i以描述非理想行为，而idealGas假设无此类偏差。","answer_sha256":"65e184339e5b97d3c42950cdeb8bdcdd67ff8936335f1b49b367fb2a0fb09bcd","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":254,"end":262},{"path":"manual/markdown/05_fluid_solid_thermo.md","start":285,"end":297},{"path":"manual/markdown/05_fluid_solid_thermo.md","start":436,"end":442},{"path":"manual/markdown/05_fluid_solid_thermo.md","start":448,"end":450}],"references_delivered":true},{"sample_id":"R-fbb64ddc54d5","question":"在 blastFoam 的 burst 补丁体系中，手册说明所有字段都需要在其字典中额外增加一个条目来指定“破裂前”的边界条件。这个条目的名称是什么，它被用来做什么？同时，手册指出该条目应放在哪个字典层级？","question_id":"E28-01","question_sha256":"0b000e149df4443efaa85ca0f3a9ef255e3874125294be2cc45f238fd58954b6","annotation_sha256":"332467fd889d58dad71cc340badd56c9afe8515ad2f32abcc47b6f4effd1e3c7","conditional":false,"criteria":[{"criterion_id":"E28-01.K1","claim":"该额外条目的名称是 intactField，用于指定字段在破裂之前的边界条件。","evidence_ids":["X_burst_general"]},{"criterion_id":"E28-01.K2","claim":"该条目属于字段字典中的额外条目，而非补丁类型本身的定义。","evidence_ids":["X_burst_general"]}],"sources":[{"evidence_id":"X_burst_general","path":"manual/markdown/07_burst_patches.md","file_sha256":"1c4fd9c6a681b0f0ad846967ff49ddc2737e234aa01e39536f41f493418c8097","line_start":1,"line_end":12,"label":"burst_general","excerpt":"# Burst patches\n\nThe ability to have a \"bursting\" patch can be used with the burst (external patch), burstCyclic (internal with no AMR), or burstCyclicAMI (general internal). All fields require an additional entry in their dictionaries name \"intactField\" which is used to specify the boundary condition of the field before bursting. The basic burst patch can be created using any mesh generation technique, however the cyclic variations require using the createBaffles utility, standard to OpenFOAM. See Sec. 20.5 for an example of how to create and use the patches.\n\n## 7.1 Burst models\n\nThe method to calculate where burst occurs is runtime-selectable and the inputs are placed in the constant/polyMesh/boundary file under the corresponding boundary. This can also be added in either the patch entry within blockMeshDict of snappyHexMeshDict.\n\n| Variable | Description |\n|---|---|\n| partialBurst | Can individual face burst (no by default) |\n| useDelta | Us the difference across coupled patches rather than the maximum value (yes by default) |","excerpt_sha256":"73e1a00497251f8dd4c749d29961fc2f10f84bb87f11e686f958ddbbf70b3f97"}],"applicability":"适用于手册所述 burst、burstCyclic、burstCyclicAMI 三类补丁的字段字典配置；不涉及具体字段物理量。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把条目名写成 intactPatch 或 intactBoundary","认为该条目定义补丁类型而非破裂前边界条件","认为该条目可省略"],"answer":"在 blastFoam 的 burst 补丁体系中，手册说明所有字段都需要在其字典中额外增加一个条目来指定“破裂前”的边界条件。该条目的名称是 \"intactField\"，它被用来指定字段在破裂前的边界条件。该条目应放在字典的顶层，即在 burstModel 的配置层级下。","answer_sha256":"191e3b9df8c757e5f908f4f0d7f85e50d5099e46494c3b2646b30077e744ef89","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/07_burst_patches.md","start":1,"end":25},{"path":"manual/markdown/07_burst_patches.md","start":22,"end":67}],"references_delivered":true},{"sample_id":"R-05d7618f80f0","question":"使用 createTimeSeries 时，-outputDir 选项的作用对象是什么？它与 -absolute 所影响的内容是否属于同一层面？请依据原文说明二者分别控制什么。","question_id":"E38-02","question_sha256":"4585fcd50e383376ca96208380dff9898743e3486bf24997b5955a30e0fd896a","annotation_sha256":"bbcc72fae310e2fe376dc66c6bfd07b451326923ed2670f9d8d7b9aa7c9a2533","conditional":false,"criteria":[{"criterion_id":"E38-02.K1","claim":"-outputDir 指定 *.series 文件的写入目录","evidence_ids":["X_series"]},{"criterion_id":"E38-02.K2","claim":"-absolute 控制文件路径形式而非输出目录","evidence_ids":["X_series"]}],"sources":[{"evidence_id":"X_series","path":"manual/markdown/16_utilities.md","file_sha256":"12221c9affd01b16a88a57473f84e080a592e960649e26856aaeefbe2ed3eeac","line_start":178,"line_end":191,"label":"series","excerpt":"## createTimeSeries\n\nThis utility simplifies the previous utility by simply creating a `*.*.series` file which provides the path to each time step of a VTK or STL file and allows viewing of the time series with the time in ParaView. Only one additional file is created for each sampled field in the directory provided. The given path must include files within time step folders. By default the relative path to the files will be used\n\n```sh\nUsage: createTimeSeries \u003cpath/to/timeFolders\u003e [OPTIONS]\n```\n\nCommand line options:\n\n| Variable | Description |\n|---|---|\n| -absolute | Use absolute file paths |\n| -outputDir | Directory to write the *.series file to |","excerpt_sha256":"0a4f88c3a134e1494255ade22fa0072be219713c90fa65c2b80739d589d13040"}],"applicability":"仅适用于 createTimeSeries 的命令行选项语义。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把 -outputDir 当作路径形式开关","把 -absolute 当作输出目录选项"],"answer":"-outputDir 选项的作用对象是 `createTimeSeries` 工具生成的 `*.series` 文件。它控制该文件的输出目录。而 -absolute 选项影响的是文件路径的表示形式，即是否使用绝对路径。二者分别控制不同的内容：-outputDir 控制输出文件的存储位置，-absolute 控制路径的表示方式，不属于同一层面。","answer_sha256":"3d52ae4911394342f4dec3a7147e9f0a72419ea9c3bc6dd0e0b7b10fa2f26362","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/16_utilities.md","start":191,"end":192},{"path":"manual/markdown/16_utilities.md","start":190,"end":191}],"references_delivered":true},{"sample_id":"R-7cc108391aa2","question":"把单分散颗粒案例扩为粒径相差很大的多分散体系时，能否原样沿用CarnahanStarling径向分布，并断言局部最大堆积限一定不变？依据手册分别判断这两项。","question_id":"N64-03","question_sha256":"738693e2655f32da10808bb9d5dba5f4165cb0426d6b10910122e4c24b43ac13","annotation_sha256":"ce5b47b10fe0b332ece88facb339c05649db35d9e3d2450c99495dc0ee7347ad","conditional":true,"criteria":[{"criterion_id":"N64-03.K1","claim":"CarnahanStarling原文限制为单分散流，不能据原说明直接推广至多分散。","evidence_ids":["v2_cs"]},{"criterion_id":"N64-03.K2","claim":"堆积总述指出大小颗粒混合可因小粒填充间隙而使局部堆积限显著变化。","evidence_ids":["v2_pack"]},{"criterion_id":"N64-03.K3","claim":"单分散推荐常数堆积限的说明不能证明多分散仍恒定。","evidence_ids":["v2_pack"]}],"sources":[{"evidence_id":"v2_cs","path":"manual/markdown/04_granular_models.md","file_sha256":"c33cd1b409845a76acc4528df442628f4102efbd097fefa77b46a12566869f9c","line_start":30,"line_end":37,"label":"4.1.1 CarnahanStarling","excerpt":"### 4.1.1 CarnahanStarling\n\nThe Carnahan Starling radial distribution function is only valid for monodisperse flows and is defined as\n\n$$\ng_{0,ii} = \\frac{1}{1-α_i} + \\frac{3α_i}{2(1-α_i)^2} + \\frac{α_i^2}{2(1-α_i)^3}\n$$\n(4.4)","excerpt_sha256":"73ca4a383b526dee010f4753f6cb016627659a64e40cf1a7c77e599e001b79da"},{"evidence_id":"v2_pack","path":"manual/markdown/04_granular_models.md","file_sha256":"c33cd1b409845a76acc4528df442628f4102efbd097fefa77b46a12566869f9c","line_start":377,"line_end":379,"label":"4.6 Packing limit models","excerpt":"## 4.6 Packing limit models\n\nThe modeling of the packing limit is important in polydisperse flows due to the fact that, when large variations in particle diameters exist locally, the packing limit can vary widely. This is due to the fact that smaller particles can be found in between larger particles, increasing the maximum allowable volume fraction. For monodisperse flows, this is not the case and a constant value packing limit should be used.","excerpt_sha256":"25d169a160ba6448d675cd40c1085c9524ea847bde94d3169e5b33da4ee6399f"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"CarnahanStarling径向分布函数仅适用于单分散颗粒体系，其公式为$g_{0,ii} = \\frac{1}{1-α_i} + \\frac{3α_i}{2(1-α_i)^2} + \\frac{α_i^2}{2(1-α_i)^3}$，如资料中所述（行32-37）。当扩展为粒径相差很大的多分散体系时，该函数不再适用，因为其假设所有颗粒具有相同的尺寸。至于局部最大堆积限，手册中未明确提及是否在多分散体系中保持不变，因此无法断言其一定不变。","answer_sha256":"0eca7be63301977c24617a7bc3b2d3e561ab2ab7744aebd8e6ceb3389a98cfc5","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/04_granular_models.md","start":32,"end":37}],"references_delivered":true},{"sample_id":"R-f7293acb12b5","question":"界面压力的volumeAveraged、totalPressure与界面速度的massAveraged，分别对什么量采用什么加权？为什么不能统称为同一种“相平均”？","question_id":"N59-02","question_sha256":"21ed81a377db31bdaa0742d9e3d3682c0ff6e150f31bb7db57cf0dd89ab01e07","annotation_sha256":"369648752c40fa1bc43ee55756fd596832434232b11e7e614e38a52f0d9508ed","conditional":false,"criteria":[{"criterion_id":"N59-02.K1","claim":"volumeAveraged压力采用两相压力的体积分数平均。","evidence_ids":["v2_ip"]},{"criterion_id":"N59-02.K2","claim":"totalPressure采用体积分数平均的热力学压力和质量平均的动态压力。","evidence_ids":["v2_ip"]},{"criterion_id":"N59-02.K3","claim":"massAveraged速度采用两相速度的质量平均；对象与权重均需分别说明。","evidence_ids":["v2_iv"]}],"sources":[{"evidence_id":"v2_ip","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":267,"line_end":287,"label":"3.6 Interfacial pressure models","excerpt":"## 3.6 Interfacial pressure models\n\nThe interfacial pressure model is used to determine the pressure at the interface between two phases.\n\n### 3.6.1 single\n\nThe pressure of the given phase is used.\n\n| Variable | Description |\n|---|---|\n| phase | Name of the phase |\n\nNOTE: For gas-particle flows this option should be used, using the gas phase pressure.\n\n### 3.6.2 volumeAveraged\n\nThe volume fraction averaged pressure of the two phases is used.\n\n### 3.6.3 totalPressure\n\nThe volume fraction averaged thermodynamic pressure and the mass averaged dynamic pressure is used.","excerpt_sha256":"099df81d6202468770a2e93ebc89e3269116bdab0632ceb32972389f81ee3dfa"},{"evidence_id":"v2_iv","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":289,"line_end":305,"label":"3.7 Interfacial velocity models","excerpt":"## 3.7 Interfacial velocity models\n\nThe interfacial velocity model is used to determine the velocity at the interface between two phases.\n\n### 3.7.1 single\n\nThe velocity of the given phase is used.\n\n| Variable | Description |\n|---|---|\n| phase | Name of the phase |\n\nNOTE: For gas-particle flows this option should be used, using the particle phase velocity.\n\n### 3.7.2 massAveraged\n\nThe mass averaged velocity of the two phases is used.","excerpt_sha256":"3e9b68c71cb71d239e9815d4deff62de380af4c5817fd184049d17e6fdbce9b7"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"界面压力的volumeAveraged采用体积分数加权的两相压力，totalPressure则结合体积分数加权的热力学压力与质量分数加权的动力学压力。界面速度的massAveraged采用两相质量加权的速度。不能统称为同一种‘相平均’，因为它们分别基于不同的物理量（压力或速度）和不同的加权方式（体积分数或质量分数），导致计算结果和应用场景存在差异。","answer_sha256":"9e6e3372a44033c640c61c91b5b21e7bf77b11f0e57c472864f904b265a8795c","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/03_interfacial_models.md","start":281,"end":287},{"path":"manual/markdown/03_interfacial_models.md","start":303,"end":305}],"references_delivered":true},{"sample_id":"R-0e43fccfa926","question":"为爆炸高温高压状态评估eTabulated/tabulatedMG组合时，查表自变量、压力/温度输出与初始化内能怎样联系？请对照一般eTabulated段的输入输出定义，解释为什么不能混用这两处的变量说明。","question_id":"P07-01","question_sha256":"e8bffba87629cb899052631d41becfbdde2f93966f6f65e43179fc1a263f6578","annotation_sha256":"05648621c1bcfc19cb25f7fce85ffd045e91465b8b12937329db4a8151175064","conditional":false,"criteria":[{"criterion_id":"P07-01.K1","claim":"专用组合允许压力/温度表按密度与内能即x=rho、y=e定义。","evidence_ids":["table_pair"]},{"criterion_id":"P07-01.K2","claim":"给定压力和密度可反查初始化内能。","evidence_ids":["table_pair"]},{"criterion_id":"P07-01.K3","claim":"一般eTabulated段描述rho、T、e另一种查表表述，应明确组合而不混用变量。","evidence_ids":["table_general","table_pair"]}],"sources":[{"evidence_id":"table_pair","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":834,"line_end":838,"label":"eTabulated/tabulatedMG专用组合","excerpt":"### 5.2.5 eTabulated/tabulatedMG\n\nIn addition to the previously mentioned equations of state and thermodynamic models, tabulated models may also be used. This is useful when simulating real gasses, and high temperatures and pressures when standard models are no longer sufficient. Any combination of pressure and temperature tables can be used, as long as they are a function of density and internal energy (x and y, respectively). The internal energy is initialized using a reverse look up given a pressure and a density. See 12.1 for more information on usage.\n\n\u003e **NOTE:** Because of the way the selection of models is handled, this option will not show up as an available option if other models are used. Currently only const, icoTabulated, and tabulated transport models are available.","excerpt_sha256":"b68b85cfdc34143509084dfa8da704e0586a63e44e19a0439ef7d70443b46ce1"},{"evidence_id":"table_general","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":156,"line_end":160,"label":"一般eTabulated说明","excerpt":"### 5.1.5 eTabulated\n\nThe tabulated thermodynamic model can be used to calculate the temperature using density and temperature to find internal energy. The data is read from a two dimensional table. The specific heat are calculated using finite difference derivatives to the tables. See Sec. 12.1 for more information on the available options for modifiers and interpolation schemes. The \"x\", \"y\", and \"f\" names are \"rho\", \"T\", and \"e\" respectively. A heat of formation, \"Hf\", must also be provided.\n\n\u003e **NOTE:** The equation of state contribution of internal energy is not included so this must be included in the tables provided.","excerpt_sha256":"ac00a5be272669450df3aa222a4b8f7f9192d9a341796735057d9b558d06abf3"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["专用组合的y变量直接说成T"],"answer":"在eTabulated/tabulatedMG组合中，查表自变量、压力/温度输出与初始化内能的联系是通过表格数据来实现的。表格数据中，x轴代表密度（rho），y轴代表温度（T），f代表内能（e）。通过这些数据，可以计算出内能的值。压力输出与初始化内能的联系是通过表格数据中的p项来实现的，p项代表压力。因此，不能混用这两处的变量说明，因为它们代表不同的物理量。","answer_sha256":"9bc69c273a4bded5881a03ff7befb0cce652d5a033940a4962914f9c299671c1","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":834,"end":903}],"references_delivered":true},{"sample_id":"R-48d679ae4f9c","question":"若明确使用高度查表初始化，并把教程tableCoeffs中的correct改成true，后续校正流程怎样变化？不要推测最终压力必定仍等于原表值。","question_id":"P04-03","question_sha256":"4cfb6d281be155cd3393d93e77aa2c5a2df7be79d82579ba6c2887509d42b380","annotation_sha256":"c3c14cd19b899749c3cc1203cbddbb7e3b0054d55a9b976401620dcf385fcfe9","conditional":true,"criteria":[{"criterion_id":"P04-03.K1","claim":"手册允许表值设置后再做静水校正。","evidence_ids":["atmos_rule"]},{"criterion_id":"P04-03.K2","claim":"correct控制该后续步骤，true与原false形成启用条件变化。","evidence_ids":["atmos_table"]},{"criterion_id":"P04-03.K3","claim":"校正可能调整场，资料不足以保证最终场处处等于原表值。","evidence_ids":["atmos_rule"]}],"sources":[{"evidence_id":"atmos_rule","path":"manual/markdown/16_utilities.md","file_sha256":"12221c9affd01b16a88a57473f84e080a592e960649e26856aaeefbe2ed3eeac","line_start":225,"line_end":229,"label":"初始化工具用途/输入优先信息边界","excerpt":"## initializeAtmosphere\n\nThe initializeAtmosphere utility is used to initialize stable pressure and density fields such that the hydrostatic pressure gradient and gravitational acceleration force are balanced. The hydrostatic initialization procedure is a modified version of that available in OpenFOAM (OpenCFD Ltd., 2018a). Currently, there are two available models: hydrostatic and tabulated. The hydrostatic model dynamically solves for the hydrostatic pressure gradient and adjusts the density accordingly. The tabulated model reads a list of pressures and temperatures versus height to determine the density fields. An optional hydrostatic correction can be used once the table values have been set. See tutorials/initializeAtmosphere for an example.\n\nInputs can either be read from a dictionary or through the command line. If the tabulated option is requested, `system/atmosphereProperies` must be available.","excerpt_sha256":"f3a0523ea664b263931cedc4b1e583eb5888a92af5fc75052c648885841f2047"},{"evidence_id":"atmos_table","path":"tutorials/initializeAtmosphere/system/atmosphereProperties","file_sha256":"6ed6a23029139761a787ba3abc8fa908b77cecbe0a9436ad8607e864a22723d7","line_start":28,"line_end":43,"label":"备用查表参数块","excerpt":"tableCoeffs\n{\n    hRef            -10;        // Minimum point where h = 0\n    correct         false;      // Use hydrostatic initialization after\n                                // setting table values\n    pTable\n    {\n        p           (1.1e5 1e5); // Pressure values\n        h           (-10 10);    // Heights\n    }\n    TTable\n    {\n        T           (400 300);   // Temperature values\n        h           (-10 10);    // Heights\n    }\n}","excerpt_sha256":"7644f2c4ff9544211c2ef07c38ec21908671959d4d1ce9eb394455af7f94cb11"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["认为correct影响表文件是否存在或最终值必然不变"],"answer":"若明确使用高度查表初始化，并将教程tableCoeffs中的correct参数设置为true，后续校正流程将根据查表结果进行修正。具体校正流程取决于所使用的模型和算法，例如在某些情况下，修正可能涉及对初始值的调整以满足物理约束或边界条件。但无法保证最终压力必定等于原表值，因为修正过程可能受到其他因素（如流体动力学方程、边界条件等）的影响。","answer_sha256":"16ab670db57a3887e203e0028c92c3ef6c94706b896d155d6e55e738b3e93368","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-082de350f0cf","question":"我在DDT算例里改了燃速参数，初始场文件里怎么还是原来的值？这两个设置会自动同步吗？","question_id":"P06-03","question_sha256":"f063daa073c8a98cdb1b6c1f4f890265f582c2a4c06c83eb3840d17037babe19","annotation_sha256":"fc5896f6d0e9dedfe17e17c3300d7eab2468c0e170c85c1401ee73f545041aad","conditional":true,"criteria":[{"criterion_id":"P06-03.K1","claim":"物性Su和初始场Su是两个输入位置，分别在combustionProperties和0/Su，应分别核对。","evidence_ids":["su_props","su_field"]},{"criterion_id":"P06-03.K2","claim":"只改燃速参数不能假定初始场文件自动同步；边界也应核对，不从静态文件关系保证运行初始化顺序或全程燃速。","evidence_ids":["su_props","su_field"]}],"sources":[{"evidence_id":"su_props","path":"tutorials/blastXiFoam/deflagrationToDetonationTransition/constant/combustionProperties","file_sha256":"40070021b268bd556c1d3f1fe858fef413799134fbdec559a271d5e93ae17cc2","line_start":18,"line_end":28,"label":"火焰速度模型/物性","excerpt":"laminarFlameSpeedCorrelation RaviPetersen;\n\nfuel            HydrogenInAir;\n\nSu              Su [0 1 -1 0 0 0 0] 0.434;\n\nSuModel         unstrained;\n\nequivalenceRatio equivalenceRatio [0 0 0 0 0 0 0] 1;\n\nsigmaExt        sigmaExt [0 0 -1 0 0 0 0] 100000;","excerpt_sha256":"4b09eb1d8bb87c3b87828465a77789071da6575c89c4636a346cd0e71df608eb"},{"evidence_id":"su_field","path":"tutorials/blastXiFoam/deflagrationToDetonationTransition/0/Su","file_sha256":"869812b3fbb0c6735e5e69ad5181b5f464ee88e296ae9a4ce01cfa5871671cb0","line_start":17,"line_end":31,"label":"速度场初值和边界","excerpt":"dimensions      [0 1 -1 0 0 0 0];\n\ninternalField   uniform 0.434;\n\nboundaryField\n{\n    walls\n    {\n        type            zeroGradient;\n    }\n    defaultFaces\n    {\n        type            empty;\n    }\n}","excerpt_sha256":"1a7ce561859ab88686160dd6caf9c43c94c976ec43f29ecb518fe0b547e07654"}],"applicability":"固定版本语料范围；用户未给的本地配置和运行状态不能按参考案例补造，文档说明不等于运行或物理有效性验证。","acceptable_answer_range":"允许等义解释、正确代数形式和必要的条件澄清；不按引用数、固定句式或题干未给的具体值评分。配置问题接受任一种完整有效写法，不强制穷举未问的接口。","critical_errors":["声称修改物性文件会无条件自动改写0/Su","从两份输入断言全程燃速恒定"],"answer":"在OpenFOAM中，初始场文件（如`0/U`、`0/p`等）中的值不会自动与`fvSchemes`文件中的设置同步。`fvSchemes`文件定义了求解器使用的数值方法，如时间离散化（`ddtSchemes`）、梯度计算（`gradSchemes`）、通量计算（`fluxScheme`）等，但这些设置不会影响初始场文件中的物理参数值，如燃速参数。因此，如果你在`fvSchemes`中修改了时间离散化方法（如从`Euler`改为`RK1SSP`或`RK2`），这不会改变初始场文件中的值。你需要手动在初始场文件中更新燃速参数的值。","answer_sha256":"c6557d117180bbbc98266f648e8d7753f4551eb8a9a7feb626ba1ae6157e3ac0","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-9b6416d2dbc2","question":"在DDT案例中，我要求物性给定与Su初始内部场都设成0.6 m/s，并保持墙面和空方向边界原样。应怎样同时满足这三个约束？","question_id":"P06-02","question_sha256":"4f144e62906ecda75751b2f3f7988855f378628d7fd4343af76a4fdf5ffd3370","annotation_sha256":"e3c7c03745b840fc1f42d88865cad62eb80d0dc18d990a62966be222d3b15a06","conditional":true,"criteria":[{"criterion_id":"P06-02.K1","claim":"combustionProperties Su改0.6并保留速度量纲。","evidence_ids":["su_props"]},{"criterion_id":"P06-02.K2","claim":"0/Su internalField改uniform 0.6。","evidence_ids":["su_field"]},{"criterion_id":"P06-02.K3","claim":"墙面zeroGradient及defaultFaces empty保持，不能改成统一fixedValue。","evidence_ids":["su_field"]}],"sources":[{"evidence_id":"su_props","path":"tutorials/blastXiFoam/deflagrationToDetonationTransition/constant/combustionProperties","file_sha256":"40070021b268bd556c1d3f1fe858fef413799134fbdec559a271d5e93ae17cc2","line_start":18,"line_end":28,"label":"火焰速度模型/物性","excerpt":"laminarFlameSpeedCorrelation RaviPetersen;\n\nfuel            HydrogenInAir;\n\nSu              Su [0 1 -1 0 0 0 0] 0.434;\n\nSuModel         unstrained;\n\nequivalenceRatio equivalenceRatio [0 0 0 0 0 0 0] 1;\n\nsigmaExt        sigmaExt [0 0 -1 0 0 0 0] 100000;","excerpt_sha256":"4b09eb1d8bb87c3b87828465a77789071da6575c89c4636a346cd0e71df608eb"},{"evidence_id":"su_field","path":"tutorials/blastXiFoam/deflagrationToDetonationTransition/0/Su","file_sha256":"869812b3fbb0c6735e5e69ad5181b5f464ee88e296ae9a4ce01cfa5871671cb0","line_start":17,"line_end":31,"label":"速度场初值和边界","excerpt":"dimensions      [0 1 -1 0 0 0 0];\n\ninternalField   uniform 0.434;\n\nboundaryField\n{\n    walls\n    {\n        type            zeroGradient;\n    }\n    defaultFaces\n    {\n        type            empty;\n    }\n}","excerpt_sha256":"1a7ce561859ab88686160dd6caf9c43c94c976ec43f29ecb518fe0b547e07654"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["只改一个值","将所有边界改fixedValue 0.6"],"answer":"可以通过在DDT案例的设置中同时修改初始内部场速度和物性值来满足约束。具体步骤如下：\n1. 修改物性值：在DDT案例的设置中找到物性值的设置项，修改其值为0.6 m/s。\n2. 修改初始内部场速度：在DDT案例的设置中找到初始内部场速度的设置项，修改其值为0.6 m/s。\n3. 保持墙面和空方向边界原样：确保墙面和空方向边界的设置项保持不变。\n通过以上步骤，可以同时满足三个约束。","answer_sha256":"995e6a162c27cfe38f3fe48b135a587307fc62f0d367ac421c54fb547ff389ff","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"DDT案例手册","start":1,"end":10}],"references_delivered":false},{"sample_id":"R-17351f869755","question":"在 blastFSIFoam 的挡板算例中，该算例被用来演示什么能力？该算例的几何与载荷设置是什么？","question_id":"E49-01","question_sha256":"26093f952fedddb88b6e2e95ee9979bfdd85661a1f7feb35fb2816c26dbfb94c","annotation_sha256":"b929cf9408363deb3f57c0ec5093952c7f4f518895420d532c2110396ae89371","conditional":false,"criteria":[{"criterion_id":"E49-01.K1","claim":"该算例用于演示 blastFoam 处理流固耦合（FSI）的能力。","evidence_ids":["X_fsi_readme"]},{"criterion_id":"E49-01.K2","claim":"算例包含一个小型 C4 装药在二维中靠近墙壁起爆。","evidence_ids":["X_fsi_readme"]},{"criterion_id":"E49-01.K3","claim":"挡板在爆炸波到达时变形，并会影响波越过挡板后的传播方式。","evidence_ids":["X_fsi_readme"]}],"sources":[{"evidence_id":"X_fsi_readme","path":"tutorials/blastFSIFoam/flap/README.md","file_sha256":"e2c1b70a604582d9d11d82ef2bcb3402aee30c6e92367b702ac49d5075402b71","line_start":1,"line_end":11,"label":"fsi_readme","excerpt":"# FSI flap simulation\n\n## Notes\n\nThis case is used to demonstrate the capability of blastFoam to handle fluid-structure interaction.\n\nThe blastFSIFoam solver is still under development and changing the case setup may result in crashes.\n\nThe case consists of a small c4 charge being detonated near a wall in 2 dimensions. The flap will deform when the blast wave reached it, and will effect how the wave moves past the flap. This is a modified version of the preCICE tutorial presented.\n\nThe calculation took \\~6 minutes to run on a four-core desktop.","excerpt_sha256":"4731746c9cd2418f14c1278bf02c5a0aee81b236466385166612fdba9af39ba3"}],"applicability":"仅适用于该挡板算例的原文描述；不推广为已验证的爆炸工程案例。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["声称该算例是已验证的爆炸工程案例","忽略二维设置或 C4 装药位置","声称挡板不变形或对波传播无影响"],"answer":"该算例被用来演示blastFoam的流体-结构交互能力。该算例的几何是2维的，包括一个小型C4爆炸物和一个壁面。爆炸物的爆炸会导致壁面上的扇叶结构发生变形，进而影响爆炸波的传播。","answer_sha256":"0a0c05cfc0f2f9cc6ccda517a7d9b30bc5252e33ad8f7fe2f0750d17f886b678","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFSIFoam/flap/README.md","start":5,"end":12}],"references_delivered":true},{"sample_id":"R-f298e6a7dd65","question":"我在用field破裂模型，想设置压力和冲量两个阈值，字典里该怎么写？","question_id":"E27-02","question_sha256":"12ab60369b3deab2235c564cd099e8fe1a9c8ca2e86de8a2ae37847f8f55a043","annotation_sha256":"87a5362cb55f4c249f0cebc549154436b0afe244ebf98403fa802f96629565d6","conditional":false,"criteria":[{"criterion_id":"E27-02.K1","claim":"给出至少一种完整有效的多场写法：burstValues中成对列出场名与阈值，或fields与values两个列表按顺序对应；两种都给也可。","evidence_ids":["X_burst_field"]},{"criterion_id":"E27-02.K2","claim":"正确对应压力p与冲量impulse及其阈值；允许符号占位或说明性示例，不强制复述题干未给的4e7/10000。","evidence_ids":["X_burst_field"]}],"sources":[{"evidence_id":"X_burst_field","path":"manual/markdown/07_burst_patches.md","file_sha256":"1c4fd9c6a681b0f0ad846967ff49ddc2737e234aa01e39536f41f493418c8097","line_start":37,"line_end":67,"label":"burst_field","excerpt":"### 7.1.4 field\n\nA list of fields and bust values are used to determine if the patch has burst. The inputs can either be given as a single entry (\"burstValue\"), multiple burst conditions (\"burstValues\"), or as a list of names and values (\"fields\" and \"values\"). The latter is used when writing to remove errors in ParaView. See below for an example.\n\n```cpp\n// Model\nburstModel\nfield;\n// Single Entry\nburstValue\np\n4e7;\n// Multiple Entries\nburstValues\n(\np\n4e7\nimpulse 10000\n);\n// Multiple Entries, split\nfields (p\nimpulse);\nvalues (4e7 10000);\n```\n\n| Variable | Description |\n|---|---|\n| burstValue | Used for single field burst condition [name value] |\n| burstValues | Used for multiple field burst condition [(name1 value1 name2 value2 ... nameN valueN)] |\n| fields | Name of the fields |\n| values | Values at which burst occurs |","excerpt_sha256":"65940cc82529c6967dd2b725846cdb95c972c5afea86752bc8e6260df46d6443"}],"applicability":"固定版本语料范围；用户未给的本地配置和运行状态不能按参考案例补造，文档说明不等于运行或物理有效性验证。","acceptable_answer_range":"允许等义解释、正确代数形式和必要的条件澄清；不按引用数、固定句式或题干未给的具体值评分。配置问题接受任一种完整有效写法，不强制穷举未问的接口。","critical_errors":["场名与阈值对应错误或缺失","断言fields/values只能用于单场","把field小节未说明的AND/OR当作已确认实现事实"],"answer":"在使用field破裂模型时，若想设置压力和冲量两个阈值，您需要在字典中使用\"fields\"和\"values\"的组合来指定多个字段及其对应的破裂值。例如，您可以这样写：\n\nfields (p impulse);\nvalues (4e7 10000);\n\n这表示当压力(p)达到4e7时或冲量(impulse)达到10000时，破裂条件被触发。注意，这些字段和值的设置需要符合您所使用的具体模型和模拟需求。","answer_sha256":"e81202a0a129a638e47280cf3c31d9469088b7fac082fcaf69ba89779a63bfe6","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/07_burst_patches.md","start":37,"end":67},{"path":"manual/markdown/07_burst_patches.md","start":33,"end":36},{"path":"tutorials/blastFoam/freeField/README.md","start":1,"end":8},{"path":"manual/markdown/15_function_objects.md","start":45,"end":63},{"path":"manual/markdown/11_amr.md","start":62,"end":76},{"path":"manual/markdown/11_amr.md","start":46,"end":61},{"path":"tutorials/preCICE/flap/Fluid/constant/dynamicMeshDict","start":23,"end":54},{"path":"tutorials/preCICE/flap/Fluid/constant/dynamicMeshDict","start":9,"end":22},{"path":"tutorials/blastFoam/freeField/constant/dynamicMeshDict","start":15,"end":40},{"path":"manual/markdown/16_utilities.md","start":42,"end":57}],"references_delivered":true},{"sample_id":"R-22468dd2c615","question":"若已经明确使用手册所述solid热力学类，能否照搬双装药RDX反应物的Murnaghan EOS？请区分类选择改变与材料名相同。","question_id":"P05-03","question_sha256":"3eda027ee7ca3550f8fcab44917983cdd46029c885bf56b721920707cacbea0e","annotation_sha256":"53b09556d13fa52c1203c7b6846428769dc37655b1e1826961d4066321266a04","conditional":true,"criteria":[{"criterion_id":"P05-03.K1","claim":"在明确该solid类的条件下，文档限制为常密度EOS。","evidence_ids":["solid_scope"]},{"criterion_id":"P05-03.K2","claim":"双装药RDX块的Murnaghan不构成该solid类支持Murnaghan的证据；需重新核对模型类别及兼容性。","evidence_ids":["two_rdx"]}],"sources":[{"evidence_id":"solid_scope","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":3,"line_end":13,"label":"solid热力学类作用域","excerpt":"Within blastFoam solvers, two different types of basic thermodynamic models\nare used. The primary is that of a fluid where internal energy and density, or\ntemperature and density, are used to find the resulting pressure and speed of\nsound. The other, is the solid thermodynamic model, which is only used for\nsolid phases within multi-fluid solvers and multi-region solvers. These two\nmodels will share the basic thermodynamic classes (eConst, hConst, etc),\nas well as the choice in the type (basic, detonating, or multicomponent),\nhowever the solid phase only can use a constant density equation of state,\nand the transport model describes the of heat conduction, rather than flow\ncoefficients (like viscosity). These specific choices will be described below.\nTo calculate the pressure and temperature given the conservative quantities (mass, momentum, and energy) three components are required: an equation of state, a thermodynamic model, and a transport model. These models are defined in the `phaseProperties` file located in the `constant` directory of each blastFoam case. Each phase within the `phaseProperties` file has several dictionary entries, and these models are specified in the \"thermoType\" sub-dictionary; the molecular weight must also be defined in the \"specie\" sub-dictionary.","excerpt_sha256":"68c8f27312d7e404fa7f1b9ce4b3beb2f9d7b591e0ef0b797a08c2975ec40480"},{"evidence_id":"two_rdx","path":"tutorials/blastFoam/twoChargeDetonation/constant/phaseProperties","file_sha256":"2de7919133d4f714160d0a1cd710cc376a8a9220196faf79f9373face6d654dd","line_start":18,"line_end":98,"label":"相列表及RDX状态/激活选择","excerpt":"phases (RDX tnt gas);\n\nRDX\n{\n    type detonating;\n    reactants\n    {\n        thermoType\n        {\n            transport   const;\n            thermo      eConst;\n            equationOfState Murnaghan;\n        }\n        equationOfState\n        {\n            rho0            1160;\n            n               7.4;\n            kappa           3.9e11;\n            Gamma           0.35;\n            pRef            101298;\n        }\n        specie\n        {\n            molWeight       222.12;\n        }\n        transport\n        {\n            mu              0;              // Viscosity\n            Pr              1;              // Prandtl number\n        }\n        thermodynamics\n        {\n            Cv              1130.78;           // Heat capacity\n            Hf              0.0;\n        }\n    }\n    products\n    {\n        thermoType\n        {\n            transport   const;\n            thermo      eConst;\n            equationOfState JWL;\n        }\n        equationOfState\n        {\n            A               2.9867e11;\n            B               4.11706e9;\n            R1              4.95;\n            R2              1.15;\n            C               7.206147e8;\n            omega           0.35;\n            rho0            1160;\n        }\n        specie\n        {\n            molWeight       55.0;\n        }\n        transport\n        {\n            mu              0;              // Viscosity\n            Pr              1;              // Prandtl number\n        }\n        thermodynamics\n        {\n            Cv              1000;           // Heat capacity\n            Hf              0.0;\n        }\n    }\n\n    activationModel linear;\n    initiation\n    {\n        E0      4.0e9;\n        points  ((0 0.55 0));\n        vDet    7850;\n    }\n\n    residualRho     1e-6;           // Minimum density of the phase\n    residualAlpha   1e-6;          // Minimum volume fraction used for division\n}","excerpt_sha256":"67a0a359473845da3f0f4540c565e093cc07c58500ad8e9a63c15c9f729ead0c"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["因为都是RDX就说可直接照搬"],"answer":"在提供的资料中，可以看到对于RDX材料，其热力学类（thermoType）中确实使用了Murnaghan状态方程（equationOfState Murnaghan）。因此，如果已经明确使用手册所述的solid热力学类，可以照搬双装药RDX反应物的Murnaghan EOS。","answer_sha256":"6ca29f5b4890a5912fff12507389c5c7479c08694f71f43c85a23378847c9c14","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/delayedDetonation/constant/phaseProperties","start":25,"end":38}],"references_delivered":true},{"sample_id":"R-e7f9c4154a66","question":"若要求在两个流体相之间直接启用手册第3.5节的质量传递模型，是否落在当前支持范围？它与particle-to-fluid质量传递的范围有何区别？","question_id":"N68-01","question_sha256":"a427b46e576ec5b0ec4e973d59fa6af277933c5ca895fef816665f618fe3fc75","annotation_sha256":"1431f05f7313ef2fbc0f280c8bcfc3b2c8476416cb9ababd0a957fa8bb58f534","conditional":true,"criteria":[{"criterion_id":"N68-01.K1","claim":"当前只实现particle-to-fluid质量传递。","evidence_ids":["v2_mass"]},{"criterion_id":"N68-01.K2","claim":"fluid-fluid质量传递当前不支持，不能仅因存在质量传递模型就判定可用。","evidence_ids":["v2_mass"]}],"sources":[{"evidence_id":"v2_mass","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":255,"line_end":265,"label":"3.5 Mass transfer models","excerpt":"## 3.5 Mass transfer models\n\nCurrently on particle to fluid mass transfer has been implemented. Fluid-fluid mass transfer is not currently supported.\n\n### 3.5.1 none\n\nNo mass transfer.\n\n### 3.5.2 reactingParticle\n\nThe mass transfer rate is explicitly calculated using the change in mass of a particle where the regression rate is determined by a reaction rate. the reactingParticle diameter model must be used.","excerpt_sha256":"5276becbf604f814dab88b5bacaa5e4035b68fb2bad03545482d5433dffdec62"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"当前blastFoam不支持在两个流体相之间直接启用手册第3.5节的质量传递模型。手册第3.5节中提到，目前仅实现了粒子到流体的质量传递模型，而流体-流体的质量传递模型尚未支持。与粒子到流体的质量传递模型相比，流体-流体的质量传递模型涉及不同流体相之间的质量交换，而粒子到流体的质量传递模型则涉及粒子相与流体相之间的质量交换。","answer_sha256":"e1f392eaffeb1b0d1710055db1dad39cd63ed111283fa6247
