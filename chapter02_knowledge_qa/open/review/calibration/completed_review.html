949acd0072b8c1d","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/03_interfacial_models.md","start":255,"end":258},{"path":"manual/markdown/19_solvers.md","start":9,"end":14}],"references_delivered":true},{"sample_id":"R-cf56a2b952e5","question":"densityGradient看的是总密度还是某一相的密度？它怎样衡量哪里变化大，有做归一化吗？","question_id":"E42-01","question_sha256":"cf066e93a16e46a7877ba7d9486d32ef2f2e9a176f23dcb961b5bd7ce37d1ffd","annotation_sha256":"d7136a8766bf14bfbc56770df79040fd5013947f4105bfda3ac0be7f6068f145","conditional":false,"criteria":[{"criterion_id":"E42-01.K1","claim":"densityGradient使用总密度，不是只取某个炸药相的密度。","evidence_ids":["X_amr_density"]},{"criterion_id":"E42-01.K2","claim":"按式(11.4)比较中心与两侧梯度量偏差，构造含梯度与尺度项的归一化比值，取较大者并带f指数；不强制背全部符号或原文矛盾定义。","evidence_ids":["X_amr_density"]}],"sources":[{"evidence_id":"X_amr_density","path":"manual/markdown/11_amr.md","file_sha256":"26ca1848c6ddee2c65bc94c57a4d6745b0ca7d2412312b63791545e864f058df","line_start":109,"line_end":131,"label":"amr_density","excerpt":"### 11.1.5 Density gradient (densityGradient)\n\nA modified density gradient was defined by Zheng et al. (2008), and uses an error defined by\n\n$$\n\\epsilon_{\\nabla\\rho} = \\max\\left( \\frac{|(\\nabla\\ln\\rho)_{C} - (\\nabla\\ln\\rho)_{own}|}{\\alpha f \\rho_{C}/dl + |(\\nabla\\ln\\rho)_{own}|},\\ \\frac{|(\\nabla\\ln\\rho)_{C} - (\\nabla\\ln\\rho)_{nei}|}{\\alpha f \\rho_{C}/dl + |(\\nabla\\ln\\rho)_{nei}|} \\right)^{f}\n$$\n(11.4)\n\nwith\n\n$$\n(\\nabla\\ln\\rho)_{C} = \\frac{\\rho_{nei} - \\rho_{own}}{|r_{nei} - r_{own}|}\n$$\n(11.5)\n\n$$\n(\\nabla\\ln\\rho)_{nei,own} = \\frac{(\\nabla\\rho)_{nei,own}(r_{nei} - r_{own})}{|r_{nei} - r_{own}|}\n$$\n(11.6)\n\n$r_{own,nei}$ is the surface normal vector, and $dl = |r_{nei} - r_{own}|$, is the distance between cell centers. This error estimator uses the total density.\n","excerpt_sha256":"1891bdcadb374dbab9553f773e863d455490e5b2901bfa5e5b468acdd2af394b"}],"applicability":"固定版本语料范围；用户未给的本地配置和运行状态不能按参考案例补造，文档说明不等于运行或物理有效性验证。","acceptable_answer_range":"允许等义解释、正确代数形式和必要的条件澄清；不按引用数、固定句式或题干未给的具体值评分。配置问题接受任一种完整有效写法，不强制穷举未问的接口。","critical_errors":["声称该指标只使用单个炸药相密度","把有疑点的原文符号解释称为已核验实现事实"],"answer":"densityGradient衡量的是总密度的变化。它通过计算相邻单元格之间的密度梯度（即密度的自然对数的梯度）来评估误差，具体公式为：$$\\epsilon_{\\nabla\\rho} = \\max\\left( \\frac{|(\\nabla\\ln\\rho)_{C} - (\\nabla\\ln\\rho)_{own}|}{\\alpha f \\rho_{C}/dl + |(\\nabla\\ln\\rho)_{own}|},\\ \\frac{|(\\nabla\\ln\\rho)_{C} - (\\nabla\\ln\\rho)_{nei}|}{\\alpha f \\rho_{C}/dl + |(\\nabla\\ln\\rho)_{nei}|} \\right)^{f}$$。该误差估计器并未提及归一化操作，而是直接使用总密度进行计算。","answer_sha256":"ad7d3aeabfd7e18a3d3073ef9e82cf9cf35e117077827f9dcd13fc8a439f52d1","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/11_amr.md","start":109,"end":131}],"references_delivered":true},{"sample_id":"R-28a6dd388a39","question":"rotateFields 工具当前在映射时是否守恒？这种非守恒特性对爆炸流场特征可能产生什么影响？","question_id":"E39-03","question_sha256":"036c918c15d2b1cb197d797ff0ce779be239f76ab6dcb3f002c14f999032e3f9","annotation_sha256":"69f63b0f8f0162e2eed03903e21f7a1adf2a06df88e99b0635f71eb5c81dafc4","conditional":false,"criteria":[{"criterion_id":"E39-03.K1","claim":"当前映射不是守恒的。","evidence_ids":["X_rotate"]},{"criterion_id":"E39-03.K2","claim":"由于非守恒，只使用最近单元值，可能导致某些流动特征被过度或不足强调。","evidence_ids":["X_rotate"]}],"sources":[{"evidence_id":"X_rotate","path":"manual/markdown/16_utilities.md","file_sha256":"12221c9affd01b16a88a57473f84e080a592e960649e26856aaeefbe2ed3eeac","line_start":245,"line_end":270,"label":"rotate","excerpt":"## rotateFields\n\nThe `rotateFields` utility is can be used to map the fields of a 1-D or 2-D solution to that of a 2-D or 3-D solution, where the source and target meshes are used to determine the rotation. The rotation of vector and tensor fields are mapped using the local rotation tensor to ensure that the correct radial components are used. Only field present in the target case are mapped, however additional fields can be mapped. Because there are no values for these fields, the closest value on the source mesh is used for cells outside of the mapped cells. Iterative refinement can be used to iteratively rotate fields and refine the mesh using the refinement criteria found in `dynamicMeshDict` allowing for easier initialization when using AMR.\n\n\u003e **NOTE:** The mapping is not conservative currently so only the nearest cell value will be used which can result in certain flow features either being over or under emphasised.\n\n```sh\nUsage: rotateFields \u003csourceCase\u003e [OPTIONS]\n```\n\nCommand line options:\n\n| Variable | Description |\n|---|---|\n| -sourceTime | Time in the source case to map (default is startFrom time in source case) |\n| -sourceRegion | Region of the source case to map (only used for multi-region) |\n| -targetRegion | Region of the target case to map to (only used for multi-region) |\n| -extend | If a cell is outside of the source range, map to the closest cell (default is no) |\n| -maxR | Cutoffradius to map (default is a big number) |\n| -centre | Center of rotation on the source mesh (default is the center of the source mesh) |\n| -uniform | Copy uniform fields to the target case (default is no) |\n| -additionalFields | List of additional fields to map |\n| -refine | Iteratively map, rotate and refine the mesh |\n| -parallelSource | Map from a parallel source |\n| -tets | Use cell tet decomposition (no by default) |\n","excerpt_sha256":"9e6fac7472d95bf3bb2fbb97dae205e2e817ac06e3ca53bbe50c71a16bad184e"}],"applicability":"适用于所有使用 rotateFields 进行低维到高维映射的场景；不区分具体爆炸案例。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["声称映射是守恒的","声称非守恒不会影响流场特征"],"answer":"rotateFields 工具在映射时通常不保证守恒，其行为取决于具体实现和所使用的算法。非守恒特性可能导致在爆炸流场中出现能量或质量的不准确分布，从而影响模拟的物理准确性和稳定性。这种特性可能使得流场中的某些关键特征（如冲击波传播、湍流结构等）无法被正确捕捉，进而导致结果偏差。","answer_sha256":"3c041925dbffc18297d40b6013bc5ecced8c900680efc9b335a59c060be46bc9","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-fdb7ecb35617","question":"在 blastFoam 的相字典中，如果完全没有出现 afterburnModel 关键字，按原文会采用哪一种后燃处理？这种处理对能量加入和压力温度有什么直接后果？","question_id":"E20-01","question_sha256":"86d34155735e63eb7952b08896e1ac8d88125a772ced2d34c8a3b3cdfec9807f","annotation_sha256":"7dade97bd98d841c0f41b87e3351cc0cff0e637a10ee1016b771b2fa2e86e029","conditional":true,"criteria":[{"criterion_id":"E20-01.K1","claim":"未指定 afterburnModel 时使用 none 模型，即不加入额外能量。","evidence_ids":["X_afterburn_default"]},{"criterion_id":"E20-01.K2","claim":"none 模型下不会添加额外能量，因此不会因后燃而提高压力与温度。","evidence_ids":["X_afterburn_default"]},{"criterion_id":"E20-01.K3","claim":"该默认行为由关键字缺失触发，而非由用户显式选择。","evidence_ids":["X_afterburn_default"]}],"sources":[{"evidence_id":"X_afterburn_default","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1263,"line_end":1292,"label":"afterburn_default","excerpt":"### 5.6.2 Afterburn Models\n\nWhen reactions occur over a period of time after the initial charge has been activated, additional energy can be added that results in higher pressure and temperature, and is refered to afterburn. Afterburn is typical in under-oxygenated and/or non-ideal explosives, which may release energy at a later time. The advection scheme and limiters for $c_i$ need to be specified in the fvSchemes in the same manner as the other transported quantities.\n\n#### 5.6.2.1 none [default]\n\nNo additional energy is added. If the keyword \"afterburnModel\" is not found in the phase dictionary, this is the model that is used.\n\n#### 5.6.2.2 constant\n\nA constant amount of afterburn energy is added where $\\dot{Q}$ is specified by the user.\n\n| Variable | Description |\n|---|---|\n| `Qdot` | Afterburn energy addition rate[J/kg/s] |\n\n#### 5.6.2.3 linear\n\nAfterburn energy is added linearly from a start time to an end time where\n\n$$\n\\dot{Q} = \\begin{cases} \\frac{Q_0}{\\Delta t} \u0026 \\text{if } t_{start} \u003c t \u003c t_{end} \\\\ 0 \u0026 \\text{else} \\end{cases}\n$$\n(5.95)\n\n| Variable | Description |\n|---|---|\n| $Q_0$ | Afterburn energy [J/kg] |\n| `tStart` | Time energy begins being added [s] |\n| `tEnd` | Time energy stops being added [s] |","excerpt_sha256":"91e5a6a77a6e46bc81a74db2e89a5be5022b383f6033965e8fa758f10c8ac3e0"}],"applicability":"仅适用于相字典中未出现 afterburnModel 关键字的配置；原文未说明其他字典或全局设置是否会覆盖该默认。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把未指定 afterburnModel 误认为会自动启用 constant 或 linear 后燃","认为 none 模型仍会按某个默认速率加入能量"],"answer":"blastFoam会采用\"none\"后燃处理模型，这意味着不会添加额外的能量。这种处理对能量加入和压力温度没有直接后果，因为没有额外的能量被添加。","answer_sha256":"d0eeb110bca3c4eac1946df2ec3e464d9a6eaeb172a34ac2dd7fb3a68132aabf","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":1269,"end":1270}],"references_delivered":true},{"sample_id":"R-29dfa00d1883","question":"在 blastFoam 的 AMR 中，densityGradient 误差估计器与 beginUnrefine 参数如何共同影响自由场爆炸仿真的网格演化？请结合自由场教程配置说明。","question_id":"E42-03","question_sha256":"eb7bced08c05931671dac0871a4ea679c11b7d621da630c9f2e19af652962775","annotation_sha256":"b77e023fae0de971a57303bec2d606c7497dd366ee530274b3479a061ea3cf86","conditional":false,"criteria":[{"criterion_id":"E42-03.K1","claim":"densityGradient使用总密度定义误差；自由场教程显式errorEstimator densityGradient。","evidence_ids":["X_amr_density","X_free_mesh"]},{"criterion_id":"E42-03.K2","claim":"自由场教程beginUnrefine=1e-5，而手册将它定义为粗化可以开始的时刻，默认0 s。","evidence_ids":["X_free_mesh","amr_general"]},{"criterion_id":"E42-03.K3","claim":"误差估计用于确定可细化/粗化的单元，beginUnrefine提供粗化时间准入；该实例有密度指标和延后准入两个设置，但1e-5不是已知起爆时刻，也不能单凭静态配置保证整个网格一直细化或特定运行结果。","evidence_ids":["amr_general","X_free_mesh"]}],"sources":[{"evidence_id":"X_amr_density","path":"manual/markdown/11_amr.md","file_sha256":"26ca1848c6ddee2c65bc94c57a4d6745b0ca7d2412312b63791545e864f058df","line_start":109,"line_end":131,"label":"amr_density","excerpt":"### 11.1.5 Density gradient (densityGradient)\n\nA modified density gradient was defined by Zheng et al. (2008), and uses an error defined by\n\n$$\n\\epsilon_{\\nabla\\rho} = \\max\\left( \\frac{|(\\nabla\\ln\\rho)_{C} - (\\nabla\\ln\\rho)_{own}|}{\\alpha f \\rho_{C}/dl + |(\\nabla\\ln\\rho)_{own}|},\\ \\frac{|(\\nabla\\ln\\rho)_{C} - (\\nabla\\ln\\rho)_{nei}|}{\\alpha f \\rho_{C}/dl + |(\\nabla\\ln\\rho)_{nei}|} \\right)^{f}\n$$\n(11.4)\n\nwith\n\n$$\n(\\nabla\\ln\\rho)_{C} = \\frac{\\rho_{nei} - \\rho_{own}}{|r_{nei} - r_{own}|}\n$$\n(11.5)\n\n$$\n(\\nabla\\ln\\rho)_{nei,own} = \\frac{(\\nabla\\rho)_{nei,own}(r_{nei} - r_{own})}{|r_{nei} - r_{own}|}\n$$\n(11.6)\n\n$r_{own,nei}$ is the surface normal vector, and $dl = |r_{nei} - r_{own}|$, is the distance between cell centers. This error estimator uses the total density.\n","excerpt_sha256":"1891bdcadb374dbab9553f773e863d455490e5b2901bfa5e5b468acdd2af394b"},{"evidence_id":"X_free_mesh","path":"tutorials/blastFoam/freeField/constant/dynamicMeshDict","file_sha256":"7684c259e142187b8ca548daf5885292cd660d7f9601c03c85bf4adb75ca1970","line_start":17,"line_end":39,"label":"free_mesh","excerpt":"dynamicFvMesh   adaptiveFvMesh;\nerrorEstimator  densityGradient;\n\n// When can unrefinement start\nbeginUnrefine 1e-5;\n\n// How often to refine\nrefineInterval  3;\n\n// Refine field in between lower..upper\nlowerRefineLevel 0.1;\n\n// If value \u003c unrefineLevel unrefine\nunrefineLevel   0.1;\n\n// Have slower than 2:1 refinement\nnBufferLayers   3;\n\n// Refine cells only up to maxRefinement levels\nmaxRefinement   3;\n\n// Write the refinement level as a volScalarField\ndumpLevel       true;","excerpt_sha256":"aa62e569970d4eb4fafd21f5d803aa8f42056034d306265592cc28b550f03f16"},{"evidence_id":"amr_general","path":"manual/markdown/11_amr.md","file_sha256":"26ca1848c6ddee2c65bc94c57a4d6745b0ca7d2412312b63791545e864f058df","line_start":3,"line_end":44,"label":"爆轰AMR时序与探针细化","excerpt":"The dynamic mesh classes have been incorporated from the github repository SOFTX_2018_143 and is based on the work of Rettenmaier et al. (2019). This library introduces 2-D, 2-D axisymmetic, and 3-D (present in OpenFOAM-9) all with the option to include dynamic load balancing. The original work (dynamicRefineBalanceFvMesh and dynamicRefineFvMesh) has been used as the base for the adaptiveFvMesh class. This mesh type has been further developed, specifically for compressible flows, and includes modifications for improved stability with meshes created with snappyHexMesh. Additional polyhedral refinement has been ported from foam-extend's and allows for general polygon refinement.\n\nBecause the detonation of explosives may not occur when the simulation starts, the option to begin unrefinement at a designated time (\"beginUnrefine\") has been added. This allows the mesh to remain refined in specific regions even though the error is initially small.\n\nAdditionally, the movingAdaptiveFvMesh class is based on adaptiveFvMesh, and has all of the same features, but includes the ability to use mesh motion. It is recommended to use the velocityLaplacian motion solver.\n\n\u003e **NOTE:** Whilst AMR may be used with meshes created using snappyHexMesh, regions can only be cut at level 0 when using either 2-D or axisymmetric refinement. This is due to the fact that snappyHexMesh uses a 3-D refinement, regardless of the number of solution directions. If refinement is used, the simulation will crash when the mesh is refined in these areas.\n\n\u003e **NOTE:** Meshes that have been \"snapped\" with snappyHexMesh may work, however crashes may occur. Use at your own risk.\n\n| Entry | Description |\n|---|---|\n| balance | Is dynamic load balancing used (default is yes) |\n| protectedPatches | List of patch names that will not be refined or unrefined (default is none) |\n| nRefinementBufferLayers | Number of layers added to refinement (default is 0) |\n| nUnrefinementBufferLayers | number oy layers added to unrefinement (default is 0) |\n| refine | Use refinement (default is yes) |\n| unrefine | Use unrefinement (default is yes) |\n| refineInterval | Number of time steps between refinement (default is 1) |\n| unrefineInterval | Number of time steps between unrefinement (default is 1) |\n| balanceInterval | Number of time steps between balancing (default is 1) |\n| beginRefine | Time when refinement can begin (default is 0 s) |\n| endRefine | Time when refinement stops (default is great s) |\n| beginUnrefine | Time when unrefinement can begin (default is 0 s) |\n| endUnrefine | Time when unrefinement stops (default is great s) |\n| beginBalance | Time when balancing can begin (default is 0 s) |\n| endBalance | Time when balancing stops (default is great s) |\n| dumpLevel | Write the cell and point level as viewable fields (false by default) |\n\n## 11.1 Error estimators\n\nIn order to determine the cells that can be refined or unrefined, error estimators have been added. Generally, this is achieved by looking for a derivative or difference of a specified fields across all the faces a cell and it neighbours. The maximum value of all face errors of a given cell is taken as the cell center-based value, and is used to define the cells that should be refined. Probe locations are automatically refined up to the maximum level of refinement to remove discontinuities in probe sampling.\n\n| Entry | Description |\n|---|---|\n| lowerRefineLevel | Error that mesh is refined at |\n| unrefineLevel | Error that mesh is unrefined |\n| upperRefineLevel | Error that refinement is stopped (default is great) |\n| upperUnrefineLevel | Error that unrefinement begins to occur again (default is great) |\n| maxRefinement | Maximum number of refinement levels |\n| minDx | Minimum cell size |\n| refineProbes | Are probes refined (yes by default) |","excerpt_sha256":"78eaf208a5ff76f2893412de02d1b25635cce7844401a1ca3a20a68638662d8b"}],"applicability":"限定自由场教程的静态AMR设置及手册定义；具体演化仍需场值、网格与实际运行证据。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把beginUnrefine当空间细化阈值","把1e-5当已知起爆时刻","由选择densityGradient就保证全域网格一直细化"],"answer":"在 blastFoam 的 AMR 中，densityGradient 误差估计器通过梯度信息识别需要细化的区域，而 beginUnrefine 参数控制细化的起始时间步。两者共同作用使网格在爆炸冲击波传播时自动加密，随后在冲击波衰减时逐步粗化，从而优化计算资源分配。","answer_sha256":"bb90712579b995777d34f19511d99eb034723f36a414c97ddab8cb7e47eda64b","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-da938412101c","question":"对比 blastFoam building3D 与 blastFSIFoam building3D 两个 Allrun 脚本：在网格准备阶段，前者是否拆分区域？后者是否拆分区域？两者在运行求解器前对内部 patch 的处理分别是什么？","question_id":"E48-03","question_sha256":"ec36631c118e4e98e9b443083dfaaee5ee6fb77116f1b789b261fd5f6b137b23","annotation_sha256":"fa229ee87ae7dbfa01234fc9aa22e76343944eee154ba2e1494f4c59a75ecdda","conditional":false,"criteria":[{"criterion_id":"E48-03.K1","claim":"blastFoam building3D 脚本没有 splitMeshRegions 调用，而是直接 blockMesh 后 decomposePar -copyZero。","evidence_ids":["X_building_script"]},{"criterion_id":"E48-03.K2","claim":"blastFSIFoam building3D 脚本在 blockMesh 后调用 splitMeshRegions -cellZones -overwrite 拆分区域。","evidence_ids":["X_fsi_building_script"]},{"criterion_id":"E48-03.K3","claim":"blastFoam building3D 脚本用 addEmptyPatch internalPatch internal -overwrite 添加内部 patch；blastFSIFoam building3D 脚本用 addEmptyPatch internalPatch internal -region air -overwrite 仅在 air 区域添加。","evidence_ids":["X_building_script","X_fsi_building_script"]}],"sources":[{"evidence_id":"X_building_script","path":"tutorials/blastFoam/building3D/Allrun","file_sha256":"4adcdd258aa089741dcd2cf47a1cd8974b1a679734b9df8b4e18f5a2eb92ad0e","line_start":10,"line_end":29,"label":"building_script","excerpt":"# -- Pre-process the stl\nrunApplication surfaceFeatures\n\n# -- Create the mesh for the fluid\nrunApplication blockMesh\n\n# -- Decompose the mesh\nrunApplication decomposePar -copyZero\n\n# -- Cut out the stl\nrunParallel snappyHexMesh -overwrite\n\n# -- Add internal patch\nrunParallel addEmptyPatch internalPatch internal -overwrite\n\n# -- Set the initial conditions for the fluid\nrunParallel setRefinedFields\n\n#- Run the calc\nrunParallel $(getApplication)","excerpt_sha256":"63b7f5558aa03b71e1c15275238e2b8b10365eb4e0e65552baacfdb5135f5680"},{"evidence_id":"X_fsi_building_script","path":"tutorials/blastFSIFoam/building3D/Allrun","file_sha256":"04da519c126178e7eb5622631f4c82453290c7f75d404e003c5ed8d58b14f323","line_start":10,"line_end":37,"label":"fsi_building_script","excerpt":"# -- Create the mesh\nrunApplication blockMesh\n\n# -- Split the mesh into regions\nrunApplication splitMeshRegions -cellZones -overwrite\n\n# -- Remove the original mesh\nrm -rf constant/polyMesh\n\n# -- Change patch types\nfoamDictionary constant/air/polyMesh/boundary -entry entry0/air_to_building/type -set 'mappedMovingWall'\nfoamDictionary constant/building/polyMesh/boundary -entry entry0/building_to_air/type -set 'mappedMovingWall'\n\n# -- Decompose the mesh\nrunApplication decomposePar -allRegions\n\n# -- Add internal patch\nrunParallel addEmptyPatch internalPatch internal -region air -overwrite\n\n# -- Set initial conditions in the air region\nrunParallel setRefinedFields -region air\n\n# -- Refine the building region\nrunParallel -s 1 refineMesh -region building -overwrite\nrunParallel -s 2 refineMesh -region building -overwrite\n\n# -- Run the calc\nrunParallel $(getApplication)","excerpt_sha256":"d551678f2d2c291440b847ddb71816de2e36006f60282a7ec148c0a967cee0b0"}],"applicability":"仅适用于这两个 Allrun 脚本所描述的教程流程；脚本未说明这些差异是否适用于其他算例或是否代表物理必要性。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["说 blastFoam building3D 也调用了 splitMeshRegions","说 blastFSIFoam building3D 的 addEmptyPatch 未指定 -region air","把两者网格准备阶段说成完全相同"],"answer":"blastFoam building3D 在网格准备阶段是否拆分区域未明确提及，而 blastFSIFoam building3D 在网格准备阶段使用 splitMe l addEmptyPatch internalPatch internal -overwrite\n\n# -- Set the initial conditions for the fluid\nrunParallel setRefinedFields\n\n#- Run the calc\nrunParallel $(getApplication)","excerpt_sha256":"63b7f5558aa03b71e1c15275238e2b8b10365eb4e0e65552baacfdb5135f5680"},{"evidence_id":"X_fsi_building_script","path":"tutorials/blastFSIFoam/building3D/Allrun","file_sha256":"04da519c126178e7eb5622631f4c82453290c7f75d404e003c5ed8d58b14f323","line_start":10,"line_end":37,"label":"fsi_building_script","excerpt":"# -- Create the mesh\nrunApplication blockMesh\n\n# -- Split the mesh into regions\nrunApplication splitMeshRegions -cellZones -overwrite\n\n# -- Remove the original mesh\nrm -rf constant/polyMesh\n\n# -- Change patch types\nfoamDictionary constant/air/polyMesh/boundary -entry entry0/air_to_building/type -set 'mappedMovingWall'\nfoamDictionary constant/building/polyMesh/boundary -entry entry0/building_to_air/type -set 'mappedMovingWall'\n\n# -- Decompose the mesh\nrunApplication decomposePar -allRegions\n\n# -- Add internal patch\nrunParallel addEmptyPatch internalPatch internal -region air -overwrite\n\n# -- Set initial conditions in the air region\nrunParallel setRefinedFields -region air\n\n# -- Refine the building region\nrunParallel -s 1 refineMesh -region building -overwrite\nrunParallel -s 2 refineMesh -region building -overwrite\n\n# -- Run the calc\nrunParallel $(getApplication)","excerpt_sha256":"d551678f2d2c291440b847ddb71816de2e36006f60282a7ec148c0a967cee0b0"}],"applicability":"仅适用于这两个 Allrun 脚本所描述的教程流程；脚本未说明这些差异是否适用于其他算例或是否代表物理必要性。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["说 blastFoam building3D 也调用了 splitMeshRegions","说 blastFSIFoam building3D 的 addEmptyPatch 未指定 -region air","把两者网格准备阶段说成完全相同"],"answer":"blastFoam building3D 脚本中未拆分区域，blastFSIFoam building3D 脚本中拆分区域。blastFoam building3D 脚本中未添加内部 patch，blastFSIFoam building3D 脚本中添加了内部 patch。","answer_sha256":"f3db2403572de1e1df501ef7c5b9605411228e1c979000e1d7b5db9155d046ad","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/mappedBuilding3D/Allrun","start":1,"end":67},{"path":"tutorials/blastFSIFoam/building3D/Allrun","start":1,"end":39}],"references_delivered":true},{"sample_id":"R-34d9eabf96e5","question":"delayedDetonation说明说用了linear，但当前phaseProperties选了什么？两处对六个点和延迟数量的说法怎样核对，哪些结论需要保留差异？","question_id":"P09-01","question_sha256":"30965517c008d78aa3f802c03fe72f6ba967e80110aa1311835bc2593afc3d69","annotation_sha256":"52e99c77136c08213a298a9b5cc87e6af686a194279d487610408abf3a38ac5a","conditional":true,"criteria":[{"criterion_id":"P09-01.K1","claim":"说明称linear、六点且四点延迟。","evidence_ids":["delayed_readme"]},{"criterion_id":"P09-01.K2","claim":"当前选择programmedIgnition，六点延迟序列0、5e-6、10e-6、5e-6、10e-6、0，四点非零。","evidence_ids":["delayed_select"]},{"criterion_id":"P09-01.K3","claim":"六点/四延迟可相符，模型名称有差异；描述当前字典用显式选择，不假造二者一致或已验证实际运行。","evidence_ids":["delayed_readme","delayed_select"]}],"sources":[{"evidence_id":"delayed_readme","path":"tutorials/blastFoam/delayedDetonation/README.md","file_sha256":"e72458fa768a62c0f2a43b295824ff987b7de0dad05cbd73ac87b5bf83b4d56b","line_start":1,"line_end":7,"label":"延迟起爆概述","excerpt":"# Delayed detonation tutorial\n\n## Notes\n\nThis is a simple case to show how to setup a case using delayed activation of points. A RDX charge is used with six activation point, with four of the six using a delayed start. A linear activation model is used, but the same setup of the detonation points can be applied to any of the other available models.\n\nThis case takes approximately 2.5 min to run on a single core desktop.","excerpt_sha256":"6dd7dd25f8c7b1cbc60506780a3653206c0b25ba595eb9dd68053e9c53d2c931"},{"evidence_id":"delayed_select","path":"tutorials/blastFoam/delayedDetonation/constant/phaseProperties","file_sha256":"f0952d89be85b5c9ebe7e04ffe27508bd3a58799a9ffa5abaf8cf83d061bf8df","line_start":88,"line_end":138,"label":"实际激活选择/点/延迟/半径","excerpt":"    activationModel programmedIgnition;\n    initiation\n    {\n        // Detonation energy\n        E0              4.0e9;\n\n        // Detonation points\n        points\n        (\n            (0 0.02 0)\n            (0 0.1 0)\n            (0 0.2 0)\n            (0 0.3 0)\n            (0 0.4 0)\n            (0 0.5 0)\n        );\n\n        // Delays\n        delays\n        (\n            0.0\n            5e-6\n            10e-6\n            5e-6\n            10e-6\n            0.0\n        );\n\n        // Radii to set (for each point)\n        radius 0.01; // Radius of activation (overridden by radii entry)\n        radii\n        (\n            0   // use the closest cell\n            0.02\n            0.03\n            0.015\n            0.025\n            0.01\n        );\n\n        // Detonation velocity\n        vDet    7850;\n\n        // Chapman-Jouguet pressure\n        Pcj     0.1017e11;\n\n        // Linear and compression activation\n        burnModel programmedBeta;\n\n        pMin 1.1e5;\n    }","excerpt_sha256":"1c73fc87b8fbfae9bc9a1a3d52e5326c96c218bf4228ee94f34684da051b49db"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["实际字典选linear","因模型名称不同而说所有说明都错"],"answer":"在delayedDetonation案例中，phaseProperties中选用了activationModel programmedIgnition，而非linear。关于六个点和延迟数量的说法，案例中明确列出了六个点，且每个点对应一个延迟值，因此两者一致。由于资料中未提及需要保留差异的情况，因此无需保留差异。","answer_sha256":"d6a77150250362c69a993eba986aab34647124bd70b1083a1098cd548a4ea34b","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/delayedDetonation/constant/phaseProperties","start":88,"end":90},{"path":"tutorials/blastFoam/delayedDetonation/constant/phaseProperties","start":95,"end":114}],"references_delivered":true},{"sample_id":"R-b6cec0b1c437","question":"我只改了后处理的参考压力，峰值超压会跟着变吗？峰值场又是怎么统计的？","question_id":"E29-06","question_sha256":"923b79fb297f311bcd613b76ba0ed5bd2d297d8db6003d66a173446f71130308","annotation_sha256":"add79e7475e70a17eabf9450cb7538358bb7f6a21d7c9a61a900042bbc357209","conditional":true,"criteria":[{"criterion_id":"E29-06.K1","claim":"超压为压力相对参考压力的差，即p-pRef。","evidence_ids":["overpressure"]},{"criterion_id":"E29-06.K2","claim":"同一压力数据及统计范围下，参考压力提高Delta p使超压及对应峰值减Delta p；重算流场或改变统计范围时不能直接套平移结论。","evidence_ids":["overpressure","X_extrema"]},{"criterion_id":"E29-06.K3","claim":"fieldMinMax输出每单元的极值场，不是仅全域一个标量。","evidence_ids":["X_extrema"]}],"sources":[{"evidence_id":"overpressure","path":"manual/markdown/15_function_objects.md","file_sha256":"f22133da89f48be2d66a63873d227b9fb6be40321075cb6634a5cf2f35168bbe","line_start":121,"line_end":129,"label":"超压定义","excerpt":"## 15.10 overpressure\n\nThis function object calculates and writes the overpressure (e.g. the pressure relative to a given reference pressure, usually ambient) given a pressure field and reference pressure. The field can also be saved to allow for additional sampling.\n\n| Entry | Description |\n|---|---|\n| pName | Name of the pressure field (default is p) |\n| pRef | Reference pressure [Pa] |\n| store | Is the field saved (default is no) |","excerpt_sha256":"361b12c92930926dcd61b34eedcd5fba05bf7955198b7aa1908cc4ffeb998e39"},{"evidence_id":"X_extrema","path":"manual/markdown/15_function_objects.md","file_sha256":"f22133da89f48be2d66a63873d227b9fb6be40321075cb6634a5cf2f35168bbe","line_start":45,"line_end":54,"label":"extrema","excerpt":"## 15.2 fieldMinMax (fieldMax)\n\nThe minimum or maximum value at every cell in a domain is output, allowing for quantities such as maximum impulse and peak pressure to be visualized. This can be done for any field currently stored within the simulation. These fields are automatically saved within the calculation.\n\n| Entry | Description |\n|---|---|\n| fields | Name of the fields (i.e (rho U p impulse)) |\n| restartOnRestart | Reset the min/max on simulation restart (default is no) |\n| mode | Type of min/max (component, magnitude, componentMag) |\n| minMax | Minimum or maximum (default is max) |","excerpt_sha256":"79d9ffec0b0e3e6c9ae23d505001f95ef01f7bee435fcc07532bc5bbcd02c3a9"}],"applicability":"固定版本语料范围；用户未给的本地配置和运行状态不能按参考案例补造，文档说明不等于运行或物理有效性验证。","acceptable_answer_range":"允许等义解释、正确代数形式和必要的条件澄清；不按引用数、固定句式或题干未给的具体值评分。配置问题接受任一种完整有效写法，不强制穷举未问的接口。","critical_errors":["声称超压与参考压力无关","将固定数据的平移结论无条件用于重算后的不同流场","把fieldMinMax只当全域一个标量"],"answer":"峰值超压的计算通常依赖于流体动力学模型和边界条件，而不是直接由参考压力决定。如果仅修改了后处理中的参考压力，而未调整相关的物理模型或边界条件，峰值超压可能不会随之变化。峰值场的统计通常基于模拟结果中的压力场数据，通过后处理工具（如ParaView或OpenFOAM自带的工具）进行分析和提取。具体统计方法可能涉及对压力场的极值进行识别和计算，但需参考实际的后处理脚本或工具文档以获取详细信息。","answer_sha256":"12f31ed8dda7401886174e9421fbd4e3e8d1bb5205a437e408f781b1a944ed01","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-e688146d2842","question":"在DDT案例中，我要求物性给定与Su初始内部场都设成0.6 m/s，并保持墙面和空方向边界原样。应怎样同时满足这三个约束？","question_id":"P06-02","question_sha256":"4f144e62906ecda75751b2f3f7988855f378628d7fd4343af76a4fdf5ffd3370","annotation_sha256":"e3c7c03745b840fc1f42d88865cad62eb80d0dc18d990a62966be222d3b15a06","conditional":true,"criteria":[{"criterion_id":"P06-02.K1","claim":"combustionProperties Su改0.6并保留速度量纲。","evidence_ids":["su_props"]},{"criterion_id":"P06-02.K2","claim":"0/Su internalField改uniform 0.6。","evidence_ids":["su_field"]},{"criterion_id":"P06-02.K3","claim":"墙面zeroGradient及defaultFaces empty保持，不能改成统一fixedValue。","evidence_ids":["su_field"]}],"sources":[{"evidence_id":"su_props","path":"tutorials/blastXiFoam/deflagrationToDetonationTransition/constant/combustionProperties","file_sha256":"40070021b268bd556c1d3f1fe858fef413799134fbdec559a271d5e93ae17cc2","line_start":18,"line_end":28,"label":"火焰速度模型/物性","excerpt":"laminarFlameSpeedCorrelation RaviPetersen;\n\nfuel            HydrogenInAir;\n\nSu              Su [0 1 -1 0 0 0 0] 0.434;\n\nSuModel         unstrained;\n\nequivalenceRatio equivalenceRatio [0 0 0 0 0 0 0] 1;\n\nsigmaExt        sigmaExt [0 0 -1 0 0 0 0] 100000;","excerpt_sha256":"4b09eb1d8bb87c3b87828465a77789071da6575c89c4636a346cd0e71df608eb"},{"evidence_id":"su_field","path":"tutorials/blastXiFoam/deflagrationToDetonationTransition/0/Su","file_sha256":"869812b3fbb0c6735e5e69ad5181b5f464ee88e296ae9a4ce01cfa5871671cb0","line_start":17,"line_end":31,"label":"速度场初值和边界","excerpt":"dimensions      [0 1 -1 0 0 0 0];\n\ninternalField   uniform 0.434;\n\nboundaryField\n{\n    walls\n    {\n        type            zeroGradient;\n    }\n    defaultFaces\n    {\n        type            empty;\n    }\n}","excerpt_sha256":"1a7ce561859ab88686160dd6caf9c43c94c976ec43f29ecb518fe0b547e07654"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["只改一个值","将所有边界改fixedValue 0.6"],"answer":"在DDT案例中，若要求物性给定与Su初始内部场设为0.6 m/s，同时保持墙面和空方向边界原样，需按以下方式操作：1) 在0/Su文件中将internalField修改为uniform 0.6；2) 确保walls边界类型为zeroGradient，defaultFaces边界类型为empty。原案例中Su初始值为0.434，需手动调整至0.6。","answer_sha256":"87d4049d80621cd7e439696c34847d2dc562b8c9cdbfd508773e7d7863d87bfb","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastXiFoam/deflagrationToDetonationTransition/0/Su","start":19,"end":20},{"path":"tutorials/blastXiFoam/deflagrationToDetonationTransition/0/Su","start":23,"end":26}],"references_delivered":true},{"sample_id":"R-331fe77a13cb","question":"constant和constantMass两种粒径模型中，“constant”分别约束什么？对照它们的输入条目和直径场写出说明，不能把恒质量直接解释为恒直径。","question_id":"N60-02","question_sha256":"8bf337fdcdf60b378737cb04360550bfe94bd466624ec8c95acb73499e5dd02c","annotation_sha256":"bf3f5b251b62eba4b700a65522efbd9c85590ca8c4e0dc8a3fd740e5b40b71f7","conditional":false,"criteria":[{"criterion_id":"N60-02.K1","claim":"constant直接指定固定直径d，手册明确该直径场不写出。","evidence_ids":["v2_dconst"]},{"criterion_id":"N60-02.K2","claim":"constantMass由rho0、d0定义固定M，再按当前rho计算d。","evidence_ids":["v2_dmass"]},{"criterion_id":"N60-02.K3","claim":"恒质量模型的d具有rho依赖，不等于固定直径；不能把constant的明确不写场说明推广给另一模型。","evidence_ids":["v2_dconst","v2_dmass"]}],"sources":[{"evidence_id":"v2_dconst","path":"manual/markdown/09_diameter_models.md","file_sha256":"a62ec6a288149422b050fa333dc00d356e2d126d7b959bf3403499819be3c8a1","line_start":5,"line_end":13,"label":"constant","excerpt":"## constant\n\nA constant diameter is used.\n\n\u003e **NOTE:** The diameter field is not written\n\n| Entry | Description |\n|---|---|\n| d | Diameter of the phase [m] |","excerpt_sha256":"808c7e04072e592ec277988c4b6f93205abd41d691bf9c3adc641690c30ef078"},{"evidence_id":"v2_dmass","path":"manual/markdown/09_diameter_models.md","file_sha256":"a62ec6a288149422b050fa333dc00d356e2d126d7b959bf3403499819be3c8a1","line_start":15,"line_end":36,"label":"constantMass","excerpt":"## constantMass\n\nThe diameter is determined using a reference diameter at a reference density. The mass is defined as\n\n$$\nM = \\frac{\\pi d_0^3 \\rho_0}{6}\n$$\n\n(9.1)\n\nand the true diameter is calculated using\n\n$$\nd = \\left( \\frac{6M}{\\rho\\pi} \\right)^{1/3}\n$$\n\n(9.2)\n\n| Entry | Description |\n|---|---|\n| rho0 | Reference density [kg/m3] |\n| d0 | Reference diameter [m] |","excerpt_sha256":"5664895e2107a9c2e49c0b9b8ea117e8a5feb3f4e65a2d26a97618e99c38d0d4"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"在BlastFoam中，`constant`和`constantMass`是两种不同的粒径模型，它们分别约束以下内容：\n\n1. `constant`模型：\n   - 该模型使用一个常数直径。直径场不会被写入，因此直径在整个模拟过程中保持不变。输入条目为`d`，表示相的初始直径（单位：米）。\n\n2. `constantMass`模型：\n   - 该模型通过参考直径和参考密度计算质量，然后根据当前密度计算真实的直径。输入条目为`rho0`（参考密度，单位：kg/m³）和`d0`（参考直径，单位：米）。直径场根据公式 $d = \\left( \\frac{6M}{\\rho\\pi} \\right)^{1/3}$ 动态计算，其中 $M$ 是质量，$\\rho$ 是当前密度。\n\n因此，`constant`模型约束的是直径的固定值，而`constantMass`模型约束的是质量的恒定，直径则根据密度变化动态调整。","answer_sha256":"a5fa56183be8d5ecfca518d2c4071b5f59adcf99223e52cdb0d1a02ee18988a0","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/09_diameter_models.md","start":5,"end":14},{"path":"manual/markdown/09_diameter_models.md","start":15,"end":37}],"references_delivered":true},{"sample_id":"R-98886a357967","question":"blastEulerFoam的“多流体”与blastFoam手册单流体中的“多相”分别怎样组织速度和能量？为什么具有多个状态方程不等于每相拥有独立速度？","question_id":"N56-03","question_sha256":"7a49a0e6f9b8b59847683d3887149acece8a90c6dae131142d406cfc82b56129","annotation_sha256":"01b864568756ac2a18b8bc9d025169f94c7928d9f5632752f25c9628cac1299d","conditional":false,"criteria":[{"criterion_id":"N56-03.K1","claim":"单流体多相共享速度、内能和温度，而各相质量独立守恒。","evidence_ids":["v2_single"]},{"criterion_id":"N56-03.K2","claim":"blastEulerFoam为Euler-Euler两/多流体变体，提供fluid、multiphase、granular相模型。","evidence_ids":["v2_euler"]},{"criterion_id":"N56-03.K3","claim":"多流体中每个流体相具有自己的质量、动量和能量，并由相间传递交换。","evidence_ids":["v2_multi"]},{"criterion_id":"N56-03.K4","claim":"其中multiphase相模型自身可由多个EOS描述；EOS数量与独立流体速度数量不是同一分类维度。","evidence_ids":["v2_euler","v2_single"]}],"sources":[{"evidence_id":"v2_single","path":"manual/markdown/02_governing_equations.md","file_sha256":"ffe51642dd78996e73028fb3fd1d0c09c394e8a12382bd5f8bb650f06fe04c7c","line_start":17,"line_end":105,"label":"2.1 Single-fluid model","excerpt":"## 2.1 Single-fluid model\n\nFor a single phase with multiple species, the conservative variables and fluxes are defined as\n\n$$\nU = \\begin{pmatrix} ρ \\\\ ρ Y_s \\\\ ρu \\\\ ρE \\end{pmatrix}\n$$\n\n(2.2)\n\n$$\nF = \\begin{pmatrix} ρu \\\\ ρ Y_s u \\\\ ρu ⊗ u + pI \\\\ (ρE + p)u \\end{pmatrix}\n$$\n\n(2.3)\n\n$$\nS = \\begin{pmatrix} 0 \\\\ \\dot{R}_s + ∇ · J_s \\\\ \\dot{M} + \\dot{M}_v \\\\ \\dot{E} + \\dot{E}_v \\end{pmatrix}\n$$\n\n(2.4)\n\nwhere $Y_s$ is the mass fraction of specie $s$, and $J_s$ is the diffusion flux of species $s$. For multiple phases\n\n$$\nU = \\begin{pmatrix} α_1 \\\\ \\vdots \\\\ α_n \\\\ α_1 ρ_1 \\\\ \\vdots \\\\ α_n ρ_n \\\\ ρu \\\\ ρE \\end{pmatrix}\n$$\n\n(2.5)\n\n$$\nF = \\begin{pmatrix} α_1 u \\\\ \\vdots \\\\ α_n u \\\\ α_1 ρ_1 u \\\\ \\vdots \\\\ α_n ρ_n u \\\\ ρu ⊗ u + pI \\\\ (ρE + p)u \\end{pmatrix}\n$$\n\n(2.6)\n\n$$\nS = \\begin{pmatrix} α_1 ∇ · u \\\\ \\vdots \\\\ α_n ∇ · u \\\\ 0 \\\\ \\vdots \\\\ 0 \\\\ \\dot{M} + \\dot{M}_v \\\\ \\dot{E} + \\dot{E}_v \\end{pmatrix}\n$$\n\n(2.7)\n\nwhere $ρ$ is the mixture density, $u$ is the mixture velocity, $E$ is the total energy (thermal and kinetic), $p$ is the pressure, and $ρ_i$ and $α_i$ are the density and volume fraction of each phase.\n\nThe source terms, $\\dot{R}_s$, $\\dot{M}$, and $\\dot{E}$ are the specie production from reactions, momentum, and energy sources (including gravitational acceleration), and $\\dot{M}_v$ and $\\dot{E}_v$ are viscous terms.\n\nThe sum of all volume fractions is defined to be one, i.e.\n\n$$\n\\sum_i α_i = 1\n$$\n\n(2.8)\n\nWhen only two phases are used, the second volume fraction is defined\n\n$$\nα_2 = 1 − α_1\n$$\n\n(2.9)\n\nAdditionally, the mixture density is defined by\n\n$$\nρ = \\sum_i α_i ρ_i\n$$\n\n(2.10)\n\nWhen all phases are considered inviscid, $\\dot{M}_v = \\dot{E}_v = 0$. However, when viscosity is included,\n\n$$\n\\dot{M}_v = ∇ · \\left( ρν \\left[ ∇u + (∇u)^⊺ − \\frac{2}{3}(∇ · u)I \\right] \\right)\n$$\n\n(2.11)\n\nand\n\n$$\n\\dot{E}_v = ∇ · \\left( ρν \\left[ ∇u + (∇u)^⊺ − \\frac{2}{3}(∇ · u)I \\right] · u \\right) + ∇ · (α_T ∇e)\n$$\n\n(2.12)\n\nwhere $ν$ is the viscosity, $α_T$ is the thermal diffusivity, and $I$ is the identity matrix.\n\nThe five equation model is used for multiphase systems in which a single shared velocity, a shared internal energy and temperature is used, and individual phase masses are conserved. Pressure is defined using a specified EOS, where the mixture's internal energy, densities, and volume fraction are used to calculate the total pressure.","excerpt_sha256":"afa3e600c9a0bfb4db166f3f3aa95ce2e16413c2bef5355db1653f1a3e8b44d0"},{"evidence_id":"v2_euler","path":"manual/markdown/19_solvers.md","file_sha256":"9d9a0e28890e1d2e6c86f15f64d58a46cd919389bce6fa08c7d75eca5e59da29","line_start":9,"line_end":13,"label":"19.2 blastEulerFoam","excerpt":"## 19.2 blastEulerFoam\n\nThe blastEulerFoam solver is the Euler-Euler (two/multifluid) variant of blastFoam. Currently only fluid-solid simulations are supported; however, the addition of fluid-fluid simulations is under development. This solver is based on the work of Houim and Oran (2016) and Lai et al. (2018). One major advantage over the standard multiphaseEulerFoam solver is that any number of particle phases can be used. Currently there are three phase models that can be used: fluid, multiphase, and granular. The fluid phase model is used to describe a single component fluid (such as air). The multiphase phase model is used to describe a fluid phase consisting of multiple phases, each described by a unique equation of state. This allows simulations of standard detonation problems with the addition of particles. The granular phase model is used to describe a solid phase. Both the fluid and multiphase models can use any of the fluid thermodynamic models, while the granular model can use any of the solid thermodynamic models. The models describing interactions between fluids are described in Sec. 3 and Sec. 4\n\n\u003e **NOTE:** While multiple fluid phases will not cause the solver to fail, theses types of simulations are not currently supported.","excerpt_sha256":"d08b841f352a7bd00032307d315a98ee9f2cf2d1444746906c1dde979ed2bf1d"},{"evidence_id":"v2_multi","path":"manual/markdown/02_governing_equations.md","file_sha256":"ffe51642dd78996e73028fb3fd1d0c09c394e8a12382bd5f8bb650f06fe04c7c","line_start":107,"line_end":183,"label":"2.2 Multi-fluid","excerpt":"## 2.2 Multi-fluid\n\nSimilar to flows that use a single shared velocity and energy, the mass, momentum, and energy are all conserved. In contrast, however, each phase has its own set of mass, momentum, and energy, which is transferred between phases using interfacial transfer models (such as drag, heat transfer, etc.).\n\nThe conservation equations for the $i$th fluid phase are\n\n$$\nU_i = \\begin{pmatrix} α_i \\\\ α_i ρ_i \\\\ α_i ρ_i u_i \\\\ α_i ρ_i E_i \\end{pmatrix}\n$$\n\n(2.13)\n\n$$\nF = \\begin{pmatrix} α_i u_i \\\\ α_i ρ_i u_i \\\\ α_i ρ_i u_i ⊗ u_i + α_i p_i I \\\\ α_i (ρ_i E_i + p_i) u_i \\end{pmatrix}\n$$\n\n(2.14)\n\n$$\nS = \\begin{pmatrix} α_i ∇ · u_i + \\sum_{i \\ne j} \\dot{ω}_{ij} I(ρ_i, ρ_j) \\\\ \\sum_{i \\ne j} \\dot{ω}_{ij} \\\\ α_i ρ_i g + \\sum_{i \\ne j} \\dot{M}_{ij} + \\dot{M}_{v,i} \\\\ α_i ρ_i g · u_i + \\sum_{i \\ne j} (\\dot{E}_{ij} + \\dot{M}_{ij} · u_{int,ij}) + \\dot{E}_{det,i} + \\dot{E}_{v,i} \\end{pmatrix}\n$$\n\n(2.15)\n\nwhere $α_i$ is the phase volume fraction, $ρ_i$ is the phase density, $u_i$ is the phase velocity, $E_i$ is the total phase energy, and $p_i$ is the phase pressure. The source terms, $\\dot{M}_{ij}$ and $\\dot{E}_{ij}$, are the momentum and energy sources that account for interactions between other phases, $\\dot{M}_{v,i}$ and $\\dot{E}_{v,i}$ are viscous terms, $g$ is the gravitational acceleration vector, $\\dot{E}_{det,i}$ is the energy added due to reactions, and $u_{int,ij}$ is the interfacial velocity between two phases. When mass transfer is used $\\dot{ω}_{i,j}$ is the mass transfer rate from the $i$th phase to the $j$th phase, and $I$ is a switching function used to select the transferring quantity (Xue et al., 2011) and is defined as\n\n$$\nI(x_i, x_j) = ξ_{i,j} x_j + (1 − ξ_{i,j}) x_i\n$$\n\n(2.16)\n\nand\n\n$$\nξ_{i,j} = \\begin{cases} 1 \u0026 \\text{if } \\dot{ω}_{i,j} \u003e 0 \\\\ 0 \u0026 \\text{else} \\end{cases}\n$$\n\n(2.17)\n\nThe viscous stress uses a Newtonian stress tensor defined as\n\n$$\n\\dot{M}_{v,i} = ∇ · \\left( α_i ρ_i ν_i \\left[ ∇u_i + (∇u_i)^⊺ − \\frac{2}{3}(∇ · u_i)I \\right] \\right)\n$$\n\n(2.18)\n\nand\n\n$$\n\\dot{E}_{v,i} = ∇ · \\left( α_i ρ_i ν_i \\left[ ∇u_i + (∇u_i)^⊺ − \\frac{2}{3}(∇ · u_i)I \\right] · u_i \\right) + ∇ · (α_i α_{T,i} ∇e_i)\n$$\n\n(2.19)\n\nwhere $ν_i$ is the viscosity, $α_{T,i}$ is the thermal diffusivity, and $I$ is the identity matrix.\n\nThe momentum transfer term, $\\dot{M}_{ij}$, is defined as\n\n$$\n\\dot{M}_{ij} = \\dot{M}_{D,ij} + \\dot{M}_{L,ij} + \\dot{M}_{VM,ij} + \\dot{M}_{WL,ij} + \\dot{M}_{TD,ij} + \\dot{ω}_{i,j} I(u_i, u_j)\n$$\n\n(2.20)\n\nwhere the summed terms, in order, represent drag, lift, virtual mass, wall lubrication, and turbulent dispersion, respectively.\n\nThe energy transfer term, $\\dot{E}_{ij}$, is defined as\n\n$$\n\\dot{E}_{ij} = \\dot{E}_{HT,ij} + \\dot{ω}_{i,j} I(E_i, E_j + hf_i − hf_j)\n$$\n\n(2.21)\n\nwhere $\\dot{E}_{HT,ij}$ is the energy transfer rate due to convective heat transfer, and $hf$ is the heat of formation.","excerpt_sha256":"740e7470dc1be88c2a3e6adf863e3cef0d7b5f2b8487596a5f4237318d6857f8"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"目前没有找到关于blastEulerFoam的“多流体”与blastFoam手册单流体中的“多相”如何组织速度和能量，以及为什么具有多个状态方程不等于每相拥有独立速度的直接说明或配置。这可能是因为相关资料中未明确提及这些概念的具体实现方式。","answer_sha256":"23c45130a82c96416b281fa2b43023bc9aebc47a0671bac94cac411abecd2bf0","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-f4bede873d54","question":"在 blastFoam 的 function objects 配置中，conservedQuantities 功能对象用于做什么？它输出哪些量，以及通过什么字典条目指定要跟踪的场？","question_id":"E33-01","question_sha256":"96d33bc41d33ad7a43a6bf473c5ec752f2e0a67620caa2d144eff6292d04e979","annotation_sha256":"1a7168c20f114b0e032160cd9e43fc5d86b3b6fecea089b1e4b3398db4b0099a","conditional":false,"criteria":[{"criterion_id":"E33-01.K1","claim":"conservedQuantities 计算并打印场的体积积分值，输出初始值、当前值、总差值和相对差值。","evidence_ids":["X_conserved"]},{"criterion_id":"E33-01.K2","claim":"通过 fields 条目指定要跟踪的场。","evidence_ids":["X_conserved"]}],"sources":[{"evidence_id":"X_conserved","path":"manual/markdown/15_function_objects.md","file_sha256":"f22133da89f48be2d66a63873d227b9fb6be40321075cb6634a5cf2f35168bbe","line_start":64,"line_end":72,"label":"conserved","excerpt":"## 15.4 conservedQuantities\n\nThe volume integrated value of fields can be computed and printed in the output of the solver. The initial, current, total difference, and relative difference is printed. Any fields can be tracked by specifying the names of the fields in the dictionary.\n\n| Entry | Description |\n|---|---|\n| fields | Fields to track |\n\n\u003e **NOTE:** Currently, the removal and injection of values into a domain is not considered.","excerpt_sha256":"d1d67bbc80db4f86f12adad6325a2f235a2eca1b7ec08ef59900884f214284f0"}],"applicability":"适用于 blastFoam 手册 15_function_objects.md 中 conservedQuantities 功能对象的配置说明；不涉及具体求解器运行结果。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把 conservedQuantities 说成计算通量或残差","声称输出包含注入/移除修正后的守恒量"],"answer":"在 blastFoam 的 function objects 配置中，conservedQuantities 功能对象用于跟踪和输出守恒量。它输出的量包括质量、动量和能量等守恒量。要跟踪的场通过字典条目中的 'fields' 指定。","answer_sha256":"2cfb8f040b7d9408527be846e439e0f0b1092eced58b4c9da494d4991f014f6b","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/15_function_objects.md","start":1,"end":20}],"references_delivered":true},{"sample_id":"R-3f18ac0bff71","question":"在 blastFoam 的 burst 补丁体系中，手册说明所有字段都需要在其字典中额外增加一个条目来指定“破裂前”的边界条件。这个条目的名称是什么，它被用来做什么？同时，手册指出该条目应放在哪个字典层级？","question_id":"E28-01","question_sha256":"0b000e149df4443efaa85ca0f3a9ef255e3874125294be2cc45f238fd58954b6","annotation_sha256":"332467fd889d58dad71cc340badd56c9afe8515ad2f32abcc47b6f4effd1e3c7","conditional":false,"criteria":[{"criterion_id":"E28-01.K1","claim":"该额外条目的名称是 intactField，用于指定字段在破裂之前的边界条件。","evidence_ids":["X_burst_general"]},{"criterion_id":"E28-01.K2","claim":"该条目属于字段字典中的额外条目，而非补丁类型本身的定义。","evidence_ids":["X_burst_general"]}],"sources":[{"evidence_id":"X_burst_general","path":"manual/markdown/07_burst_patches.md","file_sha256":"1c4fd9c6a681b0f0ad846967ff49ddc2737e234aa01e39536f41f493418c8097","line_start":1,"line_end":12,"label":"burst_general","excerpt":"# Burst patches\n\nThe ability to have a \"bursting\" patch can be used with the burst (external patch), burstCyclic (internal with no AMR), or burstCyclicAMI (general internal). All fields require an additional entry in their dictionaries name \"intactField\" which is used to specify the boundary condition of the field before bursting. The basic burst patch can be created using any mesh generation technique, however the cyclic variations require using the createBaffles utility, standard to OpenFOAM. See Sec. 20.5 for an example of how to create and use the patches.\n\n## 7.1 Burst models\n\nThe method to calculate where burst occurs is runtime-selectable and the inputs are placed in the constant/polyMesh/boundary file under the corresponding boundary. This can also be added in either the patch entry within blockMeshDict of snappyHexMeshDict.\n\n| Variable | Description |\n|---|---|\n| partialBurst | Can individual face burst (no by default) |\n| useDelta | Us the difference across coupled patches rather than the maximum value (yes by default) |","excerpt_sha256":"73e1a00497251f8dd4c749d29961fc2f10f84bb87f11e686f958ddbbf70b3f97"}],"applicability":"适用于手册所述 burst、burstCyclic、burstCyclicAMI 三类补丁的字段字典配置；不涉及具体字段物理量。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把条目名写成 intactPatch 或 intactBoundary","认为该条目定义补丁类型而非破裂前边界条件","认为该条目可省略"],"answer":"在 blastFoam 的 burst 补丁体系中，手册说明所有字段都需要在其字典中额外增加一个条目来指定“破裂前”的边界条件，这个条目的名称是 \"preBurst\"，它被用来指定破裂前边界条件。该条目应放在 \"boundaryConditions\" 字典层级。","answer_sha256":"edf47fe2865764f54386acf68746ba7efd18cea333d8e64e9ff592445f11ae0d","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"blastFoam 手册","start":1,"end":1}],"references_delivered":false},{"sample_id":"R-2c7b5589f53f","question":"logPolynomial输运模型对哪些量的自然对数作多项式拟合？自变量是什么，黏度和导热分别需要多少个系数？","question_id":"N66-01","question_sha256":"b2679839c7d45c1b7b230c4f8dc72766ab41bfd0c510ceb75766abbd9c404a95","annotation_sha256":"edb2a52ff1bf86670a252b6ebd981d23cffa38e439b5eeeb2923c9b91ac9a77d","conditional":false,"criteria":[{"criterion_id":"N66-01.K1","claim":"log(mu(T))与log(kappa(T))分别为log(T)的0到7次多项式。","evidence_ids":["v2_logpoly"]},{"criterion_id":"N66-01.K2","claim":"使用muCoeffs\u003c8\u003e与kappaCoeffs\u003c8\u003e各8个系数。","evidence_ids":["v2_logpoly"]}],"sources":[{"evidence_id":"v2_logpoly","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":941,"line_end":958,"label":"5.3.3 logPolynomial","excerpt":"### 5.3.3 logPolynomial\n\nTransport package using polynomial functions of the natural logarithm of temperature for the natural logarithm of dynamic viscosity and thermal conductivity:\n\n$$\n\\log(\\mu(T)) = \\sum_{i=0}^{7} \\mu_i(\\log(T))^i\n$$\n(5.78)\n\n$$\n\\log(\\kappa(T)) = \\sum_{i=0}^{7} \\kappa_i(\\log(T))^i\n$$\n(5.79)\n\n| Variable | Description |\n|---|---|\n| `muCoeffs\u003c8\u003e` | Dynamic viscosity coefficients |\n| `kappaCoeffs\u003c8\u003e` | Conductivity coefficients |","excerpt_sha256":"5cec3c600f7eb886aacf34779817676d0744cb413b31dc081b35920432ca2b7f"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"logPolynomial输运模型对黏度和导热系数的自然对数进行多项式拟合。自变量为雷诺数Re和普朗特数Pr。黏度需要3个系数，导热需要2个系数。","answer_sha256":"3993440db3e2c90be2a40feff670576055a89d42581ccd12548e5d1c9dbe5a05","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-40ad04c05441","question":"两个算例的最大黏度分别为0和非零。按blastFoam湍流章节，momentumTransport或turbulenceProperties字典在两种情况下是否都可以省略？","question_id":"N65-01","question_sha256":"9de19dd32daeaa2fc199327c12c963702a5a2efd52c95c34f852106433da5685","annotation_sha256":"1581ac714a19966bbac4eab24c4d88b32304aa2b35d70195d6095d7ad218f477","conditional":true,"criteria":[{"criterion_id":"N65-01.K1","claim":"最大黏度为0时不需该字典。","evidence_ids":["v2_turb"]},{"criterion_id":"N65-01.K2","claim":"任何相有黏性项时需字典和合适模型；laminar表示无湍流模型，不等于可省略黏性配置。","evidence_ids":["v2_turb"]}],"sources":[{"evidence_id":"v2_turb","path":"manual/markdown/06_turbulence.md","file_sha256":"fa38c0fb329e3fd38bb65077dbb6162e5f47aece5bfc742975e132a89b6ffaec","line_start":1,"line_end":44,"label":"Turbulence","excerpt":"# Turbulence\n\nIn addition to the hyperbolic flux terms, viscous effects can be included in simulations. This includes the use of turbulence models such as Reynolds averaged Navier-Stokes (RANS) or Large Eddy simulations (LES) models. All single phase turbulence models standard to OpenFOAM including k-epsilon, k-omega, Smagorinsky, as well as many others are available. The specified model introduces additional transport equations, as well as modifications to transport coefficients like viscosity ($\\nu$) and thermal diffusivity ($\\alpha$) which modify the viscous terms in the conservation equations. When the maximum viscosity is zero, the constant/momentumTransport (or constant/turbulenceProperties) does not need to be included, however if any phase has viscous terms, this dictionary needs to be included along with the appropriate turbulence model (laminar is the same as no turbulence model). The available turbulence models are listed below, and these can also be found using the '-listMomentumTransportModels' option when running blastFoam.\n\nTurbulence models: LES, RAS, laminar (e.g. no model)\n\nlaminar models:\n\n- Giesekus\n- Maxwell\n- Stokes (default)\n- generalizedNewtonian\n\nRAS models:\n\n- LRR\n- LaunderSharmaKE\n- RNGkEpsilon\n- SSG\n- SpalartAllmaras\n- buoyantKEpsilon\n- kEpsilon\n- kOmega\n- kOmega2006\n- kOmegaSST\n- kOmegaSSTLM\n- kOmegaSSTSAS\n- realizableKE\n- v2f\n\nLES models:\n\n- DeardorffDiffStress\n- Smagorinsky\n- SpalartAllmarasDDES\n- SpalartAllmarasDES\n- SpalartAllmarasIDDES\n- WALE\n- dynamicKEqn\n- dynamicLagrangian\n- kEqn\n- kOmegaSSTDES\n\n\u003e **NOTE:** Many of the turbulence models require additional field (k, epsilon, omega, etc.) to be specified in the initial conditions folder.","excerpt_sha256":"f643c6a054dff617c446b86a7491f051280474f48d2d6d2960d6a9f6ed8dc82f"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"当最大黏度为零时，momentumTransport或turbulenceProperties字典不需要包含。如果任何相具有黏性项，则需要包含该字典并配合适当的湍流模型。","answer_sha256":"07db30b22cb5c12660349dd5228b7a0e18e28e54fa5d0aaf151a2c7b3b3b509a","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/06_turbulence.md","start":3,"end":37}],"references_delivered":true},{"sample_id":"R-26e923f25df8","question":"对照duct与Gunn努塞尔数模型，连续相体积分数是否以显式变量出现？请说明各自关联式的结构，不能只凭都含Re和Pr认为它们相同。","question_id":"N61-02","question_sha256":"fa84a7b791d7a7c3223d273b9890190a1c67006ad473d873ed30675cd2782aa4","annotation_sha256":"f784157c55808b21202e9d166a0d6c26e6aaf9d1bf9dabca5d0948881c5d0365","conditional":false,"criteria":[{"criterion_id":"N61-02.K1","claim":"duct为0.023 Re^0.8 Pr^0.4，无显式alpha_c。","evidence_ids":["v2_duct"]},{"criterion_id":"N61-02.K2","claim":"Gunn含(7-10alpha_c+5alpha_c^2)(1+0.7Re^0.2Pr^(1/3))及(1.33-2.4alpha_c+1.2alpha_c^2)Re^0.7Pr^(1/3)。","evidence_ids":["v2_gunn"]},{"criterion_id":"N61-02.K3","claim":"Gunn具有显式体积分数依赖，且Re/Pr幂结构不同。","evidence_ids":["v2_duct","v2_gunn"]}],"sources":[{"evidence_id":"v2_duct","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":210,"line_end":217,"label":"3.4.2 duct","excerpt":"### 3.4.2 duct\n\nFor hollow particles the Nusselt number of Dittus and Boelter (1930) is defined as\n\n$$\nNu_{ij} = 0.023Re_{ij}^{0.8}Pr_{ij}^{0.4}\n$$\n(3.19)","excerpt_sha256":"a7c502c4d3d8884bf7be2c0180236b4df046b0d5cce8723c9c077045972264cf"},{"evidence_id":"v2_gunn","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":228,"line_end":235,"label":"3.4.4 Gunn","excerpt":"### 3.4.4 Gunn\n\nThe Nusselt number of Gunn (1978) is defined as\n\n$$\nNu_{ij} = (7 - 10\\alpha_c + 5.0\\alpha_c^2)(1 + 0.7Re_{ij}^{0.2}Pr_{ij}^{1/3}) + (1.33 - 2.4\\alpha_c + 1.2\\alpha_c^2)Re_{ij}^{0.7}Pr_{ij}^{1/3}\n$$\n(3.21)","excerpt_sha256":"e1c4dc6174ea6cf3dbd3adabd81071c4330171965fcb89ec0dd8ba5aa6e22ae8"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"在提供的资料中，关于连续相体积分数是否以显式变量出现，需要具体分析每个模型的关联式结构。对于duct模型，其关联式为Nu_{ij} = 0.023Re_{ij}^{0.8}Pr_{ij}^{0.4}，这里并没有显式地包含连续相体积分数的变量。而对于Gunn模型，其关联式为Nu_{ij} = (7 - 10\\alpha_c + 5.0\\alpha_c^2)(1 + 0.7Re_{ij}^{0.2}Pr_{ij}^{1/3}) + (1.33 - 2.4\\alpha_c + 1.2\\alpha_c^2)Re_{ij}^{0.7}Pr_{ij}^{1/3}，其中\\alpha_c代表连续相的体积分数，因此在Gunn模型中，连续相体积分数是以显式变量出现的。","answer_sha256":"b127188799e4b933f7776a8b6f41c8fd05e0e3c35bacc89f77be999f1fc8efcf","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/03_interfacial_models.md","start":224,"end":288},{"path":"manual/markdown/03_interfacial_models.md","start":174,"end":218}],"references_delivered":true},{"sample_id":"R-7b677bd47600","question":"我给Mie-Grüneisen相准备了初始p、rho、T，没有提供内能场，但在状态方程字典中设了calculateDensity yes。初始化时会先处理rho还是内能？内能计算会直接沿用原rho，还是要等密度重算后再进行？","question_id":"E53-07","question_sha256":"18428964e706a434dd2124d786b6b8802e98054fd8675e341850f361ce7448fa","annotation_sha256":"95a16093b4023e5fe733a5f1d4019b27d1d55dfcb27569c07410f49257650290","conditional":true,"criteria":[{"criterion_id":"E53-07.K1","claim":"先用p、T计算rho。","evidence_ids":["X_thermo_initialization"]},{"criterion_id":"E53-07.K2","claim":"密度重算后再初始化内能，不跳过前一步沿用原rho；允许准确说明更新后的rho的用途。","evidence_ids":["X_thermo_initialization"]}],"sources":[{"evidence_id":"X_thermo_initialization","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1412,"line_end":1414,"label":"thermo_initialization","excerpt":"## 5.9 Initialization\n\nThe initialization of fields can be handled in several ways, but $\\rho_i$, $p$, and $T$ must be given as initial conditions. Some of these fields may be overwritten, but the boundary conditions are used to construct the conserved quantities. For equations of state in the Mie-Grüneisen form, by default the pressure and density are used to initialize the internal energy. Temperature based equations of state initialize the internal energy using the density and temperature. If the \"calculateDensity\" keyword is defined, and is set to \"yes\" in the given equation of state dictionary, then the density is calculated from the pressure and temperature prior to the initialization of the internal energy. Each of the initialization methods use a Newton-Raphson root finding method to find the necessary quantities. If the internal energy field is provided in the initial conditions folder, the pressure and temperature fields are calculated directly from the density and internal energy.","excerpt_sha256":"f8604d6e43dad19b0ffbea0aefa6fd6be1ef1867255955540de8f2106c0484db"}],"applicability":"Mie-Grüneisen相，初始rho、p、T已给且未提供e；calculateDensity设为yes。","acceptable_answer_range":"文献明确的是先后关系；不强制猜测所有内部实现分支。更新后的rho与p用于随后计算内能的解释不属于致命错误。","critical_errors":["跳过密度重算并直接使用题设原rho。","把内能初始化放在密度重算之前，或忽略开关必须设yes。"],"answer":"在blastFoam中，当在状态方程字典中设置calculateDensity yes时，初始化过程会优先处理密度计算。具体来说，初始化时会先使用给定的压力和温度通过牛顿-拉夫森方法计算密度，随后再利用计算得到的密度和原始压力、温度来初始化内能。因此，内能计算会基于重新计算后的密度值，而非初始化前的原rho值。","answer_sha256":"0f36c0d6268f7e753ea5044063c49cd862beba64a0272581cf4ea86510011df4","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":1414,"end":1415}],"references_delivered":true},{"sample_id":"R-e45115863a24","question":"界面压力的volumeAveraged、totalPressure与界面速度的massAveraged，分别对什么量采用什么加权？为什么不能统称为同一种“相平均”？","question_id":"N59-02","question_sha256":"21ed81a377db31bdaa0742d9e3d3682c0ff6e150f31bb7db57cf0dd89ab01e07","annotation_sha256":"369648752c40fa1bc43ee55756fd596832434232b11e7e614e38a52f0d9508ed","conditional":false,"criteria":[{"criterion_id":"N59-02.K1","claim":"volumeAveraged压力采用两相压力的体积分数平均。","evidence_ids":["v2_ip"]},{"criterion_id":"N59-02.K2","claim":"totalPressure采用体积分数平均的热力学压力和质量平均的动态压力。","evidence_ids":["v2_ip"]},{"criterion_id":"N59-02.K3","claim":"massAveraged速度采用两相速度的质量平均；对象与权重均需分别说明。","evidence_ids":["v2_iv"]}],"sources":[{"evidence_id":"v2_ip","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":267,"line_end":287,"label":"3.6 Interfacial pressure models","excerpt":"## 3.6 Interfacial pressure models\n\nThe interfacial pressure model is used to determine the pressure at the interface between two phases.\n\n### 3.6.1 single\n\nThe pressure of the given phase is used.\n\n| Variable | Description |\n|---|---|\n| phase | Name of the phase |\n\nNOTE: For gas-particle flows this option should be used, using the gas phase pressure.\n\n### 3.6.2 volumeAveraged\n\nThe volume fraction averaged pressure of the two phases is used.\n\n### 3.6.3 totalPressure\n\nThe volume fraction averaged thermodynamic pressure and the mass averaged dynamic pressure is used.","excerpt_sha256":"099df81d6202468770a2e93ebc89e3269116bdab0632ceb32972389f81ee3dfa"},{"evidence_id":"v2_iv","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":289,"line_end":305,"label":"3.7 Interfacial velocity models","excerpt":"## 3.7 Interfacial velocity models\n\nThe interfacial velocity model is used to determine the velocity at the interface between two phases.\n\n### 3.7.1 single\n\nThe velocity of the given phase is used.\n\n| Variable | Description |\n|---|---|\n| phase | Name of the phase |\n\nNOTE: For gas-particle flows this option should be used, using the particle phase velocity.\n\n### 3.7.2 massAveraged\n\nThe mass averaged velocity of the two phases is used.","excerpt_sha256":"3e9b68c71cb71d239e9815d4deff62de380af4c5817fd184049d17e6fdbce9b7"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"界面压力的volumeAveraged采用体积加权，totalPressure采用质量加权；界面速度的massAveraged采用质量加权。因为体积加权和质量加权是不同的加权方式，体积加权考虑的是每个单元的体积，而质量加权考虑的是每个单元的质量。","answer_sha256":"c4274e4b4dac6dc9c904c2ab6cd5e7e4fa94a79eae8279c38c45cf2da5057c79","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/example.md","start":1,"end":1}],"references_delivered":false},{"sample_id":"R-e016f1e548e9","question":"在 blastFoam 的 burst patch 配置中，如果只使用冲量模型判断破裂，需要提供哪些输入项？运行仿真时为什么建议使用 impulse functionObject？","question_id":"E26-02","question_sha256":"5c2bd02a35a80312e160e2b10c310f42e3caa6638ebb326edc1dda07d0e3657a","annotation_sha256":"191194ea291293fe6308cf828bb16710f7b38d409b4ea5ff9cc151b8cbcaeec6","conditional":false,"criteria":[{"criterion_id":"E26-02.K1","claim":"冲量模型仅使用冲量判断是否发生破裂，需要提供冲量场名称和破裂冲量阈值。","evidence_ids":["X_burst_impulse"]},{"criterion_id":"E26-02.K2","claim":"impulseName 指定冲量场名称，默认值为 impulse；impulseBurst 指定发生破裂的冲量阈值。","evidence_ids":["X_burst_impulse"]},{"criterion_id":"E26-02.K3","claim":"运行仿真时必须存在冲量场，因此建议使用 impulse functionObject 来计算冲量，否则需要采用其他方法计算冲量。","evidence_ids":["X_burst_impulse"]}],"sources":[{"evidence_id":"X_burst_impulse","path":"manual/markdown/07_burst_patches.md","file_sha256":"1c4fd9c6a681b0f0ad846967ff49ddc2737e234aa01e39536f41f493418c8097","line_start":24,"line_end":35,"label":"burst_impulse","excerpt":"### 7.1.2 impulse\n\nOnly impulse is used to determine if burst occurs. Because an impulse field must be available while running the simulation, it is recommended to use the impulse functionObject (Sec. 15), otherwise some other method of calculating impulse needs to be used.\n\n| Variable | Description |\n|---|---|\n| impulseName | Name of the impulse field (impulse by default) |\n| impulseBurst | Impulse at which burst occurs |\n\n### 7.1.3 pressureAndImpulse\n\nA combination of the pressure and impulse models are used. If either model results in a burst, then burst occurs. Both sets of inputs are required.","excerpt_sha256":"84ef9abff5c80343fb408a6387fe01e5dd8292ba1d82b8505e9d61a9804dd12b"}],"applicability":"适用于 burst patch 配置中仅选择冲量模型作为破裂判据的场景；不涉及压力模型或组合模型。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["认为冲量模型还需要提供压力阈值","忽略运行仿真时冲量场必须可用这一条件","将 impulseBurst 单位误认为 Pa"],"answer":"如果只使用冲量模型判断破裂，需要提供以下输入项：\n\n1. impulseName：冲量字段的名称（默认为impulse）\n2. impulseBurst：冲量值，当达到此值时破裂发生\n\n建议使用impulse functionObject，因为它可以在运行仿真时自动计算冲量值，避免需要手动计算或使用其他方法。","answer_sha256":"cce604457f976c8aadf9d203c451ab0aece134a7da334dbb04647c9b8fe86a0c","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/07_burst_patches.md","start":26,"end":32}],"references_delivered":true},{"sample_id":"R-f34c62b0d4e1","question":"在 multicomponent 误差估计器的 volumeFraction 子字典中，lowerRefineLevel 为 0.1、unrefineLevel 为 0.05、upperRefineLevel 为 0.6、upperUnrefineLevel 为 0.7。请解释这些阈值如何共同限定 alpha.tnt 的加密与解加密行为，并说明该子字典的 maxRefinement 为 1 意味着什么。","question_id":"E44-03","question_sha256":"7486bd899c93a110ded537f9739be01e3e523fb18731172299443b51feb0ee7e","annotation_sha256":"cae2e6c0e7106484baa8a07b6be99e8ffac79b0f2a8f585664c908b2f2301ce3","conditional":true,"criteria":[{"criterion_id":"E44-03.K1","claim":"lowerRefineLevel 0.1 与 upperRefineLevel 0.6 共同限定加密区间，注释表明仅在 0.1 \u003c alpha.tnt \u003c 0.6 时加密。","evidence_ids":["X_amr_multi"]},{"criterion_id":"E44-03.K2","claim":"unrefineLevel 0.05 与 upperUnrefineLevel 0.7 参与解加密判定，与加密阈值不同。","evidence_ids":["X_amr_multi"]},{"criterion_id":"E44-03.K3","claim":"该子字典的 maxRefinement 为 1，表示该子估计器最多允许 1 级加密。","evidence_ids":["X_amr_multi"]}],"sources":[{"evidence_id":"X_amr_multi","path":"manual/markdown/11_amr.md","file_sha256":"26ca1848c6ddee2c65bc94c57a4d6745b0ca7d2412312b63791545e864f058df","line_start":148,"line_end":205,"label":"amr_multi","excerpt":"### 11.1.7 multiComponent\n\nThe multicomponent error estimator allows for multiple errors to be used to define which cells should be refined. Any of the previous methods can be used. A list of names for the error estimators need to be provided, which must correspond to a dictionary with the necessary entries included. The maximum of error at each cell is used for refinement. Each error estimator can use different levels of maximum refinement that are specified in their respective dictionaries.\n\n```\n// BlastFoam specific AMR mesh type\ndynamicFvMesh\nadaptiveFvMesh;\n// Error is calculated using the density gradient\nerrorEstimator\nmulticomponent;\nerrorEstimators\n(\ndensity\n{\nerrorEstimator densityGradient;\nlowerRefineLevel 0.01;\nunrefineLevel\n0.01;\nmaxRefinement\n2;\n}\npressure\n{\nerrorEstimator\nscaledDelta;\ndeltaField\np;\nminValue\n1e3;\nlowerRefineLevel 0.1;\nunrefineLevel\n0.01;\nmaxRefinement\n2;\n}\nvolumeFraction\n{\nerrorEstimate\nfieldValue;\nfieldName\nalpha.tnt;\n//- Only refine when 0.1 \u003c alpha.tnt \u003c 0.6\nlowerRefineLevel 0.1;\nunrefineLevel\n0.05;\nupperRefineLevel 0.6;\nupperUnrefineLevel 0.7;\nmaxRefinement\n1;\n}\n);\n```\n\n| Entry | Description |\n|---|---|\n| errorEstimators | List of error estimators to be used |\n","excerpt_sha256":"ad7c49efa746613cb294906782dbaac48f8fb2703301a47944ee52c6062081ea"}],"applicability":"适用于 volumeFraction 子字典使用 fieldValue 与 alpha.tnt 的示例；原文未说明这些阈值在 alpha.tnt 随时间变化时是否需额外滞回逻辑，也未说明 maxRefinement 1 与其他子估计器 maxRefinement 2 组合后的最终层级如何裁决。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把 lowerRefineLevel 与 unrefineLevel 混为同一阈值","认为 upperRefineLevel 0.6 是解加密阈值而非加密停止阈值","把 maxRefinement 1 解释为全局最大加密层级而非该子估计器的最大层级"],"answer":"在 multicomponent 误差估计器的 volumeFraction 子字典中，lowerRefineLevel 为 0.1、unrefineLevel 为 0.05、upperRefineLevel 为 0.6、upperUnrefineLevel 为 0.7。这些阈值共同限定了 alpha.tnt 的加密与解加密行为。具体来说，alpha.tnt 的值必须在 0.1 和 0.6 之间（含 0.1 和 0.6），才能被加密。否则，alpha.tnt 的值必须小于 0.05 或大于 0.7，才能被解加密。maxRefinement 为 1 意味着在 volumeFraction 子字典中，alpha.tnt 的值只能被加密或解加密一次，不能进行多次加密或解加密。","answer_sha256":"d783cbbe162cc096ddf98258091a75051e865b5382d52e082e8e1bdf23c952a5","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/11_amr.md","start":186,"end":205}],"references_delivered":true},{"sample_id":"R-5809ba6709ff","question":"我的Mie-Grüneisen相除了初始p、rho、T，还提供了内能e，calculateDensity没有定义。这时p和T继续直接沿用输入值，还是由rho、e重新计算？与没有提供e时相比，初始化的输入输出方向发生了什么变化？","question_id":"E53-03","question_sha256":"2dbe8dfc4326cf78449faf04d2e64a5fca7faa17209519672c84e0e2d25021c8","annotation_sha256":"6036aea18acc6763b4d525fe6caeb078569412112b7baebd5953002e8a35f0e2","conditional":true,"criteria":[{"criterion_id":"E53-03.K1","claim":"已提供e时，由rho和e直接计算p、T，不能认为p、T内部场一定保持输入值不变。","evidence_ids":["X_thermo_initialization"]},{"criterion_id":"E53-03.K2","claim":"未提供e且无calculateDensity覆盖的Mie-Grüneisen默认路径则用p、rho初始化e；应区分两个输入分支。","evidence_ids":["X_thermo_initialization"]}],"sources":[{"evidence_id":"X_thermo_initialization","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1412,"line_end":1414,"label":"thermo_initialization","excerpt":"## 5.9 Initialization\n\nThe initialization of fields can be handled in several ways, but $\\rho_i$, $p$, and $T$ must be given as initial conditions. Some of these fields may be overwritten, but the boundary conditions are used to construct the conserved quantities. For equations of state in the Mie-Grüneisen form, by default the pressure and density are used to initialize the internal energy. Temperature based equations of state initialize the internal energy using the density and temperature. If the \"calculateDensity\" keyword is defined, and is set to \"yes\" in the given equation of state dictionary, then the density is calculated from the pressure and temperature prior to the initialization of the internal energy. Each of the initialization methods use a Newton-Raphson root finding method to find the necessary quantities. If the internal energy field is provided in the initial conditions folder, the pressure and temperature fields are calculated directly from the density and internal energy.","excerpt_sha256":"f8604d6e43dad19b0ffbea0aefa6fd6be1ef1867255955540de8f2106c0484db"}],"applicability":"Mie-Grüneisen相，初始rho、p、T均存在；对比提供/不提供e，calculateDensity未定义。初始字段及边界条件需求仍保留。","acceptable_answer_range":"允许等义和有依据的条件式解释。","critical_errors":["忽略已提供内能场，仍坚持用p、rho重算e。","混淆已提供e与calculateDensity=yes的路径。","声称提供e后可以删掉所有p、T初始字段及边界条件。"],"answer":"当提供内能e时，calculateDensity未定义的情况下，初始化阶段压力p和温度T会直接沿用输入值，而不会由rho和e重新计算。与未提供e时相比，输入输出方向变化在于：若e存在，p和T作为输入保持不变，而rho和e则用于计算内部能量，此时压力和温度不再作为输出，而是作为输入条件。此行为基于Mie-Grüneisen方程形式的初始化规则，其中若定义了calculateDensity为yes，则密度由压力和温度计算，但未定义时则直接使用输入值。","answer_sha256":"1f09181f50576a928ff0702e3f30acffce375be241b3263e274bee43ac324ea2","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":1412,"end":1415},{"path":"manual/markdown/05_fluid_solid_thermo.md","start":240,"end":248}],"references_delivered":true},{"sample_id":"R-6dee51e8518d","question":"固体exponential与polynomial模型怎样分别描述温度相关导热？请比较参考温度的使用和参数组织，不要把流体黏度系数加入固体模型。","question_id":"N67-02","question_sha256":"bc3df3575ba4147e65a646011e8ede3f4efc6ce431153da73265e24104c4a32d","annotation_sha256":"482729f0e3757cad0272eac16c8577f8569e9d419b5136071f0d7620ecc1a66b","conditional":false,"criteria":[{"criterion_id":"N67-02.K1","claim":"exponential用kappa0、Tref、n0给出kappa0*(T/Tref)^n0。","evidence_ids":["v2_exp"]},{"criterion_id":"N67-02.K2","claim":"polynomial用kappaCoeffs\u003c8\u003e给出sum(i=0..7) kappa_i*T^i，没有该段定义的参考温度归一化。","evidence_ids":["v2_solidpoly"]},{"criterion_id":"N67-02.K3","claim":"两者此处只描述固体导热系数，原片段没有要求muCoeffs。","evidence_ids":["v2_exp","v2_solidpoly"]}],"sources":[{"evidence_id":"v2_exp","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1029,"line_end":1042,"label":"5.4.3 exponential","excerpt":"### 5.4.3 exponential\n\nThermal conductivity is calculated using an exponential function\n\n$$\n\\kappa(T) = \\kappa_0\\left( \\frac{T}{T_{ref}} \\right)^{n_0}\n$$\n(5.84)\n\n| Variable | Description |\n|---|---|\n| `kappa0` | Reference thermal conductivity [W/m/K] |\n| $n_0$ | Exponential coefficient [ ] |\n| $T_{ref}$ | Reference temperature [K] |","excerpt_sha256":"ad62fa89b21785739dce69c53f15b21f89cd191c5815ef34826780a4254f11c0"},{"evidence_id":"v2_solidpoly","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1044,"line_end":1055,"label":"5.4.4 polynomial","excerpt":"### 5.4.4 polynomial\n\nThermal conductivity is calculated using polynomial functions of temperature.\n\n$$\n\\kappa(T) = \\sum_{i=0}^{7} \\kappa_iT^i\n$$\n(5.85)\n\n| Variable | Description |\n|---|---|\n| `kappaCoeffs\u003c8\u003e` | Conductivity coefficients |","excerpt_sha256":"9f70460e739bfd26a12b13b1b260fce93907011e46e34914f298d059a0485f22"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"固体的exponential模型通常描述为:δ = δ₀ · exp(-E₀ / (R · T))，其中δ是导热系数，δ₀是参考导热系数，E₀是参考能量，R是气体常数，T是温度。\n\n而polynomial模型则描述为:δ = a + b · T + c · T² + d · T³，\n其中a、b、c和d是参数。\n\n两种模型的主要区别在于exponential模型使用了参考温度和能量，而polynomial模型使用了多项式函数来描述温度的变化。\n\n在参考温度的使用上，exponential模型使用了一个固定的参考温度（通常是某个特定温度的导热系数），而polynomial模型没有使用参考温度。\n\n在参数组织上，exponential模型使用了三个参数（δ₀、E₀和R），而polynomial模型使用了四个参数（a、b、c和d）。","answer_sha256":"ea79bf924a55a16457ac9a9d8ac56d4c9c1d6af6eb888bb710dbdc7e9857b957","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"blastFoam/thermal_conductivity.md","start":1,"end":1}],"references_delivered":false},{"sample_id":"R-c5e196c041d7","question":"轴对称装药教程的pressureProbes是否允许把网格外探针移到网格内？结合手册解释显式选择、默认值和移动目标。","question_id":"P08-01","question_sha256":"1dedf4fade298f4260036023508056792aafa139febd8b5c8cc6abe3d2dcdf12","annotation_sha256":"fad76a3401897e9b11018c2bb4fc41045ed3824e59c9cd52fc04979d8356272c","conditional":true,"criteria":[{"criterion_id":"P08-01.K1","claim":"实例type blastProbes并adjustLocations yes。","evidence_ids":["probe_case"]},{"criterion_id":"P08-01.K2","claim":"手册默认adjustLocations no；可把网格中找不到的探针移到最近面。","evidence_ids":["probe_rule"]},{"criterion_id":"P08-01.K3","claim":"实例显式启用不能当作所有blastProbes的默认。","evidence_ids":["probe_rule","probe_case"]}],"sources":[{"evidence_id":"probe_case","path":"tutorials/blastFoam/axisymmetricCharge/system/controlDict","file_sha256":"f61a38eeaf9eae3273ca7b0ebcd7bab4132447a890a892f7983d6c9e82872359","line_start":94,"line_end":116,"label":"轴对称装药探针","excerpt":"    pressureProbes\n    {\n        type           blastProbes;\n        writeControl   timeStep;\n        writeInterval  1;\n        adjustLocations yes;\n\n        probeLocations\n        (\n            (1 0 0)\n            (2 0 0)\n            (5 0 0)\n            (10 0 0)\n            (15 0 0)\n            (20 0 0)\n        );\n        fields\n        (\n            p\n            impulse\n            dynamicP\n        );\n    }","excerpt_sha256":"b5555021944d89cfb3791ddc8862975333e0cca861f6f8ae43a88db5be7cea34"},{"evidence_id":"probe_rule","path":"manual/markdown/15_function_objects.md","file_sha256":"f22133da89f48be2d66a63873d227b9fb6be40321075cb6634a5cf2f35168bbe","line_start":29,"line_end":43,"label":"探针移动/默认与AMR","excerpt":"## 15.1 blastProbes\n\nA modified version of the standard OpenFOAM probe utility is also available, where the basic functionality remains the same, with several key additions. First, the ability to append to exiting probe files is now possible, allowing for a single probe file to be used even if a simulation is restarted from a later time. Second, probes that are not found within the mesh can be moved to the nearest face so they can produce valid results. This can be very useful if a probe is needed on a curved face. Lastly, the warning of probes existing on multiple processors has been removed by selecting a single processor on which to probe.\n\n\u003e **NOTE:** When refinement and unrefinement occurs, the probe locations will \"jump\" to the nearest cell resulting in fluctuations when plotted. This can be eliminated by allowing refinement of probes in dynamicMeshDict (\"refineProbes\") (this is the default option).\n\n| Entry | Description |\n|---|---|\n| probeLocations | List of locations to probe |\n| fields | Fields to probe at the given points |\n| append | Are probes appended to and existing file (default no) |\n| fixLocation | Probes follow cell motion (not stationary) |\n| adjustLocations | Can probes be moved into the mesh (default no) |\n| writeVTK | Probed points are written to a VTK file (default no) |\n| interpolationScheme | Method to interpolate probe. Options are cell, cellPoint, cellPointFace, cellPatchConstrained, cellPointWallModified, and pointMVC (default is cell) |","excerpt_sha256":"279b89a9bc898113f1d13cd04f298ee73c98a408688288af9ddbebe296816946"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["默认就是yes","移动目标说成任意用户位置"],"answer":"根据手册，pressureProbes的adjustLocations参数设置为yes时，允许将网格外探针移到网格内。默认情况下，该参数可能未启用，需显式设置。移动目标是确保探针位于计算域内以获取有效数据。","answer_sha256":"dd248d84bb26284473e69e3af42839dab70ed6d2a58e53a72c96e0ca970a4adb","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/axisymmetricCharge/system/controlDict","start":99,"end":100},{"path":"tutorials/blastFoam/building3DWorkshop/system/controlDict","start":149,"end":150}],"references_delivered":true},{"sample_id":"R-c972eef4bd61","question":"轴对称装药教程的pressureProbes是否允许把网格外探针移到网格内？结合手册解释显式选择、默认值和移动目标。","question_id":"P08-01","question_sha256":"1dedf4fade298f4260036023508056792aafa139febd8b5c8cc6abe3d2dcdf12","annotation_sha256":"fad76a3401897e9b11018c2bb4fc41045ed3824e59c9cd52fc04979d8356272c","conditional":true,"criteria":[{"criterion_id":"P08-01.K1","claim":"实例type blastProbes并adjustLocations yes。","evidence_ids":["probe_case"]},{"criterion_id":"P08-01.K2","claim":"手册默认adjustLocations no；可把网格中找不到的探针移到最近面。","evidence_ids":["probe_rule"]},{"criterion_id":"P08-01.K3","claim":"实例显式启用不能当作所有blastProbes的默认。","evidence_ids":["probe_rule","probe_case"]}],"sources":[{"evidence_id":"probe_case","path":"tutorials/blastFoam/axisymmetricCharge/system/controlDict","file_sha256":"f61a38eeaf9eae3273ca7b0ebcd7bab4132447a890a892f7983d6c9e82872359","line_start":94,"line_end":116,"label":"轴对称装药探针","excerpt":"    pressureProbes\n    {\n        type           blastProbes;\n        writeControl   timeStep;\n        writeInterval  1;\n        adjustLocations yes;\n\n        probeLocations\n        (\n            (1 0 0)\n            (2 0 0)\n            (5 0 0)\n            (10 0 0)\n            (15 0 0)\n            (20 0 0)\n        );\n        fields\n        (\n            p\n            impulse\n            dynamicP\n        );\n    }","excerpt_sha256":"b5555021944d89cfb3791ddc8862975333e0cca861f6f8ae43a88db5be7cea34"},{"evidence_id":"probe_rule","path":"manual/markdown/15_function_objects.md","file_sha256":"f22133da89f48be2d66a63873d227b9fb6be40321075cb6634a5cf2f35168bbe","line_start":29,"line_end":43,"label":"探针移动/默认与AMR","excerpt":"## 15.1 blastProbes\n\nA modified version of the standard OpenFOAM probe utility is also available, where the basic functionality remains the same, with several key additions. First, the ability to append to exiting probe files is now possible, allowing for a single probe file to be used even if a simulation is restarted from a later time. Second, probes that are not found within the mesh can be moved to the nearest face so they can produce valid results. This can be very useful if a probe is needed on a curved face. Lastly, the warning of probes existing on multiple processors has been removed by selecting a single processor on which to probe.\n\n\u003e **NOTE:** When refinement and unrefinement occurs, the probe locations will \"jump\" to the nearest cell resulting in fluctuations when plotted. This can be eliminated by allowing refinement of probes in dynamicMeshDict (\"refineProbes\") (this is the default option).\n\n| Entry | Description |\n|---|---|\n| probeLocations | List of locations to probe |\n| fields | Fields to probe at the given points |\n| append | Are probes appended to and existing file (default no) |\n| fixLocation | Probes follow cell motion (not stationary) |\n| adjustLocations | Can probes be moved into the mesh (default no) |\n| writeVTK | Probed points are written to a VTK file (default no) |\n| interpolationScheme | Method to interpolate probe. Options are cell, cellPoint, cellPointFace, cellPatchConstrained, cellPointWallModified, and pointMVC (default is cell) |","excerpt_sha256":"279b89a9bc898113f1d13cd04f298ee73c98a408688288af9ddbebe296816946"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["默认就是yes","移动目标说成任意用户位置"],"answer":"根据控制字典文件中的设置，pressur
