eProbes允许把网格外探针移到网格内。具体来说，adjustLocations选项被设置为yes，这意味着探针位置可以被调整。probeLocations选项中列出的探针位置包括(1 0 0)、(2 0 0)、(5 0 0)、(10 0 0)、(15 0 0)和(20 0 0)，这些位置可能位于网格外部。因此，可以通过设置适当的probeLocations选项来将网格外探针移到网格内。","answer_sha256":"db4cbbc5afe2a16dcacaef23971ae61c04f2d84186b95ede82273a7f11c0a0b3","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/axisymmetricCharge/system/controlDict","start":95,"end":117}],"references_delivered":true},{"sample_id":"R-b4b3db33fb3d","question":"我在整理物性表，icoTabulated和tabulated各需要哪些数据？二维查表还能提供哪些导数？","question_id":"N66-03","question_sha256":"35d238612e3208c465f6b370d643816c39e49152e946eabcb2ff6b4e2dc6a325","annotation_sha256":"66691f84063a6374eb36c4cf9322a699edd53dfafa6901f9413213bf8f94e7c1","conditional":false,"criteria":[{"criterion_id":"N66-03.K1","claim":"icoTabulated使用两个一维表，以T查mu和kappa。","evidence_ids":["v2_ico"]},{"criterion_id":"N66-03.K2","claim":"tabulated使用两个二维表，以rho、T查mu和kappa。","evidence_ids":["v2_tabtransport"]},{"criterion_id":"N66-03.K3","claim":"二维查表提供一、二阶导数，包括纯导数和混合导数，不只纯导数。","evidence_ids":["v2_table2"]}],"sources":[{"evidence_id":"v2_ico","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1001,"line_end":1003,"label":"5.3.6 icoTabulated","excerpt":"### 5.3.6 icoTabulated\n\nThe tabulated, incompressible transport model can be used to calculate the viscosity and conductivity using only the temperature. The data is read from two one dimensional tables. See Sec. 12.1 for more information on the available options for modifiers and interpolation schemes. The \"x\" and \"f\" names are \"T\" and \"mu\"/\"kappa\" respectively.","excerpt_sha256":"d90893741b4c60629f186094e96f098ab3de4e61e1e0846268bdfb8732b83d00"},{"evidence_id":"v2_tabtransport","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1005,"line_end":1007,"label":"5.3.7 tabulated","excerpt":"### 5.3.7 tabulated\n\nThe tabulated transport model can be used to calculate the viscosity and conductivity using the density and temperature. The data is read from two, two dimensional tables. See Sec. 12.1 for more information on the available options for modifiers and interpolation schemes. The \"x\", \"y\", and \"f\" names are \"rho\", \"T\", and \"mu\"/\"kappa\" respectively.","excerpt_sha256":"777dc10358b87687557b51cb4900e0adec62d8242728afe36f8d81def168a9a4"},{"evidence_id":"v2_table2","path":"manual/markdown/12_numerics.md","file_sha256":"fa477973138256a9a8d258a89ccea1697a1772f525c97191b99f04131a7c091f","line_start":60,"line_end":62,"label":"12.1.4 2D lookup table","excerpt":"### 12.1.4 2D lookup table\n\nData is looked up given $x$ and $y$ values. The data can be read from a table or from a list. The default delimiter is \",\". The table can also be flipped when reading if the input is reversed (y by x) and a check is done on the size when reading. First and second derivatives (pure and mixed) have been implemented and a reverse lookup can be used for scalar data (find $x$ or $y$ given $f$ and $y$ or $x$).","excerpt_sha256":"4160eef9d443e92fc0180aafc14681fca6b5e101f24c5dfd81d493908826d5f3"}],"applicability":"固定版本语料范围；用户未给的本地配置和运行状态不能按参考案例补造，文档说明不等于运行或物理有效性验证。","acceptable_answer_range":"允许等义解释、正确代数形式和必要的条件澄清；不按引用数、固定句式或题干未给的具体值评分。配置问题接受任一种完整有效写法，不强制穷举未问的接口。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"[未生成有效回答：completion_truncated]","answer_sha256":"73b73dc51c6b8b57b3e7523d604eb6b99b9579ad87f7c1ed1e7287bdefcd32b1","generation_failed":true,"binding_status":"bound","generation_status":"completion_truncated","references":[],"references_delivered":null},{"sample_id":"R-9467c32eb158","question":"若为爆炸环境场明确选用查表初始化，并沿用教程tableCoeffs中的correct false，表值设置之后是否还要求静水校正？此步骤与hydrostatic模式有什么不同？","question_id":"P04-02","question_sha256":"e754c06914531fb9c4d4c472bd72027d72886a789eade22947949e88554b0d96","annotation_sha256":"e2abae1e4d969ab01591e6a7d8c7635c3ae9b5352918afb3207768a63e1073e6","conditional":true,"criteria":[{"criterion_id":"P04-02.K1","claim":"表模式按高度的压力和温度确定密度；可选后续静水校正。","evidence_ids":["atmos_rule"]},{"criterion_id":"P04-02.K2","claim":"此块correct false明确不要求设置表值后再做静水初始化。","evidence_ids":["atmos_table"]},{"criterion_id":"P04-02.K3","claim":"hydrostatic模式动态求静水压力梯度并调整密度，不能与查表步骤混同。","evidence_ids":["atmos_rule"]}],"sources":[{"evidence_id":"atmos_rule","path":"manual/markdown/16_utilities.md","file_sha256":"12221c9affd01b16a88a57473f84e080a592e960649e26856aaeefbe2ed3eeac","line_start":225,"line_end":229,"label":"初始化工具用途/输入优先信息边界","excerpt":"## initializeAtmosphere\n\nThe initializeAtmosphere utility is used to initialize stable pressure and density fields such that the hydrostatic pressure gradient and gravitational acceleration force are balanced. The hydrostatic initialization procedure is a modified version of that available in OpenFOAM (OpenCFD Ltd., 2018a). Currently, there are two available models: hydrostatic and tabulated. The hydrostatic model dynamically solves for the hydrostatic pressure gradient and adjusts the density accordingly. The tabulated model reads a list of pressures and temperatures versus height to determine the density fields. An optional hydrostatic correction can be used once the table values have been set. See tutorials/initializeAtmosphere for an example.\n\nInputs can either be read from a dictionary or through the command line. If the tabulated option is requested, `system/atmosphereProperies` must be available.","excerpt_sha256":"f3a0523ea664b263931cedc4b1e583eb5888a92af5fc75052c648885841f2047"},{"evidence_id":"atmos_table","path":"tutorials/initializeAtmosphere/system/atmosphereProperties","file_sha256":"6ed6a23029139761a787ba3abc8fa908b77cecbe0a9436ad8607e864a22723d7","line_start":28,"line_end":43,"label":"备用查表参数块","excerpt":"tableCoeffs\n{\n    hRef            -10;        // Minimum point where h = 0\n    correct         false;      // Use hydrostatic initialization after\n                                // setting table values\n    pTable\n    {\n        p           (1.1e5 1e5); // Pressure values\n        h           (-10 10);    // Heights\n    }\n    TTable\n    {\n        T           (400 300);   // Temperature values\n        h           (-10 10);    // Heights\n    }\n}","excerpt_sha256":"7644f2c4ff9544211c2ef07c38ec21908671959d4d1ce9eb394455af7f94cb11"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["correct false仍表示强制做后续校正"],"answer":"在使用查表初始化时，表值设置之后不需要静水校正。静水校正主要用于hydrostatic模式，用于动态求解静水压力梯度和重力加速度力。查表初始化则是通过读取压力和温度高度表来确定密度场。因此，在查表初始化中，不需要进行静水校正。","answer_sha256":"2307a9938d12f5259794c5a43cb7dbfc504586173b2f6c6599c0717e8e0de59a","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/16_utilities.md","start":227,"end":244}],"references_delivered":true},{"sample_id":"R-c80c58dd1b5c","question":"结合 Miller 模型方程和 internalDetonation 教程配置，说明 pMin 与 pScale 在计算后燃速率时如何共同作用。若将 pScale 从 1e-6 改为 1，后燃速率表达式中的压力项会如何变化？","question_id":"E19-04","question_sha256":"528a834e783d0f7dd9d4000e86e00a5af8467441add17ad526384bccf9f1de49","annotation_sha256":"dcec6b9e8e9e4a41cb3da39093029a3a31106c8c98779fabcd085fadd203e5a4","conditional":true,"criteria":[{"criterion_id":"E19-04.K1","claim":"Miller 方程中压力项为 (p × p_scale)^n，pScale 是压力缩放因子，默认值为 1。","evidence_ids":["X_miller"]},{"criterion_id":"E19-04.K2","claim":"pMin 是后燃发生的最低压力[Pa]，教程中设为 1e5 Pa。","evidence_ids":["X_miller","X_internal_afterburn"]},{"criterion_id":"E19-04.K3","claim":"教程pScale=1e-6将Pa数值换为MPa尺度；在同一p\u003e0、n和其他因子不变时，改为1使压力因子从(p*1e-6)^n变为p^n，比例为10^(6n)，本例n=0.1667时约10倍。此代数比较不保证整次仿真结果同比例变化。","evidence_ids":["X_miller","X_internal_afterburn"]},{"criterion_id":"E19-04.K4","claim":"pMin给后燃发生的最低压力门槛，pScale缩放方程中的压力因子，职责不同；说明没有给出门槛比较/激活的详细实现或缩放先后关系，不能仅据这两段资料指定程序分支。","evidence_ids":["X_miller","X_internal_afterburn"]}],"sources":[{"evidence_id":"X_miller","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1294,"line_end":1317,"label":"miller","excerpt":"#### 5.6.2.4 Miller\n\nThe model of Miller (1995) uses an evolution equation to determine the fraction of the total amount of afterburn energy added to the system due to unburnt material. $c_i$ is the reaction progress variable that has a value between 0 and 1, with an evolution equation defined as\n\n$$\n\\frac{\\partial\\alpha_i\\rho_ic_i}{\\partial t} + \\nabla\\cdot(\\alpha_i\\rho_iuc_i) = \\alpha_i\\rho_ia(1 - c_i)^m(p \\times p_{scale})^n\n$$\n(5.96)\n\nand the total afterburn energy is found using\n\n$$\n\\dot{Q} = \\frac{dc_i}{dt}Q_0\n$$\n(5.97)\n\n| Variable | Description |\n|---|---|\n| `a` | Model constant [Pa⁻ⁿ] |\n| `m` | Reaction progress variable exponent [ ] |\n| `n` | Pressure exponent [ ] |\n| $Q_0$ | Afterburn energy [J/kg] |\n| `pMin` | Minimum pressure that afterburn occurs [Pa] |\n| `pScale` | Scale factor for pressure (default is 1) [ ] |","excerpt_sha256":"20731d6e9765d61d7c18f192a5fdcbf20cd6b8c7398923883b80c8954de1e7da"},{"evidence_id":"X_internal_afterburn","path":"tutorials/blastFoam/internalDetonation/internalDetonation/constant/phaseProperties","file_sha256":"291f35dcecbddc5a9ee6c270df95f58fa673ffcf9affc7a752831f47888b446f","line_start":88,"line_end":111,"label":"internal_afterburn","excerpt":"    afterburnModel Miller;\n\n    MillerCoeffs\n    {\n        Q0  10e6;\n        m   0.5;\n        n   0.1667;\n        a   0.0065;\n\n        pMin 1e5;\n        pScale 1e-6; // convert to MPa\n    }\n\n    activationModel linear;\n    initiation\n    {\n        E0          9.0e9; // true or false\n        points     ((0 0 0.05)); // m center top detonated\n        vDet       7850; // 8285; // m/s\n        pRef       101298; // refernece pressure for initialization [Pa]\n    }\n\n    residualRho     1e-6;           // Minimum density of the phase\n    residualAlpha   1e-10;          // Minimum volume fraction used for division","excerpt_sha256":"16e1db7a90b74f607116afd2276feb4765420613b58ce3a2751305becf4ba650"}],"applicability":"适用于采用 Miller 模型且配置了 pScale 的场景；pMin 与 pScale 的联合作用需结合具体压力场判断，原文未给出 pMin 触发逻辑的详细实现。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["认为 pScale 不影响后燃速率","把 pMin 与 pScale 混为同一参数","忽略 n 对压力项的非线性影响"],"answer":"在Miller模型中，pMin代表后燃反应开始所需的最小压力，而pScale用于将计算得到的压力值转换为MPa单位。当pScale从1e-6改为1时，压力项的数值会扩大1e6倍，导致后燃速率表达式中的压力项显著增加，从而加快燃烧反应速率。具体变化需结合实际的物理模型方程进行验证。","answer_sha256":"a38d12826af436ee52109c42a2d749281e8df37a5f628f1ba10a2561c72b1a51","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/internalDetonation/internalDetonation/constant/phaseProperties","start":97,"end":108},{"path":"tutorials/blastFoam/internalDetonation/internalDetonation_withObstacle/constant/phaseProperties","start":97,"end":98}],"references_delivered":false},{"sample_id":"R-343bd92380f4","question":"RDX爆炸材料通常被称作固体。能否据手册solid热力学类的常密度限制，判定双装药教程RDX reactants的Murnaghan配置错误？","question_id":"P05-02","question_sha256":"7fe61f5701176767a3cb0d61ab724bd099d4a1a7a80648271f848912021b4599","annotation_sha256":"6301f4163de208d1baf6103c04241e98e325f6635fa84ee39fd0409f600458a3","conditional":true,"criteria":[{"criterion_id":"P05-02.K1","claim":"手册solid热力学模型是特定模型类作用域，不是对所有物理固体材料的命名规则。","evidence_ids":["solid_scope"]},{"criterion_id":"P05-02.K2","claim":"实际RDX detonating的reactants选Murnaghan；仅凭固体材料名称不能判定违反该类约束。","evidence_ids":["two_rdx","detonating"]}],"sources":[{"evidence_id":"solid_scope","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":3,"line_end":13,"label":"solid热力学类作用域","excerpt":"Within blastFoam solvers, two different types of basic thermodynamic models\nare used. The primary is that of a fluid where internal energy and density, or\ntemperature and density, are used to find the resulting pressure and speed of\nsound. The other, is the solid thermodynamic model, which is only used for\nsolid phases within multi-fluid solvers and multi-region solvers. These two\nmodels will share the basic thermodynamic classes (eConst, hConst, etc),\nas well as the choice in the type (basic, detonating, or multicomponent),\nhowever the solid phase only can use a constant density equation of state,\nand the transport model describes the of heat conduction, rather than flow\ncoefficients (like viscosity). These specific choices will be described below.\nTo calculate the pressure and temperature given the conservative quantities (mass, momentum, and energy) three components are required: an equation of state, a thermodynamic model, and a transport model. These models are defined in the `phaseProperties` file located in the `constant` directory of each blastFoam case. Each phase within the `phaseProperties` file has several dictionary entries, and these models are specified in the \"thermoType\" sub-dictionary; the molecular weight must also be defined in the \"specie\" sub-dictionary.","excerpt_sha256":"68c8f27312d7e404fa7f1b9ce4b3beb2f9d7b591e0ef0b797a08c2975ec40480"},{"evidence_id":"two_rdx","path":"tutorials/blastFoam/twoChargeDetonation/constant/phaseProperties","file_sha256":"2de7919133d4f714160d0a1cd710cc376a8a9220196faf79f9373face6d654dd","line_start":18,"line_end":98,"label":"相列表及RDX状态/激活选择","excerpt":"phases (RDX tnt gas);\n\nRDX\n{\n    type detonating;\n    reactants\n    {\n        thermoType\n        {\n            transport   const;\n            thermo      eConst;\n            equationOfState Murnaghan;\n        }\n        equationOfState\n        {\n            rho0            1160;\n            n               7.4;\n            kappa           3.9e11;\n            Gamma           0.35;\n            pRef            101298;\n        }\n        specie\n        {\n            molWeight       222.12;\n        }\n        transport\n        {\n            mu              0;              // Viscosity\n            Pr              1;              // Prandtl number\n        }\n        thermodynamics\n        {\n            Cv              1130.78;           // Heat capacity\n            Hf              0.0;\n        }\n    }\n    products\n    {\n        thermoType\n        {\n            transport   const;\n            thermo      eConst;\n            equationOfState JWL;\n        }\n        equationOfState\n        {\n            A               2.9867e11;\n            B               4.11706e9;\n            R1              4.95;\n            R2              1.15;\n            C               7.206147e8;\n            omega           0.35;\n            rho0            1160;\n        }\n        specie\n        {\n            molWeight       55.0;\n        }\n        transport\n        {\n            mu              0;              // Viscosity\n            Pr              1;              // Prandtl number\n        }\n        thermodynamics\n        {\n            Cv              1000;           // Heat capacity\n            Hf              0.0;\n        }\n    }\n\n    activationModel linear;\n    initiation\n    {\n        E0      4.0e9;\n        points  ((0 0.55 0));\n        vDet    7850;\n    }\n\n    residualRho     1e-6;           // Minimum density of the phase\n    residualAlpha   1e-6;          // Minimum volume fraction used for division\n}","excerpt_sha256":"67a0a359473845da3f0f4540c565e093cc07c58500ad8e9a63c15c9f729ead0c"},{"evidence_id":"detonating","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1065,"line_end":1077,"label":"basic/detonating作用与限制","excerpt":"## 5.5 Basic thermodynamic model\n\nThe basicFluid and basicSolid models (\"type\" basic) uses a transport model, thermodynamic model, and equation of state to describe a phase. The basic model should be used for non-reacting phases.\n\n## 5.6 Detonating thermodynamic model\n\nIn order to better describe a detonating material, a 'detonating' thermodynamic model can be used. This model transitions between an unreacted state and a reacted state using an activation model. Each state (unreacted and reacted) is described by its own basic thermodynamic model, allowing for different models and coefficients to be used for values such as viscosity or specific heats. In addition to the activation model, afterburn models can also be used to add additional energy into the system after the initial detonation reaction has taken place.\n\nThis same methodology is applied to solid phases where energy is released locally to increase the thermal energy (internal energy). Only activation models are currenltly available.\n\nSome standard combinations of unreacted and reacted equations of states include the JWL++ (Murnaghn and JWLC), and the blendedJWL (solidJWL and JWL).\n\n\u003e **NOTE:** Whilst it will not give the correct temperature, using an ideal gas is a simple option if the solid properties of the unreacted material are not known.","excerpt_sha256":"dfebcc31e925ab0f54d3e9f3b0f4c64259ca07ee8d8407f7e53e3cb1e36d3180"}],"applicability":"仅依据固定版本语料回答；不把配置或手册陈述视为已验证仿真效果。","acceptable_answer_range":"允许等义解释、条件式结论及必要澄清；不要求复述参考文字或固定引用数量。","critical_errors":["只凭固体二字判例子错误"],"answer":"根据手册中的资料，RDX爆炸材料通常被称作固体。然而，手册中的例子中使用了Murnaghan方程来描述RDX的热力学行为，这通常用于气体。因此，根据手册中的资料，Murnaghan配置在RDX reactants中可能存在错误。","answer_sha256":"f689ddd3e447323613416bd7d82df6e9c0c44db0f6ecc6e19ab24e123d897a2c","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/20_examples.md","start":360,"end":401},{"path":"tutorials/blastFoam/delayedDetonation/constant/phaseProperties","start":1,"end":49},{"path":"tutorials/blastFoam/twoChargeDetonation/constant/phaseProperties","start":1,"end":49}],"references_delivered":true},{"sample_id":"R-900601bb50b8","question":"在 blastFoam 的 function objects 文档中，若要对某个标量场做 Schlieren 可视化，应使用哪个算子对象？该对象对输入场类型有何限制，结果字段默认如何命名？","question_id":"E34-01","question_sha256":"377450e600df8f448406cbc9615dc3c3f12120872eca22ea469bff4f8ab7572e","annotation_sha256":"b667493532161ec0d0996ca05027e64b60cff771f2c03fb7522da8a98fac949d","conditional":true,"criteria":[{"criterion_id":"E34-01.K1","claim":"应使用 grad 对象，它计算给定场的梯度并写出结果。","evidence_ids":["X_grad"]},{"criterion_id":"E34-01.K2","claim":"grad 仅可用于标量场和向量场。","evidence_ids":["X_grad"]},{"criterion_id":"E34-01.K3","claim":"结果字段默认名为 Schlieren/grad(field)。","evidence_ids":["X_grad"]}],"sources":[{"evidence_id":"X_grad","path":"manual/markdown/15_function_objects.md","file_sha256":"f22133da89f48be2d66a63873d227b9fb6be40321075cb6634a5cf2f35168bbe","line_start":78,"line_end":85,"label":"grad","excerpt":"## 15.6 Schlieren (grad)\n\nThe gradient of the given field is calculated and written. Only scalar and vector fields can be used.\n\n| Entry | Description |\n|---|---|\n| field | Fields to take the gradient of |\n| result | Name of the result field (Schlieren/grad(field) by default) |","excerpt_sha256":"095b47cfecdecac64240b77bc258f2bde4025d24e2fd7af3dc18bed1d3e6610b"}],"applicability":"适用于文档所述 function objects 配置；输入场必须为标量或向量，其他类型未在原文说明。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把 grad 用于非标量/向量场","声称默认结果名不是 Schlieren/grad(field)","把 grad 说成计算拉普拉斯"],"answer":"在 blastFoam 中，对某个标量场进行 Schlieren 可视化应使用 'Schlieren' 算子对象。该对象仅支持标量场和向量场作为输入。结果字段的默认命名格式为 'Schlieren/grad(field)'。","answer_sha256":"ca7e5efa4c11c783c413430f3f902e117546cfe5a6b4047375e6b6e21e5a38a0","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/15_function_objects.md","start":84,"end":90}],"references_delivered":true},{"sample_id":"R-05fe8aa0dce8","question":"我的Mie-Grüneisen相除了初始p、rho、T，还提供了内能e，calculateDensity没有定义。这时p和T继续直接沿用输入值，还是由rho、e重新计算？与没有提供e时相比，初始化的输入输出方向发生了什么变化？","question_id":"E53-03","question_sha256":"2dbe8dfc4326cf78449faf04d2e64a5fca7faa17209519672c84e0e2d25021c8","annotation_sha256":"6036aea18acc6763b4d525fe6caeb078569412112b7baebd5953002e8a35f0e2","conditional":true,"criteria":[{"criterion_id":"E53-03.K1","claim":"已提供e时，由rho和e直接计算p、T，不能认为p、T内部场一定保持输入值不变。","evidence_ids":["X_thermo_initialization"]},{"criterion_id":"E53-03.K2","claim":"未提供e且无calculateDensity覆盖的Mie-Grüneisen默认路径则用p、rho初始化e；应区分两个输入分支。","evidence_ids":["X_thermo_initialization"]}],"sources":[{"evidence_id":"X_thermo_initialization","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":1412,"line_end":1414,"label":"thermo_initialization","excerpt":"## 5.9 Initialization\n\nThe initialization of fields can be handled in several ways, but $\\rho_i$, $p$, and $T$ must be given as initial conditions. Some of these fields may be overwritten, but the boundary conditions are used to construct the conserved quantities. For equations of state in the Mie-Grüneisen form, by default the pressure and density are used to initialize the internal energy. Temperature based equations of state initialize the internal energy using the density and temperature. If the \"calculateDensity\" keyword is defined, and is set to \"yes\" in the given equation of state dictionary, then the density is calculated from the pressure and temperature prior to the initialization of the internal energy. Each of the initialization methods use a Newton-Raphson root finding method to find the necessary quantities. If the internal energy field is provided in the initial conditions folder, the pressure and temperature fields are calculated directly from the density and internal energy.","excerpt_sha256":"f8604d6e43dad19b0ffbea0aefa6fd6be1ef1867255955540de8f2106c0484db"}],"applicability":"Mie-Grüneisen相，初始rho、p、T均存在；对比提供/不提供e，calculateDensity未定义。初始字段及边界条件需求仍保留。","acceptable_answer_range":"允许等义和有依据的条件式解释。","critical_errors":["忽略已提供内能场，仍坚持用p、rho重算e。","混淆已提供e与calculateDensity=yes的路径。","声称提供e后可以删掉所有p、T初始字段及边界条件。"],"answer":"当提供了内能e时，p和T继续直接沿用输入值；否则，p和T由rho、e重新计算。与没有提供e时相比，初始化的输入输出方向发生了变化。","answer_sha256":"d709ac8f403ac65362d4940cbc84095db83c99ba1701116229d9ce2ebd0cb49c","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":238,"end":265}],"references_delivered":true},{"sample_id":"R-520ce5f2523e","question":"sphere和RanzMarschall都能算Nu。同样的流动条件下，它们对换热项的影响有什么区别？","question_id":"N61-03","question_sha256":"b1c372e718ced4f1c9e2c13824fee1a3b83abb83ad316589a2e14dd9d7c3d37f","annotation_sha256":"ab52efdfbc64a45418d49b8a9081a6b8797f32d09e6c1d2e4603605c08080788","conditional":false,"criteria":[{"criterion_id":"N61-03.K1","claim":"sphere的Nu为2+0.4 Re^(1/2)Pr^(1/3)，RanzMarschall为2+0.6 Re^(1/2)Pr^(1/3)。","evidence_ids":["v2_sphere","v2_rmnu"]},{"criterion_id":"N61-03.K2","claim":"RanzMarschall减sphere的Nu差为0.2 Re^(1/2)Pr^(1/3)。","evidence_ids":["v2_sphere","v2_rmnu"]},{"criterion_id":"N61-03.K3","claim":"按式(3.18)代入后的差为6 alpha_d kappa_c/d_d^2乘以上述差，不改动该通用前因子。","evidence_ids":["v2_heat","v2_sphere","v2_rmnu"]}],"sources":[{"evidence_id":"v2_sphere","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":246,"line_end":253,"label":"3.4.6 sphere","excerpt":"### 3.4.6 sphere\n\nThe Nusselt number for spheres is defined as\n\n$$\nNu_{ij} = 2 + 0.4Re_{ij}^{1/2}Pr_{ij}^{1/3}\n$$\n(3.23)","excerpt_sha256":"454a908a75b12d032cf97b1362406f93b3ebc91e6e9169c921c266db004a3b54"},{"evidence_id":"v2_rmnu","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":237,"line_end":244,"label":"3.4.5 RanzMarschall","excerpt":"### 3.4.5 RanzMarschall\n\nThe Ranz-Marschall Nusselt number for spheres is defined as\n\n$$\nNu_{ij} = 2 + 0.6Re_{ij}^{1/2}Pr_{ij}^{1/3}\n$$\n(3.22)","excerpt_sha256":"63c5c9f6e217c813bce0ae9ce0699a39f14047cf2e22f3017cb26ece2d38276d"},{"evidence_id":"v2_heat","path":"manual/markdown/03_interfacial_models.md","file_sha256":"89ca979933979c1d1031eecc10769d96f328b90fb46c5ac92b7c7373ae047440","line_start":180,"line_end":194,"label":"3.3.1 RanzMarshall","excerpt":"### 3.3.1 RanzMarshall\n\nThe Ranz Marshall heat transfer model (Houim and Oran, 2016) defines the heat transfer rate as\n\n$$\n\\dot{E}_{HT,ij} = \\frac{6\\alpha_d\\kappa_c Nu_{ij}}{d_d^2}\n$$\n(3.18)\n\nwhere the Nusselt number is a run-time selectable model, and all other properties are taken from the thermodynamic model.\n\n| Variable | Description |\n|---|---|\n| NuModel | Nusselt number model |\n| residualAlpha | Stabilization value of volume fraction (defaults to that of the phaseModel) |","excerpt_sha256":"c1a105dce7148d3559a9ee0e65118650ec37773d5b0983e08f21b577f47f40e5"}],"applicability":"固定版本语料范围；用户未给的本地配置和运行状态不能按参考案例补造，文档说明不等于运行或物理有效性验证。","acceptable_answer_range":"允许等义解释、正确代数形式和必要的条件澄清；不按引用数、固定句式或题干未给的具体值评分。配置问题接受任一种完整有效写法，不强制穷举未问的接口。 比较需固定Re、Pr及共同传热输入；不要求引用公式编号或保证整场收益。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"在BlastFoam中，Nu（努塞尔数）是用于描述对流换热的无量纲数，它与传热系数和特征长度有关。`sphere`和`RanzMarschall`是两种不同的模型或方法，用于计算Nu。`sphere`通常用于球形物体的换热计算，而`RanzMarschall`是一种经验公式，用于计算颗粒在流体中的换热系数，特别是在气固反应或颗粒流中。在相同的流动条件下，`sphere`模型可能基于几何形状和流体动力学特性进行计算，而`RanzMarschall`则可能基于实验数据和经验关系，因此它们对换热项的影响可能不同。具体区别需要查阅相关模型的实现细节和适用条件。","answer_sha256":"71a7b5976416006e35243cb8dad4291a148b18823b45af5e9f899744fca64d03","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-db0305de9868","question":"在 blastFoam 的 JWL 模型说明中，solidJWL 类型用于未反应状态时，e_{0,i} 与 pRef 的作用是什么？热能在该固体情形下是否被考虑？","question_id":"E15-03","question_sha256":"610d6032a1a127bada559b6a201287e26f3fcf7594020ee5c707e7a8c8e04eb6","annotation_sha256":"8a316b54139c1bc6ca00d02cce4fc528457f0f2134f6d4959c4ec7e77c424c26","conditional":false,"criteria":[{"criterion_id":"E15-03.K1","claim":"solidJWL 情形下 e_{0,i} 被计算为使参考密度处压力为零，并使用偏移压力 pRef","evidence_ids":["X_jwl"]},{"criterion_id":"E15-03.K2","claim":"固体情形下热能不被考虑","evidence_ids":["X_jwl"]}],"sources":[{"evidence_id":"X_jwl","path":"manual/markdown/05_fluid_solid_thermo.md","file_sha256":"e8369aa14525d4c3adb639ae6e134af41d6d97d84484f114ef221e63c141f8dc","line_start":520,"line_end":555,"label":"jwl","excerpt":"#### 5.2.2.8 JWL\n\nThe more complicated Jones Wilkins Lee EOS is often used to define energetic materials (Zheng et al., 2011), and has a pressure deviation given by\n\n$$\n\\Pi_i = A_ie^{-R_{1,i}V}\\left( \\frac{\\omega_i}{R_{1,i}V} - 1 \\right) + B_ie^{-R_{2,i}V}\\left( \\frac{\\omega_i}{R_{2,i}V} - 1 \\right) - \\rho_i\\omega_ie_{0,i}\n$$\n(5.45)\n\nwhere $V = \\rho_{0,i}/\\rho_i$.\n\n$$\n\\Gamma_{r,i} = \\omega_i + 1\n$$\n(5.46)\n\nand\n\n$$\n\\delta_{r,i} = A_ie^{-\\frac{R_{1,i}\\rho_{0,i}}{\\rho_i}}\\left[ \\omega_i\\left( \\frac{1}{R_{1,i}\\rho_{0,i}} + \\frac{1}{\\rho_i} \\right) - \\frac{R_{1,i}\\rho_{0,i}}{\\rho_i^2} \\right]\\frac{1}{\\omega_i} + B_ie^{-\\frac{R_{2,i}\\rho_{0,i}}{\\rho_i}}\\left[ \\omega_i\\left( \\frac{1}{R_{2,i}\\rho_{0,i}} + \\frac{1}{\\rho_i} \\right) - \\frac{R_{2,i}\\rho_{0,i}}{\\rho_i^2} \\right]\\frac{1}{\\omega_i} - e_{0,i}\n$$\n(5.47)\n\n\u003e **NOTE:** The JWL model can also be used to describe the unreacted state if a detonating model is used with the `solidJWL` type. For the solid case, $e_{0,i}$ is calculated so that there is zero pressure at the reference density, and uses an offset pressure, \"pRef\". Thermal energy is also not considered for the solid case\n\n| Variable | Description |\n|---|---|\n| $A$ | Model coefficient [Pa] |\n| $B$ | Model coefficient [Pa] |\n| $R_1$ | Model coefficient [ ] |\n| $R_2$ | Model coefficient [ ] |\n| `rho0` | Unreacted or reference density [kg m⁻³] |\n| `omega` | Grüneisen coefficient [ ] |\n| $e_0$ | Offset energy (0 by default for gas) [J/Kg] |\n| `pRef` | Offset pressure (only for solid, 0 by default) [Pa] |\n","excerpt_sha256":"73510877ab7a748da20f35fd580631797b6c81ee68b8608659065b91457203a3"}],"applicability":"仅适用于原文 NOTE 所述 solidJWL 未反应状态分支；气体 JWL 默认 e_0 为 0，pRef 仅用于固体且默认 0。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把 solidJWL 的 e_0 说成与气体 JWL 一样默认 0 且不随参考密度调整","声称固体情形仍考虑热能"],"answer":"在blastFoam的JWL模型中，solidJWL类型用于未反应状态时，e_{0,i}与pRef的作用是为了使在参考密度时压力为零，pRef是偏压，用于solidJWL类型。对于固体状态，热能不被考虑。","answer_sha256":"fc7cda013b4dc8fe3a3c0c2b47e55dbe70a4f2c4cc19307278f3472adee0fc6b","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"manual/markdown/05_fluid_solid_thermo.md","start":543,"end":579}],"references_delivered":true},{"sample_id":"R-6529c9e34ec5","question":"在 blastFoam 的 fvSchemes 中，若为湍流场或组分质量分数等附加输运量启用 Riemann 通量，应如何配置 divSchemes 与 interpolationSchemes？该配置在什么条件下可能失效？","question_id":"E54-01","question_sha256":"2b0f239827abb348af6886c60c478d1090e7fba1a3842c2d3071268f4899a7bc","annotation_sha256":"6ac081d1e257bb784205ede855131e92967ca7e0fc6bcccfed6b23d5a7ae0d4a","conditional":true,"criteria":[{"criterion_id":"E54-01.K1","claim":"Riemann 通量可用于附加标量输运，需在 divSchemes 中为对应场指定 Riemann，并在 interpolationSchemes 中为该场指定限制器。","evidence_ids":["X_riemann_limits"]},{"criterion_id":"E54-01.K2","claim":"若未为某场单独指定限制器，默认使用 reconstruct(rho) 指定的限制器。","evidence_ids":["X_riemann_limits"]},{"criterion_id":"E54-01.K3","claim":"当存在非常刚性的隐式源项（如湍流模型中的产生项）时，显式对流项可能变得可忽略，导致不发生对流；因此对湍流输运仍推荐隐式散度格式。","evidence_ids":["X_riemann_limits"]}],"sources":[{"evidence_id":"X_riemann_limits","path":"manual/markdown/10_flux_evaluation.md","file_sha256":"1ce0c849af89442dd41754d5df18a2d95ecf036f3a3514575065bf24481ac3a9","line_start":379,"line_end":414,"label":"riemann_limits","excerpt":"\nwith\n\n$$\nF_p = \\begin{pmatrix} 0 \\\\ \\vdots \\\\ 0 \\\\ (a_{\\mathrm{own}}p_{\\mathrm{own}} + a_{\\mathrm{nei}}p_{\\mathrm{nei}})n \\\\ a(p_{\\mathrm{own}} - p_{\\mathrm{nei}}) \\end{pmatrix}\n$$\n(10.48)\n\n## 10.2 Riemann advection scheme\n\nIn order to allow for consistency between the conserved quantities (mass, momentum, and energy), and additional transport quantities such as turbulence fields or species mass fractions, an additional advection scheme using the Riemann fluxes has been added. This makes use of the quantities calculated in transport of the conserved variable which then allows for the use of higher order interpolation schemes to be used for additional scalar transport. This is a major advantage over traditional methods which are generally limited to upwinding for additional transport due to presence of strong gradients.\n\n```\ndivSchemes\n{\n    default\n        none;\n    div(alphaRhoPhi.tnt,lambda.tnt)\n        Riemann;\n    div(alphaRhoPhi.tnt,c.tnt)\n        Riemann;\n}\ninterpolationSchemes\n{\n    default linear;\n    ...\n    reconstruct(lambda.tnt)\n        linearMUSCL vanLeer;\n    reconstruct(c.tnt)\n        linearMUSCL vanLeer;\n}\n```\n\nIn the interpolation schemes sub-dictionary, the limiters should be specified for each field using the Riemann fluxes, but by default the limiter specified by \"reconstruct(rho)\" will be used.\n\nNOTE: One limitation of using the Riemann fluxes is that, because an explicit advection term for the transported quantities is used, when very stiff implicit terms are present (such as production term in turbulence models), the advection term can become negligible leading to no advection occurring. For this reason, implicit divergence schemes are still recommended for the advection of turbulence quantities and other equations with large implicit source terms.","excerpt_sha256":"0c2193cf54c28beeba347b1ef38d84403f1fd22803852df47f4cbedc33caa605"}],"applicability":"适用于 blastFoam 中通过 Riemann 通量输运附加标量（如 lambda.tnt、c.tnt）的配置；不适用于未使用 Riemann 通量的默认输运，也不保证所有刚性源项场景下显式对流均有效。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["认为 Riemann 通量对所有附加输运都优于隐式格式，忽略刚性源项下对流可能消失的限制。","忽略 interpolationSchemes 中需为各场指定限制器，或误认为默认限制器一定来自 reconstruct(U)。"],"answer":"在 blastFoam 的 fvSchemes 中，若为湍流场或组分质量分数等附加输运量启用 Riemann 通量，应配置 divSchemes 中对应项为 Riemann，并在 interpolationSchemes 中为相关变量（如 alpha、rho、U、e、p 等）选择适当的插值方案（如 vanLeer、Minmod 等）。该配置可能在以下条件下失效：1. 若未正确启用 fluxScheme（如未设置为 Kurganov）；2. 若相关变量未在 interpolationSchemes 中定义对应的插值方法；3. 若网格质量不佳或数值稳定性不足。","answer_sha256":"b75929fa9762ed766d2e5d7206ff7cebef031396741545f0343a73606e55c414","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/twoChargeDetonation/system/fvSchemes","start":34,"end":39},{"path":"tutorials/blastFoam/internalDetonation/internalDetonation/system/fvSchemes","start":34,"end":55}],"references_delivered":true},{"sample_id":"R-5204052d62d1","question":"在blastFoam多区域温度耦合中，globalTemperatureCoupled计算补丁温度时依据哪些邻居量？若边界只有部分与邻居补丁重叠，说明unmappedT的用途与默认值，并判断这些说明是否足以保证整个补丁最终都处于该默认温度。","question_id":"E51-01","question_sha256":"7fe630aa85870b549f0dff6b153ad7ad3bad9ad988fed2012f545a84a2ea4290","annotation_sha256":"cd6ac2f81828a8ba1bcf4ea52d17ee4e9edd35cd6b214b7b9842a9800ad31cb5","conditional":true,"criteria":[{"criterion_id":"E51-01.K1","claim":"补丁温度的计算使用邻居温度、传热系数及辐射热流。","evidence_ids":["X_temperature_coupled"]},{"criterion_id":"E51-01.K2","claim":"unmappedT是未映射温度参数，默认293.15；说明讨论边界未与邻居补丁重叠时可指定该温度，不应把它解释成对所有已映射面的统一温度设置。","evidence_ids":["X_temperature_coupled"]},{"criterion_id":"E51-01.K3","claim":"给定段落未细化完全/部分重叠的逐面计算或映射规则；默认参数不保证整个补丁最终都等于293.15，也不保证实际各面的温度结果。","evidence_ids":["X_temperature_coupled"]}],"sources":[{"evidence_id":"X_temperature_coupled","path":"manual/markdown/08_region_models.md","file_sha256":"17825f7a76cc1ca1dc20cc6a399a395cc694e4d8cb3177768ee08f56d25e63b1","line_start":62,"line_end":74,"label":"temperature_coupled","excerpt":"### globalTemperatureCoupled\n\nUsing the same methodology as the globalMapped boundary condition, the globalTemperatureCoupled boundary condition computes the temperature of a patch using the neighbour temperature, heat transfer coefficient, and radiation heat flux. Optionally when the entire boundary does not overlap the neighbour patch and unmapped temperature can be specified.\n\n| Variable | Description |\n|---|---|\n| TNbr | Name of neighbour temperature (T by default) |\n| hNbr | Name of neighbour convective heat transfer coefficient (none by default) |\n| h | Name of convective heat transfer coefficient (none by default) |\n| qrNbr | Name of neighbour radiation heat flux (none by default) |\n| qr | Name of radiation heat flux (T by default) |\n| limitGrad | Is the temperature gradient limited (no by default) |\n| unmappedT | Unmapped temperature (293.15 by default) |","excerpt_sha256":"c6a6b087be318e17ee037044880c57d7270fc79db7b78ec31fa3c651cfb22524"}],"applicability":"按固定globalTemperatureCoupled说明解释参数用途及资料边界；不假定已有实际映射、温度场或实现分支证据。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["漏掉邻居温度、传热系数或辐射热流中的必要作用量","把unmappedT当成整个补丁无条件固定温度","把默认293.15当作已验证逐面或整个补丁运行结果"],"answer":"在blastFoam多区域温度耦合中，globalTemperatureCoupled计算补丁温度时依据邻居区域的温度场。当边界仅部分与邻居补丁重叠时，unmappedT用于处理未映射的温度值，默认值为0。然而，这些说明不足以保证整个补丁最终处于该默认温度，需结合具体边界条件和耦合设置验证。","answer_sha256":"2ad071a75b3eb8c77f2bdabddf3c77aa8afda1bec5143f5d4cc8004a6de9177b","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-0849ab52ed58","question":"reacting粒径模型选用pressureBased反应率，关系中的压力按MPa表示。若误把pScale设为1而不是1e-6，粒径输运方程的哪一项受到影响？请说明正确缩放和k的压力幂形式。","question_id":"N60-03","question_sha256":"ef5518eae1031b57f57742bfe6fb28f91001896c644617eaeffde2ce738e1602","annotation_sha256":"dd651d9baee037143a3b477656521cad261d1006a4ffe43970a9c485e49270cc","conditional":true,"criteria":[{"criterion_id":"N60-03.K1","claim":"reacting方程为partial_t d_i+u_i·grad d_i=k，k是源项。","evidence_ids":["v2_dreact"]},{"criterion_id":"N60-03.K2","claim":"该速率为k=beta*(p*pScale)^alpha；手册给MPa示例pScale=1e-6。","evidence_ids":["v2_dpressure"]},{"criterion_id":"N60-03.K3","claim":"误设缩放改变方程右端k中的压力幂项，不能仅说改变输出单位而不影响速率。","evidence_ids":["v2_dreact","v2_dpressure"]}],"sources":[{"evidence_id":"v2_dreact","path":"manual/markdown/09_diameter_models.md","file_sha256":"a62ec6a288149422b050fa333dc00d356e2d126d7b959bf3403499819be3c8a1","line_start":38,"line_end":53,"label":"reacting","excerpt":"## reacting\n\nThe reacting diameter model adds an additional source term in the transport equation for the diameter to increase/decrease the local diameter based on the given reaction rate\n\n$$\n\\frac{\\partial d_i}{\\partial t} + u_i \\cdot \\nabla d_i = k\n$$\n\n(9.3)\n\nwhere k is the specified reaction rate (see Sec. 9.4)\n\n| Entry | Description |\n|---|---|\n| d | Initial diameter [m] |\n| reactionRate | Reaction rate model |","excerpt_sha256":"c4fd252d9408986ff4f42bb480cbf9e18d34f06a45362530f342b0c7247ec4ac"},{"evidence_id":"v2_dpressure","path":"manual/markdown/09_diameter_models.md","file_sha256":"a62ec6a288149422b050fa333dc00d356e2d126d7b959bf3403499819be3c8a1","line_start":59,"line_end":76,"label":"pressureBased","excerpt":"### pressureBased\n\nThe pressureBased reaction rate uses a coefficient, pressure scale, pressure offset (in scaled units) and pressure exponent to compute the rate\n\n$$\nk = \\beta (\\bar{p})^\\alpha\n$$\n\n(9.4)\n\nand $\\bar{p} = p \\times p_{scale}$. For example, if the pressure relation is in MPa, $p_{scale} = 1e^{-6}$.\n\n| Entry | Description |\n|---|---|\n| alpha | Pressure exponent [ ] |\n| beta | Coefficient [Pa−α] |\n| pScale | Pressure scale [ ] |\n| offset | Pressure offset [Pa/pScale] |","excerpt_sha256":"be3e2c149cd8873e26bc8d2e3e0bfe8d28a401a133adae81d2c82bc068aa6d37"}],"applicability":"限定于固定版本blastFoam手册；手册陈述不等于仿真物理有效性证明。","acceptable_answer_range":"允许等义解释与正确代数形式；尊重原文的条件、范围和未说明事项。","critical_errors":["混淆不同模型的物理量、输入范围或适用条件；编造资料未提供的实现或性能保证。"],"answer":"粒径输运方程中的压力项（通常为扩散项或源项）受到影响。正确缩放应为pScale=1e-6 MPa，k的压力幂形式为k*(p/pScale)^n，其中n为幂指数。","answer_sha256":"fee4e1869a67860d655aa8241b6b902c003a08fcb73a127eb65d44c02fd14779","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[],"references_delivered":true},{"sample_id":"R-a021a4d085b9","question":"在 blastFoam 的 building3DWorkshop 案例中，若想为计算域内若干离散位置获取压力/时间历史，原文推荐用哪条命令生成探针文件，生成后该文件位于何处，又应如何把它接入 controlDict 才会在运行中生效？","question_id":"E55-01","question_sha256":"f635da5583af21d82064d3778b52407031efa283f52a7fb1ac33d09f29001be0","annotation_sha256":"451b2deb2fafe120b956e71d1123263b6146e66dbe4529b458d03bbb54940150","conditional":true,"criteria":[{"criterion_id":"E55-01.K1","claim":"用 foamGet probes 命令生成探针文件，并可按提示选择生成探针文件与配置输出时间的配置文件","evidence_ids":["X_workshop_probes"]},{"criterion_id":"E55-01.K2","claim":"生成后会在 system 目录下得到名为 probes 的文件，需编辑该文件把探针放到期望位置","evidence_ids":["X_workshop_probes"]},{"criterion_id":"E55-01.K3","claim":"在 controlDict 的 functions{}; 段中用 #includeFunc \"probes\"; 加载该 system/probes 文件","evidence_ids":["X_workshop_probes"]}],"sources":[{"evidence_id":"X_workshop_probes","path":"tutorials/blastFoam/building3DWorkshop/README.md","file_sha256":"eb9a1dd53a45e0558088c1aaf382a4b95d7e8036a0dd39b9216eba188e680d24","line_start":5,"line_end":56,"label":"workshop_probes","excerpt":"This was the example case used throughout the May 13th, 2020 blastFoam workshop (thank you to everyone who attended!). This case is designed to show a simple 3-D case setup using an STL file with snappyHexMesh and adaptive mesh refinement. A c-4 charge placed inside a L-Shaped building, and the c-4 is activated using the linear activation model.\n\nThe case takes approximately 5 min to run on a four-core desktop. Some additional notes:\n\n- There are a few examples of how to add probes and/or surfaces and other runtime processing directives to an OpenFOAM/blastFoam case. An example ```probesAndSurfaces``` file is included in the system directory. One can cut/paste/modify these examples into the functions{}; section of the ```controlDict``` file. An alternative, and handy, way to acheive this is to use the ```foamGet``` command to generate a probes (or other) file and include the functions{}; section of the ```controlDict```.\n\nExample: \n\nI want to generate a basic probe (gage) that I can then modify get pressure/time histories at discrete locations in my calculation. \n\n```bash\ncd \u003croot-case-directory\u003e\nfoamGet probes # answer (1) to get the probes file and (2) to get a configuration file to set output times etc.\n``` \nYou will now have a file called \"probes\" in the system directory. Edit that file so that the probes are in the desired locations. Then, in the controlDict file, find the functions{}; section of the case. Add this line(s):\n\n```c++\nfunctions\n{\n\t#includeFunc \"probes\"; // this will load the system/probes file that was created with the $ foamGet probes command\n};\n```\n\nAlternatively, you can do this manually directly in the ```controlDict``` file:\n\n\n```c++\nfunctions\n{\n\n    pressureProbes\n    {\n        type            probes;\n        functionObjectLibs (\"libsampling.so\");\n        writeControl    timeStep;\n        writeInterval   1;\n        probeLocations\n        (\n\t\t\t// probe locations in ( x y z ) format, unlimited number -- needs to be inside the domain!\n\t\t\t( 1.999 0.001 0.5)\n\t\t\t// ( 0 0 0 ) // etc... \n        );\n        fields\n        (\n            p // fields you want at each probe location: p U T rho etc. \n        );\n    }\n\n};\n```\n\nDuring/after running the simulation, results will be in the ```postProcessing``` directory.","excerpt_sha256":"846ce75fe358e17b2a3cf052ecf4bc05f61ae3a9dd0fb2b554fb69151eaf88c8"}],"applicability":"仅适用于该 workshop 案例所描述的 OpenFOAM/blastFoam 案例目录结构与 controlDict 的 functions{}; 机制；原文未说明其他版本或非该案例目录下的行为。","acceptable_answer_range":"等义解释、合理条件式结论及必要澄清可接受；不以关键词或引用数量替代内容判断。","critical_errors":["把探针文件放到非 system 目录并声称 #includeFunc \"probes\" 仍能按原文加载","认为生成后无需编辑位置即可得到期望离散位置的历史","把 #includeFunc 写在 controlDict 的 functions{}; 之外并声称按原文生效"],"answer":"使用 foamGet 命令生成探针文件，命令如下：cd \u003croot-case-directory\u003e foamGet probes\n生成的探针文件位于系统目录中，需要在 controlDict 文件中添加相应的函数来接入该文件。具体操作如下：在 controlDict 文件中找到 functions{}; 部分，添加以下代码：\n#includeFunc \"probes\"; // 加载系统/probes 文件\n或者直接在 controlDict 文件中添加以下代码：\npressureProbes\n{\n    type            probes;\n    functionObjectLibs (\"libsampling.so\");\n    writeControl    timeStep;\n    writeInterval   1;\n    probeLocations\n    (\n        ( 1.999 0.001 0.5)\n    );\n    fields\n    (\n        p // fields you want at each probe location: p U T rho etc. \n    );\n}\n\n在运行中，结果会保存在 postProcessing 目录中。","answer_sha256":"79adf73c18f2ac9b772c39c3d09c59835560a299126a757e65696e62bdd98096","generation_failed":false,"binding_status":"bound","generation_status":"answered","references":[{"path":"tutorials/blastFoam/building3DWorkshop/README.md","start":15,"end":58}],"references_delivered":true}],"generation_protocol_sha256":"d658134e6df5053454ed78893523eb25320d8354dec558f689d4dacc4524ccf2","transport_execution_overlay_sha256":"a1d2e3a24d9c5c2d7f36263c2805eb2459b22b1ef75f41d0890e84765d47a871"},"labels":{"schema":"human_review_labels_v1","phase":"calibration","labels":[{"sample_id":"R-22fc0a271924","reviewer":"blastfoam专家","reviewed_utc":"2026-11-04T09:11:52.778535+00:00","packet_sha256":"126dec168db91de3712ce804078f2392602b8279cfd67ecf7f9e1fadcc43f143","record":{"schema_version":"ch2_five_level_dual_eas","sample_id":"R-22fc0a271924","judge_id":"human","judge_version":"single-human-reference-v1","status":"complete","points":[{"criterion_id":"E14-03.K1","score":0.75,"reason":"标量及各向同性正确，遗漏常数属性且同质性用词不准。","answer_quote":""},{"criterion_id":"E14-03.K2","score":0.75,"reason":"矢量及各向异性正确，遗漏常数属性且异质性用词不准。","answer_quote":""},{"criterion_id":"E14-03.K3","score":0.5,"reason":"正确说明标量与矢量区别，遗漏共同单位W/m/K。","answer_quote":""}],"fact_gate":0.75,"applicability_gate":"not_applicable","reason":"AI辅助人工评分：AI提出推荐及依据，评审人逐项查看后明确确认；由助手代为转录。此记录不是无
