<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第2章单人匿名回答评分</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#182738;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 32px;background:#122e43;color:white}h1{font-size:24px;margin:0 0 6px}header p{margin:0;color:#d3e0e8}main{max-width:1280px;margin:24px auto;padding:0 24px}.bar,.card{background:white;border:1px solid #dae2e8;border-radius:10px;padding:20px;margin-bottom:16px}.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center}button,select,input,textarea{font:inherit}button{border:1px solid #99afbf;border-radius:6px;background:#fff;padding:6px 12px;cursor:pointer}button:hover{background:#eaf1f6}button:disabled{opacity:.5;cursor:default}input[type=text]{padding:5px 8px;border:1px solid #99afbf;border-radius:5px}input[type=file]{max-width:320px}.layout{display:grid;grid-template-columns:190px 1fr;gap:20px}nav{display:grid;align-content:start;gap:6px;max-height:80vh;overflow:auto;position:sticky;top:12px}nav button{text-align:left;font-size:13px}nav button.active{background:#123f5e;color:white}nav button.done::after{content:' ✓';color:#3b9d70}h2{margin:0 0 10px;font-size:21px}h3{margin:16px 0 8px;font-size:18px}.notice{padding:12px;background:#fff3d8;border-left:4px solid #d89c26}.muted{color:#536878;font-size:14px}pre,.answer{white-space:pre-wrap;overflow-wrap:anywhere}pre{font:14px/1.65 ui-monospace,monospace;background:#f4f6f8;padding:12px}textarea{width:100%;min-height:65px;padding:8px;border:1px solid #b5c4cf;border-radius:5px}select{padding:6px;min-width:200px;margin:8px 8px 8px 0}fieldset{border:1px solid #d4dfe7;border-radius:6px;margin:12px 0;padding:12px}legend{padding:0 8px;font-weight:600}details{border-top:1px solid #e0e6eb;margin-top:10px;padding-top:8px}summary{cursor:pointer}.scale{font-size:14px;color:#536878}#message{white-space:pre-wrap;margin:10px 0;color:#713d00}@media(max-width:700px){.layout{grid-template-columns:1fr}nav{position:static;grid-template-columns:repeat(3,1fr);max-height:150px}main{padding:0 12px}header{padding:20px}}
</style>
<header><h1>第2章 · 单人匿名回答评分</h1><p>60份校准 → 锁定裁判与规则 → 60份验收。表中不显示模型、方法、预算或AI评分。</p></header>
<main>
<div class="bar"><label>加载本阶段 packets.json<br><input id="packets" type="file" accept=".json"></label><label>载入已导出草稿<br><input id="restore" type="file" accept=".json"></label><label>真人评审姓名<br><input id="reviewer" type="text" placeholder="填写实际评审人"></label></div>
<p id="message" role="status">请先选择 calibration/packets.json，载入已绑定的任务记录。验收阶段尚未解锁。</p>
<div class="bar"><span id="progress">未加载</span><button id="draft" disabled>导出草稿</button><button id="export" disabled>导出60份已完成评分</button><button id="previous" disabled>上一份</button><button id="next" disabled>下一份</button></div>
<div class="layout"><nav id="nav"></nav><article id="sample"><div class="card">请独立对照必要点、完整回答及原始资料评分。Unknown表示确实无法判断，空白表示尚未评分。普通评分不要求写理由；争议可简记。只评最终交付回答，不要求模型展示思考过程。</div></article></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),V='ch2_five_level_dual_eas';
let packet=null,labels=[],index=0,dirty=false;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const canonical=v=>Array.isArray(v)?'['+v.map(canonical).join(',')+']':v!==null&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}':JSON.stringify(v);
async function digest(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical(v)));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
const validScore=v=>[0,.25,.5,.75,1,'unknown'].includes(v);
const complete=(p,l)=>p.binding_status==='bound'&&!!l.reviewer?.trim()&&l.record.points.every(x=>validScore(x.score))&&validScore(l.record.fact_gate)&&(p.conditional?validScore(l.record.applicability_gate):l.record.applicability_gate==='not_applicable');
function blank(p){return {sample_id:p.sample_id,reviewer:null,reviewed_utc:null,packet_sha256:null,record:{schema_version:V,sample_id:p.sample_id,judge_id:'human',judge_version:'single-human-reference-v1',status:'pending',points:p.criteria.map(c=>({criterion_id:c.criterion_id,score:null,reason:'',answer_quote:''})),fact_gate:null,applicability_gate:p.conditional?null:'not_applicable',reason:''}}}
function update(){if(!packet)return;const n=packet.samples.filter((p,i)=>complete(p,labels[i])).length,bound=packet.samples.filter(p=>p.binding_status==='bound'),failed=bound.filter(p=>p.generation_failed).length;$('progress').textContent=`${packet.phase==='calibration'?'校准':'验收'}：${n}/60份人工复核完成；${bound.length}/60条任务已绑定，有效回答${bound.length-failed}份，生成失败${failed}条`;$('export').disabled=n!==60;$('draft').disabled=false;$('previous').disabled=index===0;$('next').disabled=index===59;[...$('nav').children].forEach((n,i)=>{n.className=(i===index?'active ':'')+(complete(packet.samples[i],labels[i])?'done':'')})}
function chooser(value,onchange,disabled=false){const s=el('select');for(const [v,t] of [['','— 尚未评分 —'],['0','0 · 未满足'],['0.25','0.25 · 少量满足'],['0.5','0.5 · 部分满足'],['0.75','0.75 · 大部分满足'],['1','1 · 完整满足'],['unknown','Unknown · 确实无法判断']]){const o=el('option',t);o.value=v;s.append(o)}s.value=value===null?'':String(value);s.disabled=disabled;s.onchange=()=>{onchange(s.value===''?null:s.value==='unknown'?'unknown':Number(s.value));dirty=true;update()};return s}
function draw(){if(!packet)return;const p=packet.samples[index],l=labels[index],a=$('sample');a.replaceChildren();a.append(el('h2',`第${index+1}份 · ${p.sample_id}`));const card=el('div',undefined,'card');a.append(card);card.append(el('h3','用户问题'),el('p',p.question),el('p','题目编号：'+p.question_id,'muted'),el('h3','匿名最终回答'));
if(p.binding_status!=='bound'){card.append(el('p','该任务尚无可评分回答，等待生成结果或传输核对。当前不能评分或导出全部完成标签。','notice'))}else{card.append(el('div',p.answer,'answer'));if(p.generation_failed)card.append(el('p','该任务未生成有效最终回答。请核验记录；计算端保留生成失败为0的规则。','notice'))}
if(p.binding_status==='bound'&&!p.generation_failed){card.append(el('h3','回答提交的引用'));const refs=el('ul');for(const r of p.references||[])refs.append(el('li',`${r.path}:${r.start}–${r.end}`));card.append(refs);if(!p.references?.length)card.append(el('p','回答未提交独立引用。','muted'))}
card.append(el('h3','参考答案与必要点'));const list=el('ol');p.criteria.forEach(c=>list.append(el('li',c.claim)));card.append(list,el('p','允许的回答范围：'+p.acceptable_answer_range),el('p','适用条件：'+p.applicability));if(p.critical_errors.length){card.append(el('p','应留意的错误：'+p.critical_errors.join('；')))}
const src=el('details');src.open=true;src.append(el('summary','原始资料依据（请同时留意上下文与公式疑点）'));for(const s of p.sources){const d=el('details');d.append(el('summary',`${s.evidence_id} · ${s.path}:${s.line_start}–${s.line_end}`),el('pre',s.excerpt),el('p','原文件SHA256：'+s.file_sha256,'muted'));src.append(d)}card.append(src);
const f=el('div',undefined,'card');a.append(f);f.append(el('h3','人工评分'),el('p','必要点K逐项评分；F评整答实质性事实；A只评条件判断。K的各必要点等权。0／0.25／0.5／0.75／1分别表示未满足／少量／部分／大部分／完整满足。','scale'));
const disabled=p.binding_status!=='bound';p.criteria.forEach((c,i)=>{const fs=el('fieldset');fs.append(el('legend',c.criterion_id),el('div',c.claim),chooser(l.record.points[i].score,v=>l.record.points[i].score=v,disabled));const t=el('textarea');t.placeholder='可选：简短争议备注或回答摘录';t.value=l.record.points[i].reason;t.disabled=disabled;t.oninput=()=>{l.record.points[i].reason=t.value;dirty=true};fs.append(t);f.append(fs)});
for(const [key,title,desc] of [['fact_gate','F · 事实正确性','从严重错误到全部实质性事实正确，按五档评分。'],['applicability_gate','A · 适用条件判断','条件题必须评分；非条件题固定N/A，不计入分母。']]){const fs=el('fieldset');fs.append(el('legend',title),el('p',desc,'scale'));if(key==='applicability_gate'&&!p.conditional)fs.append(el('p','N/A · 非条件题'));else fs.append(chooser(l.record[key],v=>l.record[key]=v,disabled));f.append(fs)}
const note=el('textarea');note.placeholder='可选：整答争议、资料或Gold问题';note.value=l.record.reason;note.disabled=disabled;note.oninput=()=>{l.record.reason=note.value;dirty=true};f.append(note);update()}
$('packets').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.schema!=='human_review_packets_v1'||v.samples?.length!==60||new Set(v.samples.map(p=>p.sample_id)).size!==60)throw Error('不是60份当前人工材料');if(!v.enabled_for_review)throw Error('验收阶段尚未解锁；请先完成校准和规则锁定。');if(!['calibration','acceptance'].includes(v.phase))throw Error('阶段无效');packet=v;labels=v.samples.map(blank);labels.forEach(l=>l.reviewer=$('reviewer').value.trim()||null);index=0;$('nav').replaceChildren();v.samples.forEach((p,i)=>{const b=el('button',`${String(i+1).padStart(2,'0')} · ${p.sample_id.slice(-6)}`);b.onclick=()=>{index=i;draw()};$('nav').append(b)});$('message').textContent='已载入。评分只保存在当前页面；请及时导出草稿。';dirty=false;draw()}catch(err){$('message').textContent=err.message}};
$('reviewer').oninput=()=>{labels.forEach(l=>l.reviewer=$('reviewer').value.trim()||null);dirty=true;update()};
$('previous').onclick=()=>{index--;draw()};$('next').onclick=()=>{index++;draw()};
async function download(finished){try{if(!packet)throw Error('请先载入材料');for(let i=0;i<labels.length;i++){const l=labels[i],p=packet.samples[i];l.reviewer=$('reviewer').value.trim()||null;l.packet_sha256=await digest(p);l.record.status=complete(p,l)?'complete':'pending';if(l.record.status==='complete'&&!l.reviewed_utc)l.reviewed_utc=new Date().toISOString()}if(finished&&labels.some((l,i)=>!complete(packet.samples[i],l)))throw Error('60份真实回答和所有评分项须完整');const v={schema:'human_review_labels_v1',phase:packet.phase,labels},blob=new Blob([JSON.stringify(v,null,2)+'\n'],{type:'application/json'}),link=el('a');link.href=URL.createObjectURL(blob);link.download=`${packet.phase}_${finished?'completed':'draft'}_human_labels.json`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);dirty=false;update()}catch(err){$('message').textContent=err.message}}
$('draft').onclick=()=>download(false);$('export').onclick=()=>download(true);
$('restore').onchange=async e=>{try{if(!packet)throw Error('先载入相应packets.json');const v=JSON.parse(await e.target.files[0].text());if(v.schema!=='human_review_labels_v1'||v.phase!==packet.phase||v.labels?.length!==60||new Set(v.labels.map(l=>l.sample_id)).size!==60)throw Error('草稿阶段或样本数量不一致');const by=new Map(v.labels.map(l=>[l.sample_id,l]));const restored=[];for(const p of packet.samples){const l=by.get(p.sample_id);if(!l||l.record.judge_id!=='human'||l.record.schema_version!==V||l.packet_sha256!==await digest(p)||canonical(l.record.points.map(x=>x.criterion_id).sort())!==canonical(p.criteria.map(x=>x.criterion_id).sort()))throw Error('草稿与当前题目、回答或必要点不一致');restored.push(l)}labels=restored;$('reviewer').value=labels[0].reviewer||'';dirty=false;draw();$('message').textContent='草稿已恢复。'}catch(err){$('message').textContent=err.message}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script></html>
